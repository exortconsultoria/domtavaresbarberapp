<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom Tavares — ERP de Barbearia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* Tema escuro (opcional — o padrão do app é o claro, em body.light) */
  :root {
    --bg: #14171b;
    --surface: #1b1f24;
    --surface-2: #21262c;
    --surface-3: #2a3037;
    --border: #2e353d;
    --border-light: #3d4650;
    --text: #e6eaef;
    --text-dim: #97a1ad;
    --text-mute: #6b7684;
    --accent: #4a90d9;
    --accent-bright: #68a6e6;
    --accent-soft: rgba(74,144,217,.16);
    --on-accent: #0f1418;
    /* status: agendado(cinza claro)/confirmado(azul)/concluído(verde)/cancelado(cinza)/faltou(vermelho) */
    --st-pend: #7a8593;           --st-pend-soft: rgba(122,133,147,.20);
    --st-wait: #9aa5b3;           --st-wait-soft: rgba(154,165,179,.18);
    --st-late: #d15b53;           --st-late-soft: rgba(209,91,83,.18);
    --st-done: #58a878;           --st-done-soft: rgba(88,168,120,.20);
    --green: #58a878;   --green-soft: rgba(88,168,120,.18);   --green-bright: #6fbf8e;
    --red: #d15b53;     --red-soft: rgba(209,91,83,.16);      --red-bright: #e2756d;
    --blue: #68a6e6;    --blue-soft: rgba(104,166,230,.18);
    --yellow: #d9a63c;  --yellow-soft: rgba(217,166,60,.16);
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-cond: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 10px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.28);
    --shadow-md: 0 6px 24px rgba(0,0,0,.38);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
    font-size: 15px;
  }
  /* Tema claro — padrão do app */
  body.light {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --surface-3: #e8ebef;
    --border: #dfe3e8;
    --border-light: #cbd2da;
    --text: #14181d;
    --text-dim: #58636f;
    --text-mute: #6b7684;   /* claro lava os cinzas: mute mais escuro que no dark p/ manter leitura */
    --accent: #2f6fb0;
    --accent-bright: #2a6199;
    --accent-soft: rgba(47,111,176,.10);
    --on-accent: #ffffff;
    --st-pend: #7a8593;           --st-pend-soft: rgba(122,133,147,.14);
    /* tons de texto das pills: escurecidos até passarem 4.5:1 sobre o próprio fundo tingido */
    --st-wait: #5a6472;           --st-wait-soft: rgba(107,118,132,.13);
    --st-late: #b5342b;           --st-late-soft: rgba(192,57,47,.11);
    --st-done: #2a6f48;           --st-done-soft: rgba(47,125,81,.12);
    --green: #2a6f48;   --green-soft: rgba(47,125,81,.11);    --green-bright: #2a6f48;
    --red: #b5342b;     --red-soft: rgba(192,57,47,.11);      --red-bright: #b5342b;
    --blue: #2a6199;    --blue-soft: rgba(47,111,176,.12);
    --yellow: #a9761a;  --yellow-soft: rgba(169,118,26,.12);
    --shadow-sm: 0 1px 3px rgba(16,24,40,.06);
    --shadow-md: 0 4px 16px rgba(16,24,40,.09);
    --shadow-lg: 0 12px 36px rgba(16,24,40,.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    min-height: 100vh; transition: background .25s, color .25s;
    -webkit-font-smoothing: antialiased;
  }
  /* textura cinematográfica (só no dark) */
  body:not(.light)::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.013) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.013) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  body:not(.light)::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 95% 65% at 50% 0%, transparent 52%, rgba(0,0,0,.55) 100%);
  }
  h1, h2, h3, .dw-title, .cal-title, .tbl-title, .m-title { font-family: var(--font-display); }
  button, input, select, textarea { font-family: inherit; }

  /* ════════ Janela / sidebar / chrome ════════ */
  .appwin {
    position: relative; z-index: 1; margin: 20px auto;
    display: flex; align-items: stretch;
    width: calc(100% - 40px); max-width: 1380px; height: calc(100vh - 40px);
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--surface); box-shadow: var(--shadow-lg); overflow: hidden;
  }
  body:not(.light) .appwin { background: rgba(255,255,255,.022); }
  @media (max-width: 760px) { .appwin { width: 100%; height: 100vh; margin: 0; border: none; border-radius: 0; } }
  .bottom-nav { display: none; }

  .app-sidebar {
    width: 216px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--surface-2); border-right: 1px solid var(--border);
    transition: width .22s ease; overflow: hidden; position: relative;
  }
  body:not(.light) .app-sidebar { background: rgba(255,255,255,.03); }
  .appwin.sidebar-collapsed .app-sidebar { width: 72px; }
  .sb-top { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 12px 16px; border-bottom: 1px solid var(--border); }
  .sb-burger {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; align-self: flex-end;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .sb-burger:hover { color: var(--accent); border-color: var(--accent); }
  .appwin.sidebar-collapsed .sb-burger { align-self: center; }
  .sb-logo {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    color: var(--on-accent); font-weight: 700; font-size: 1rem; letter-spacing: -.5px;
    box-shadow: var(--shadow-sm);
  }
  .sb-brand { text-align: center; line-height: 1.2; }
  .sb-brand .b1 { font-family: var(--font-display); font-size: .92rem; font-weight: 700; }
  .sb-brand .b2 { font-size: .58rem; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.6px; margin-top: 2px; }
  .appwin.sidebar-collapsed .sb-brand { display: none; }

  .sb-nav { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 16px 12px; overflow-y: auto; }
  .tab-btn {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; gap: 11px; transition: all .15s;
    justify-content: flex-start; width: 100%; padding: 13px 14px; border-radius: 11px;
    white-space: nowrap; font-size: .82rem; font-weight: 600; font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface-3); }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent-bright); }
  .tab-btn svg { flex-shrink: 0; width: 17px; height: 17px; }
  .appwin.sidebar-collapsed .tab-btn { justify-content: center; padding: 14px; }
  .appwin.sidebar-collapsed .tab-btn .sb-label, .appwin.sidebar-collapsed .tab-btn .sb-count { display: none; }
  .sb-count { margin-left: auto; background: var(--accent); color: var(--on-accent); font-size: .66rem; font-weight: 800;
    padding: 1px 7px; border-radius: 99px; line-height: 1.5; }
  .sb-count:empty { display: none; }
  .sb-bottom { padding: 12px 10px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .sb-bottom .btn-icon { width: 100%; border-radius: 10px; }
  .appwin.sidebar-collapsed .sb-bottom .btn-icon { width: 40px; margin: 0 auto; }

  .app-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  header.chrome {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; padding: 13px 20px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: transparent; z-index: 5;
  }
  header.chrome::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-bright) 16%, transparent 62%);
  }
  .chrome-title h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
  .chrome-title span { display: block; font-size: .64rem; color: var(--text-mute); font-weight: 500;
    text-transform: uppercase; letter-spacing: 1.3px; margin-top: 3px; font-family: var(--font-cond); }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn {
    background: var(--accent); color: var(--on-accent); border: none; cursor: pointer;
    padding: 10px 18px; border-radius: var(--radius); font-weight: 700; font-size: .88rem;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-weight: 600; }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); filter: none; }
  .btn-danger { background: transparent; border: 1px solid rgba(179,64,58,.45); color: var(--red-bright); font-weight: 600; }
  .btn-danger:hover { background: var(--red-soft); filter: none; }
  .btn-ok { background: var(--st-done); color: #fff; }
  .btn-icon {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    width: 40px; height: 40px; border-radius: var(--radius); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; transition: all .15s;
  }
  .btn-icon:hover { color: var(--accent); border-color: var(--accent); }
  .mini {
    background: none; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
    font-size: .7rem; font-weight: 700; padding: 5px 11px; border-radius: 7px; transition: all .15s;
  }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .mini.ok:hover { color: var(--st-done); border-color: var(--st-done); }
  .mini.no:hover { color: var(--st-late); border-color: var(--st-late); }

  .sync-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 99px; padding: 8px 14px; font-size: .72rem; color: var(--text-dim);
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .sync-chip:hover { border-color: var(--accent); color: var(--text); }
  .sync-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; box-shadow: 0 0 6px rgba(124,144,99,.6); }
  .sync-chip.saving .dot { background: var(--accent); animation: pulse 1s infinite; }
  .sync-chip.erro { border-color: var(--red); color: var(--red); }
  .sync-chip.erro .dot { background: var(--red); box-shadow: none; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* filtros no chrome */
  .filtros-wrap { position: relative; }
  .filtros-badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: var(--on-accent);
    font-size: .6rem; min-width: 16px; height: 16px; border-radius: 99px; display: flex; align-items: center;
    justify-content: center; padding: 0 4px; font-weight: 800; }
  .filtros-panel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 70; width: 260px;
    max-width: calc(100vw - 20px); background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-md); padding: 14px; display: none; flex-direction: column; gap: 4px; }
  .filtros-panel.open { display: flex; }
  .filtros-panel label { font-size: .64rem; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); font-weight: 700; margin-top: 6px; }
  .filtros-panel select { width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: .84rem; outline: none; }

  main#main { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 26px 90px; position: relative; z-index: 1; }
  @media (max-width: 640px) { main#main { padding: 18px 14px 90px; } }

  /* ════════ Blocos de conteúdo ════════ */
  .greet h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.4px; }
  .greet .sentence { font-family: var(--font-body); font-size: .95rem; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }
  .greet .sentence b { font-weight: 700; color: var(--text); }
  .g-brass { color: var(--accent-bright); } .g-green { color: var(--green-bright); }
  .g-red { color: var(--red-bright); } .g-blue { color: var(--blue); }

  .cmd { display: flex; align-items: center; gap: 18px; margin-top: 20px; padding: 18px 22px; cursor: pointer;
    border-radius: 16px; border: 1px solid var(--border-light);
    background: linear-gradient(120deg, var(--accent-soft), transparent); transition: border-color .15s, transform .15s; }
  .cmd:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cmd .big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: var(--accent-bright); letter-spacing: -1.5px; line-height: 1; }
  .cmd .ctxt { flex: 1; } .cmd .ctxt .t { font-size: .96rem; font-weight: 700; } .cmd .ctxt .s { font-size: .76rem; color: var(--text-dim); margin-top: 3px; }
  .cmd .go { color: var(--accent); font-size: 1.4rem; }

  .section-label { font-size: .66rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-mute); font-weight: 700; margin: 24px 2px 12px; display: block; font-family: var(--font-cond); }

  .m-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .m-cards-3 { grid-template-columns: repeat(3, 1fr); }
  .m-cards-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .m-cards, .m-cards-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .m-cards, .m-cards-3, .m-cards-2 { grid-template-columns: 1fr; } }
  .m3d { position: relative; padding: 18px; border-radius: 15px;
    background: linear-gradient(158deg, rgba(255,255,255,.06), rgba(255,255,255,.018));
    border: 1px solid var(--border); border-top-color: var(--border-light);
    box-shadow: 0 16px 26px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .25s ease, box-shadow .25s ease; }
  body.light .m3d { background: var(--surface); box-shadow: var(--shadow-sm); }
  .m3d:hover { transform: perspective(900px) translateY(-4px) rotateX(5deg); box-shadow: 0 26px 40px -16px rgba(0,0,0,.7); }
  .m3d .ico { position: absolute; top: 15px; right: 15px; color: var(--accent); opacity: .8; }
  .m3d .ico svg { width: 24px; height: 24px; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m3d .num { font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
  .m3d .num.sm { font-size: 1.5rem; }
  .m3d .lbl { font-size: .74rem; color: var(--text-dim); margin-top: 7px; font-weight: 500; }
  .m3d .hint { font-size: .64rem; color: var(--text-mute); margin-top: 2px; }

  .p-block { padding: 16px 18px 18px; background: rgba(255,255,255,.022);
    border: 1px solid var(--border); border-radius: 16px; min-width: 0; }
  body.light .p-block { background: var(--surface); }
  .p-block .pb-label { font-size: .66rem; text-transform: uppercase; letter-spacing: 1.4px; font-family: var(--font-cond);
    color: var(--text-mute); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .p-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .p-row2 { grid-template-columns: 1fr; } }

  .li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--border); }
  .li:last-child { border-bottom: none; }
  .li.clickable { cursor: pointer; } .li.clickable:hover { background: var(--accent-soft); border-radius: 8px; }
  .li .lbar { width: 3px; height: 36px; border-radius: 3px; flex-shrink: 0; background: var(--accent); }
  .li .lbody { flex: 1; min-width: 0; }
  .li .lt { font-size: .85rem; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .li .lm { font-size: .7rem; color: var(--text-mute); margin-top: 2px; }
  .li .lend { font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .li .ava, .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-3); flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; font-size: .66rem; font-weight: 800;
    color: var(--accent-bright); border: 1px solid var(--border-light); }
  .li .ava svg { width: 15px; height: 15px; }
  .empty-soft { color: var(--text-mute); font-size: .82rem; padding: 16px 2px; text-align: center; }

  .st-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .st-row:last-child { margin-bottom: 0; }
  .st-name { width: 130px; font-size: .74rem; color: var(--text-dim); flex-shrink: 0; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-track { flex: 1; height: 9px; background: rgba(128,128,128,.18); border-radius: 99px; overflow: hidden; }
  .st-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s ease; }
  .st-val { min-width: 34px; font-size: .78rem; font-weight: 700; text-align: right; color: var(--text-dim); }

  .goal { margin-top: 18px; padding: 16px 20px; border-radius: 14px; border: 1px solid var(--border); background: rgba(128,128,128,.05); }
  .goal .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .goal .gh .gt { font-size: .8rem; font-weight: 700; }
  .goal .gh .gv { font-size: .78rem; color: var(--text-dim); }
  .goal .gtrack { height: 11px; background: rgba(128,128,128,.2); border-radius: 99px; overflow: hidden; }
  .goal .gfill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); transition: width .6s ease; }

  .tag { font-size: .63rem; padding: 3px 9px; border-radius: 99px; font-weight: 700; letter-spacing: .2px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .tag.st-agendado { background: var(--st-wait-soft); color: var(--st-wait); }
  .tag.st-confirmado { background: var(--blue-soft); color: var(--blue); }
  .tag.st-concluido { background: var(--st-done-soft); color: var(--st-done); }
  .tag.st-cancelado { background: var(--st-pend-soft); color: var(--st-pend); }
  .tag.st-faltou { background: var(--st-late-soft); color: var(--st-late); }
  .tag.brass { background: var(--accent-soft); color: var(--accent-bright); }
  .tag.neutro { background: var(--surface-3); color: var(--text-dim); }
  .tag.pos { background: var(--green-soft); color: var(--green-bright); }
  .tag.neg { background: var(--red-soft); color: var(--red-bright); }
  body.light .m3d:hover { box-shadow: var(--shadow-md); }

  /* segmentos / abas */
  .dataview-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .view-seg button { background: none; border: none; color: var(--text-dim); padding: 8px 16px; border-radius: 8px;
    font-size: .81rem; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
  .view-seg button:hover { color: var(--text); }
  .view-seg button.active { background: var(--accent); color: var(--on-accent); }
  .modal-tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .mtab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim);
    padding: 9px 16px; font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: -1px; }
  .mtab:hover { color: var(--text); }
  .mtab.active { color: var(--accent-bright); border-bottom-color: var(--accent); }

  /* tabelas */
  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  body:not(.light) .tbl-wrap { background: rgba(255,255,255,.022); }
  .tbl-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .tbl-title { font-size: .92rem; font-weight: 700; }
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .66rem; text-transform: uppercase; letter-spacing: .8px; font-family: var(--font-cond);
    color: var(--text-dim); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }

/* ══════════════════════════════════════════════════════════════
   Dom Tavares — ERP de Barbearia (single-file)
   Persistência: localStorage com fallback em memória.
   Shape de dados pensado para migrar direto para o Supabase.
   ══════════════════════════════════════════════════════════════ */

/* ─────────── Supabase (conexão) ───────────
   A anon key abaixo é pública por natureza: só funciona se o RLS deixar,
   e o schema.sql trava tudo pra role "authenticated". Sem login ainda,
   então por enquanto o app só verifica se dá pra alcançar o Supabase —
   os dados continuam indo pro Store (localStorage) até o login existir. */
const SUPABASE_URL = 'https://ttqflxpsqmkzfrjvjtvp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cWZseHBzcW1remZyanZqdHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDQyOTUsImV4cCI6MjEwMTcyMDI5NX0.jBNfursbYMc8U6DVQ7Aw93McEM7CwMuWJFTGuDxCk14';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let sbStatus = 'checando';   // 'checando' | 'online' | 'offline'
async function checarSupabase() {
  if (!sb) { sbStatus = 'offline'; updateSyncChip(); return; }
  try {
    await sb.from('configuracoes').select('id', { head: true, count: 'exact' });
    sbStatus = 'online';
  } catch (e) {
    sbStatus = 'offline';
  }
  updateSyncChip();
}

/* ─────────── Persistência (Store resiliente) ─────────── */
const Store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } },
    del(k) { try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();
const DB_KEY = 'domtavares_db';
const CONFIG_PADRAO = {

const COLECOES = Object.keys(MAP);
const configToRow = c => ({ id: true, nome_usuario: c.nomeUsuario, nome_barbearia: c.nomeBarbearia,

let nuvem = null;              // espelho do que já está no Supabase
let syncEstado = 'ok';         // 'ok' | 'enviando' | 'erro'
let syncTimer = null;

function agendarSync() {
  if (!sb || sbStatus !== 'online' || !nuvem) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sincronizar, 400);   // junta rajadas de saveDB numa só ida
}

/* manda para a nuvem apenas as linhas que mudaram desde o último espelho */
async function sincronizar() {
  if (!sb || sbStatus !== 'online' || !nuvem) return;
  syncEstado = 'enviando'; updateSyncChip();
  try {
    for (const chave of COLECOES) {
      const m = MAP[chave];
      const atuais = db[chave] || [];
      const antes = new Map((nuvem[chave] || []).map(o => [o.id, JSON.stringify(m.toRow(o))]));
      const linhas = atuais.filter(o => antes.get(o.id) !== JSON.stringify(m.toRow(o)));
      const idsAgora = new Set(atuais.map(o => o.id));
      const apagar = [...antes.keys()].filter(id => !idsAgora.has(id));

      if (linhas.length) {
        const { error } = await sb.from(m.tabela).upsert(linhas.map(m.toRow));
        if (error) throw new Error(`${m.tabela}: ${error.message}`);
      }
      if (apagar.length) {
        const { error } = await sb.from(m.tabela).delete().in('id', apagar);
        if (error) throw new Error(`${m.tabela} (apagar): ${error.message}`);
      }
    }
    if (JSON.stringify(configToRow(db.config)) !== JSON.stringify(configToRow(nuvem.config || {}))) {
      const { error } = await sb.from('configuracoes').upsert(configToRow(db.config));
      if (error) throw new Error(`configuracoes: ${error.message}`);
    }
    nuvem = JSON.parse(JSON.stringify({ ...COLECOES.reduce((a, k) => (a[k] = db[k], a), {}), config: db.config }));
    syncEstado = 'ok';
  } catch (e) {
    syncEstado = 'erro';
    toast(`Não consegui salvar na nuvem: ${esc(e.message)}<br><small>Os dados estão salvos neste aparelho.</small>`, '⚠️');
  }
  updateSyncChip();
}

/* baixa tudo do Supabase para dentro do `db` */
async function baixarDaNuvem() {
  const res = await Promise.all(COLECOES.map(k => sb.from(MAP[k].tabela).select('*')));
  const erro = res.find(r => r.error);
  if (erro) throw new Error(erro.error.message);
  const baixado = {};
  COLECOES.forEach((k, i) => { baixado[k] = (res[i].data || []).map(MAP[k].fromRow); });
  const cfg = await sb.from('configuracoes').select('*').limit(1);
  if (cfg.error) throw new Error(cfg.error.message);
  baixado.config = cfg.data && cfg.data[0]
    ? Object.assign({}, CONFIG_PADRAO, configFromRow(cfg.data[0]))
    : Object.assign({}, CONFIG_PADRAO);
  return baixado;
}

/* IDs antigos eram curtos (não-UUID). Antes de subir, troca por UUID
   e conserta todas as referências entre as tabelas. */
function migrarIdsParaUUID() {
  const mapa = new Map();
  const novoId = velho => {
    if (!velho) return velho;
    if (ehUUID(velho)) return velho;
    if (!mapa.has(velho)) mapa.set(velho, uid());
    return mapa.get(velho);
  };
  COLECOES.forEach(k => (db[k] || []).forEach(o => { o.id = novoId(o.id); }));
  (db.agendamentos || []).forEach(a => {
    a.clienteId = novoId(a.clienteId); a.servicoId = novoId(a.servicoId); a.profissionalId = novoId(a.profissionalId);
  });
  (db.financeiro || []).forEach(f => { if (f.agendamentoId) f.agendamentoId = novoId(f.agendamentoId); });
  (db.msgLog || []).forEach(l => { l.clienteId = novoId(l.clienteId); });
  return mapa.size;
}

/* Decide quem manda na hora de entrar: nuvem cheia vence; nuvem vazia recebe o local. */
async function conectarNuvem() {
  if (!sb || sbStatus !== 'online') return;
  try {
    const remoto = await baixarDaNuvem();
    const temNaNuvem = COLECOES.some(k => (remoto[k] || []).length);
    const temLocal = COLECOES.some(k => (db[k] || []).length);
    if (temNaNuvem) {
      db = Object.assign(remoto, { _upd: Date.now() });
      normalizeDB();
      nuvem = JSON.parse(JSON.stringify({ ...COLECOES.reduce((a, k) => (a[k] = db[k], a), {}), config: db.config }));
      Store.set(DB_KEY, JSON.stringify(db));
    } else if (temLocal) {
      const trocados = migrarIdsParaUUID();
      nuvem = { config: {} }; COLECOES.forEach(k => (nuvem[k] = []));
      await sincronizar();
      if (syncEstado === 'ok') toast(`Seus dados foram para a nuvem${trocados ? '' : ''} — agora abrem em qualquer aparelho.`, '☁️');
    } else {
      nuvem = { config: {} }; COLECOES.forEach(k => (nuvem[k] = []));
      await sincronizar();
    }
  } catch (e) {
    sbStatus = 'offline';
    toast(`Não consegui ler a nuvem: ${esc(e.message)}<br><small>Trabalhando só neste aparelho.</small>`, '📴');
  }
  updateSyncChip();
  render();
}

/* primary: aparece nos 4 slots fixos da barra inferior no celular; o resto cai dentro de "Mais".
   Cadastros junta Clientes/Serviços/Equipe/Metas — tudo que é "configurar", separado do dia a dia. */
const VIEWS = [
  { id: 'painel', label: 'Visão Geral', sub: 'Painel da barbearia', icon: ICO.painel, primary: true },
  { id: 'agenda', label: 'Agenda', sub: 'Atendimentos do dia', icon: ICO.agenda, primary: true },
  { id: 'cadastros', label: 'Cadastros', sub: 'Clientes, produtos, equipe e metas', icon: ICO.cadastros, primary: true },
  { id: 'financeiro', label: 'Financeiro', sub: 'Receitas e despesas', icon: ICO.financeiro, primary: true },
  { id: 'mensagens', label: 'Mensagens', sub: 'Disparo de WhatsApp', icon: ICO.msg }
];
let activeTab = 'painel';

function buildNav() {
  document.getElementById('nav').innerHTML = VIEWS.map(v => `
    <button class="tab-btn${v.id === activeTab ? ' active' : ''}" data-tab="${v.id}" onclick="switchTab('${v.id}')" title="${esc(v.label)}">
      ${v.icon}<span class="sb-label">${esc(v.label)}</span><span class="sb-count" id="cnt-${v.id}"></span>
    </button>`).join('');
  buildBottomNav();
}
const secundarios = () => VIEWS.filter(v => !v.primary);
function buildBottomNav() {
  const primarios = VIEWS.filter(v => v.primary);
  const emMais = secundarios().some(v => v.id === activeTab);
  document.getElementById('bottomNav').innerHTML = primarios.map(v => `
    <button class="tab-btn${v.id === activeTab ? ' active' : ''}" data-tab="${v.id}" onclick="switchTab('${v.id}')">
      ${v.icon}<span>${esc(v.label.replace('Visão Geral', 'Início'))}</span>
    </button>`).join('') + `
    <button class="tab-btn${emMais ? ' active' : ''}" onclick="abrirMais()">
      ${ICO.mais}<span>Mais</span>
    </button>`;
}
function abrirMais() {
  const body = secundarios().map(v => `
    <div class="li clickable" onclick="closeCModal();switchTab('${v.id}')">
      <div class="ava" style="color:var(--accent)">${v.icon}</div>
      <div class="lbody"><div class="lt">${esc(v.label)}</div><div class="lm">${esc(v.sub)}</div></div>
    </div>`).join('') + `
    <div class="li clickable" onclick="closeCModal();openConfig()">
      <div class="ava">⚙️</div>
      <div class="lbody"><div class="lt">Configurações</div><div class="lm">Nome, horário, fidelidade</div></div>
    </div>`;
  openCModal('Mais', body, [{ label: 'Fechar', cls: 'btn-ghost', fn: closeCModal }]);
}
function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  document.getElementById('chromeTitle').textContent = v.label;
  document.getElementById('chromeSub').textContent = v.sub;
  document.getElementById('filtrosWrap').style.display = id === 'agenda' ? '' : 'none';
  document.getElementById('filtrosPanel').classList.remove('open');
  document.getElementById('main').scrollTop = 0;
  buildBottomNav();
  render();
}
function updateBadges() {
  const hoje = db.agendamentos.filter(a => a.data === todayISO() && a.status !== 'cancelado').length;
  const baixo = db.servicos.filter(s => s.tipo === 'produto' && s.ativo && (s.estoque || 0) <= 3).length;
  const set = (k, n) => { const el = document.getElementById('cnt-' + k); if (el) el.textContent = n > 0 ? n : ''; };
  set('agenda', hoje); set('cadastros', baixo);
}
function render() {
  updateBadges();
  const el = document.getElementById('main');
  if (activeTab === 'painel') el.innerHTML = renderPainel();
  else if (activeTab === 'agenda') el.innerHTML = renderAgenda();
  else if (activeTab === 'cadastros') el.innerHTML = renderCadastros();
  else if (activeTab === 'mensagens') el.innerHTML = renderMensagens();
  else if (activeTab === 'financeiro') el.innerHTML = renderFinanceiro();
  if (activeTab === 'agenda') buildFiltrosPanel();
}

let cadTab = 'clientes';
function setCadTab(t) { cadTab = t; render(); }
function irParaMetas() { cadTab = 'metas'; switchTab('cadastros'); }
function renderCadastros() {
  return `
  <div class="modal-tabs">

/* ─────────── Métricas ─────────── */
/* barbearia de um homem só: sem sócio nem comissionado, a aba de comissões só polui a tela */
const equipeSimples = () => db.profissionais.filter(p => Number(p.comissao) > 0).length === 0;
/* Valor do atendimento: depois de concluído vale o preço congelado na conclusão,
   nunca o preço atual da tabela — senão reajustar um serviço reescreveria o passado. */
function valorDe(ag) {
  return ag && ag.valor !== undefined && ag.valor !== null ? Number(ag.valor) : precoSrv(ag.servicoId);
}
function comissaoDe(ag) {
  const pct = ag && ag.comissaoPct !== undefined && ag.comissaoPct !== null
    ? Number(ag.comissaoPct)
    : Number((getProf(ag.profissionalId) || {}).comissao) || 0;
  return valorDe(ag) * pct / 100;
}
function metrics(mk) {
  mk = mk || curMonthKey();
  const fin = db.financeiro.filter(f => monthKey(f.data) === mk);
  const receita = somaBy(fin.filter(f => f.tipo === 'receita'), f => f.valor);
  const despesa = somaBy(fin.filter(f => f.tipo === 'despesa'), f => f.valor);
  const conclMes = db.agendamentos.filter(a => a.status === 'concluido' && monthKey(a.data) === mk);
  const ticket = conclMes.length ? somaBy(conclMes, a => valorDe(a)) / conclMes.length : 0;
  const hoje = db.agendamentos.filter(a => a.data === todayISO() && a.status !== 'cancelado');
  const comissoes = somaBy(conclMes, comissaoDe);
  const meta = db.metas.find(m => m.mes === mk);
  return {
    mk, receita, despesa, lucro: receita - despesa - comissoes, conclMes, ticket, hoje, comissoes,
    meta: meta ? meta.valor : 0, metaPct: meta && meta.valor ? pct(receita, meta.valor) : null
  };
}
function ultimaVisita(clienteId) {
  const l = db.agendamentos.filter(a => a.clienteId === clienteId && a.status === 'concluido')
    .map(a => a.data).sort();
  return l.length ? l[l.length - 1] : null;
}
function clientesInativos() {
  const lim = isoOf(addDays(new Date(), -(Number(db.config.inativoDias) || 45)));
  return db.clientes.map(c => ({ c, ult: ultimaVisita(c.id) }))
    .filter(x => !x.ult || x.ult < lim)
    .sort((a, b) => String(a.ult || '').localeCompare(String(b.ult || '')));
}
function comissoesPorProf(mk) {
  mk = mk || curMonthKey();
  return db.profissionais.map(p => {
    const ags = db.agendamentos.filter(a => a.profissionalId === p.id && a.status === 'concluido' && monthKey(a.data) === mk);
    const fat = somaBy(ags, a => valorDe(a));
    return { p, atend: ags.length, fat, comissao: fat * (Number(p.comissao) || 0) / 100 };
  });
}

    ${passo(4, !!db.metas.length, 'Defina sua meta do mês',

function renderPainel() {
  if (appVazio()) return renderPrimeiroAcesso();
  const m = metrics();
  const hojeList = m.hoje.slice().sort((a, b) => a.hora.localeCompare(b.hora));
  const naoConf = hojeList.filter(a => a.status === 'agendado');
  const inativos = clientesInativos();

  /* manchete dinâmica */
  const frases = [];
  if (hojeList.length) frases.push(`Você tem <b class="g-brass">${hojeList.length} atendimento${hojeList.length > 1 ? 's' : ''}</b> hoje`);
  else frases.push('Nenhum atendimento marcado para hoje');
  if (naoConf.length) frases.push(`<b class="g-red">${naoConf.length}</b> ainda sem confirmação`);
  if (m.metaPct !== null) frases.push(`meta do mês em <b class="${m.metaPct >= 100 ? 'g-green' : 'g-brass'}">${m.metaPct}%</b>`);
  if (inativos.length) frases.push(`<b>${inativos.length}</b> cliente${inativos.length > 1 ? 's' : ''} sumido${inativos.length > 1 ? 's' : ''} há mais de ${db.config.inativoDias} dias`);

  /* próximos agendamentos */
  const prox = db.agendamentos
    .filter(a => (a.status === 'agendado' || a.status === 'confirmado') && a.data >= todayISO())
    .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora)).slice(0, 6);

  /* serviços mais realizados no mês */
  const cont = {};
  m.conclMes.forEach(a => { cont[a.servicoId] = (cont[a.servicoId] || 0) + 1; });
  const topSrv = Object.entries(cont).map(([id, n]) => ({ id, n })).sort((a, b) => b.n - a.n).slice(0, 5);
  const maxSrv = topSrv.length ? topSrv[0].n : 1;

  /* aniversariantes do mês */
  const mesAtual = pad2(new Date().getMonth() + 1);
  const nivers = db.clientes.filter(c => c.nasc && c.nasc.slice(5, 7) === mesAtual)
    .sort((a, b) => a.nasc.slice(8).localeCompare(b.nasc.slice(8)));

  return `
  <div class="greet">
    <h1>${greetingWord()}, ${esc(nomeUsuario())}.</h1>
    <div class="sentence">${frases.join(' · ')}.</div>
  </div>

  <div class="cmd" onclick="switchTab('agenda')">
    <div class="big">${hojeList.length}</div>
    <div class="ctxt">
      <div class="t">Agendamentos para hoje — ${fmtDateLong(todayISO())}</div>
      <div class="s">${hojeList.length ? `Primeiro às ${hojeList[0].hora} · ${esc(nomeCli(hojeList[0].clienteId))} com ${esc(nomeProf(hojeList[0].profissionalId))}` : 'Agenda livre. Que tal chamar os clientes inativos?'}</div>
    </div>
    <div class="go">›</div>
  </div>

  <span class="section-label">Mês de ${fmtMonth(m.mk)}</span>
  <div class="m-cards">
    ${card(moneyShort(m.receita), 'Faturamento do mês', `${m.conclMes.length} atendimentos concluídos`, ICO.money)}
    ${card(moneyShort(m.ticket), 'Ticket médio', 'por atendimento concluído', ICO.ticket)}
    ${card(String(m.hoje.length), 'Atendimentos hoje', `${naoConf.length} a confirmar`, ICO.clock)}
    ${equipeSimples()
      ? card(moneyShort(m.lucro), 'Sobra do mês', 'receitas − despesas', ICO.hand)
      : card(moneyShort(m.comissoes), 'Comissões a pagar', 'acumulado do mês', ICO.hand)}
  </div>

  ${m.meta ? `
  <div class="goal">
    <div class="gh">
      <span class="gt">Meta de ${fmtMonth(m.mk)}</span>
      <span class="gv">${money(m.receita)} de ${money(m.meta)} · faltam <b style="color:var(--text)">${money(Math.max(0, m.meta - m.receita))}</b></span>
    </div>
    <div class="gtrack"><div class="gfill" style="width:${Math.min(100, m.metaPct)}%"></div></div>
  </div>` : `
  <div class="goal"><div class="gh"><span class="gt">Sem meta definida para ${fmtMonth(m.mk)}</span>
    <button class="mini" onclick="irParaMetas()">Definir meta</button></div></div>`}

  <div class="p-row2">
    <div class="p-block">
      <span class="pb-label">Próximos agendamentos</span>
      ${prox.length ? prox.map(a => `
        <div class="li clickable" onclick="openApptDetail('${a.id}')">
          <div class="lbar" style="background:${corProf(a.profissionalId)}"></div>
          <div class="lbody">
            <div class="lt">${esc(nomeCli(a.clienteId))} ${stTag(a.status)}</div>
            <div class="lm">${fmtDateLong(a.data)} · ${a.hora} · ${esc(nomeSrv(a.servicoId))} · ${esc(nomeProf(a.profissionalId))}</div>
          </div>
          <div class="lend">${money(valorDe(a))}</div>
        </div>`).join('') : `<div class="empty-soft">Nenhum agendamento futuro.</div>`}
    </div>
    <div class="p-block">

      ${topSrv.length ? topSrv.map(s => `
        <div class="st-row">

          <div class="st-track"><div class="st-fill" style="width:${pct(s.n, maxSrv)}%"></div></div>
          <div class="st-val">${s.n}</div>
        </div>`).join('') : `<div class="empty-soft">Nenhum atendimento concluído neste mês.</div>`}
    </div>
  </div>

  <div class="p-row2">
    <div class="p-block">
      <span class="pb-label">Lembrar hoje <span class="tag neutro">${naoConf.length}</span></span>
      ${naoConf.length ? naoConf.map(a => {

        return `<div class="li">
          <div class="lbar" style="background:${corProf(a.profissionalId)}"></div>
          <div class="lbody">

          </div>
          ${waBtn(c.tel, msg, 'Lembrar')}

    </div>
    <div class="p-block">
      <span class="pb-label">Recuperar clientes <span class="tag neutro">${inativos.length}</span></span>

        return `<div class="li">

          <div class="lbody">
            <div class="lt">${esc(x.c.nome)}</div>

          </div>
          ${waBtn(x.c.tel, msg, 'Chamar')}

  <div class="p-block" style="margin-top:16px">
    <span class="pb-label">Aniversariantes de ${MES_LONGO[new Date().getMonth()]}</span>
    ${nivers.length ? nivers.map(c => {
      const dia = Number(c.nasc.slice(8, 10));
      const msg = `Parabéns, ${firstName(c.nome)}! 🎉 A Dom Tavares te deseja tudo de bom — passa aqui pra comemorar com um corte.`;
      return `<div class="li">
        <div class="ava">${esc(initials(c.nome))}</div>
        <div class="lbody">
          <div class="lt">${esc(c.nome)} <span class="tag brass">dia ${dia}</span></div>
          <div class="lm">${c.pontos || 0} ponto(s) de fidelidade</div>
        </div>
        ${waBtn(c.tel, msg, 'Parabenizar')}
      </div>`;
    }).join('') : `<div class="empty-soft">Nenhum aniversariante neste mês.</div>`}
  </div>`;
}
function card(num, lbl, hint, ico, small) {
  return `<div class="m3d">
    <div class="ico">${ico || ''}</div>
    <div class="num${small ? ' sm' : ''}">${num}</div>
    <div class="lbl">${esc(lbl)}</div>
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   VIEW: Agenda
   ══════════════════════════════════════════════════════════════ */
let agView = 'dia';       // 'dia' (padrão, celular) | 'cal' (semana) | 'lista'
let agWeek = 0;           // offset de semanas, usado por 'cal' e 'lista'
let agDia = todayISO();   // dia selecionado, usado por 'dia'
let agProf = '';          // filtro por profissional

function startOfWeek(offset) {
  const h = new Date();
  const seg = addDays(h, -((h.getDay() + 6) % 7));
  return addDays(seg, offset * 7);
}
function mondayOf(iso) { const d = parseISO(iso); return addDays(d, -((d.getDay() + 6) % 7)); }
function weekOffsetOf(iso) {
  const cur = mondayOf(todayISO()).getTime(), alvo = mondayOf(iso).getTime();
  return Math.round((alvo - cur) / (7 * 86400000));
}
function setAgView(v) {
  if (agView === 'dia' && v !== 'dia') agWeek = weekOffsetOf(agDia);
  if (agView !== 'dia' && v === 'dia') agDia = agWeek === 0 ? todayISO() : isoOf(startOfWeek(agWeek));
  agView = v; render();
}
function agNav(n) { agWeek += n; render(); }
function agHoje() { agWeek = 0; render(); }
function diaNav(n) { agDia = isoOf(addDays(parseISO(agDia), n)); render(); }
function diaHoje() { agDia = todayISO(); render(); }
function setAgDia(iso) { agDia = iso; render(); }
function setAgProf(v) { agProf = v; updateFiltrosBadge(); render(); }

function agFiltrada(list) { return agProf ? list.filter(a => a.profissionalId === agProf) : list; }

function renderAgenda() {
  const seg = startOfWeek(agWeek);
  const fim = addDays(seg, 6);
  const titulo = `${pad2(seg.getDate())} ${MES[seg.getMonth()]} — ${pad2(fim.getDate())} ${MES[fim.getMonth()]} ${fim.getFullYear()}`;
  return `
  <div class="dataview-bar">
    <span class="view-seg">
      <button class="${agView === 'dia' ? 'active' : ''}" onclick="setAgView('dia')">Dia</button>
      <button class="${agView === 'cal' ? 'active' : ''}" onclick="setAgView('cal')">Semana</button>
      <button class="${agView === 'lista' ? 'active' : ''}" onclick="setAgView('lista')">Lista</button>
    </span>
    <select class="srch" style="min-width:180px" onchange="setAgProf(this.value)">
      <option value="">Todos os profissionais</option>
      ${db.profissionais.map(p => `<option value="${p.id}"${agProf === p.id ? ' selected' : ''}>${esc(p.apelido || p.nome)}</option>`).join('')}
    </select>
    <button class="btn" data-mobile-hide style="margin-left:auto" onclick="openApptForm()">+ Novo agendamento</button>
  </div>
  ${agView === 'dia' ? diaView() : agView === 'cal' ? calGrid(seg, titulo) : agLista()}`;
}

/* view padrão no celular: um dia por vez, sem grade larga pra rolar com o polegar */
function diaView() {
  const seg = mondayOf(agDia);
  const dias = Array.from({ length: 7 }, (_, i) => isoOf(addDays(seg, i)));
  const hoje = todayISO();
  const contDia = {};
  dias.forEach(d => { contDia[d] = agFiltrada(db.agendamentos.filter(a => a.data === d && a.status !== 'cancelado')).length; });
  const doDia = agFiltrada(db.agendamentos.filter(a => a.data === agDia))
    .sort((a, b) => a.hora.localeCompare(b.hora));
  return `<div class="cal-wrap">
    <div class="cal-nav" style="justify-content:space-between">
      <button class="cal-nav-btn" onclick="diaNav(-1)" title="Dia anterior">‹</button>
      <div class="cal-title">${fmtDateLong(agDia)}${agDia === hoje ? ' <span class="tag brass">hoje</span>' : ''}</div>
      <button class="cal-nav-btn" onclick="diaNav(1)" title="Próximo dia">›</button>
    </div>
    <div class="dia-strip">
      ${dias.map(d => { const dt = parseISO(d);
        return `<button class="dia-chip${d === agDia ? ' active' : ''}${d === hoje ? ' today' : ''}" onclick="setAgDia('${d}')">
          <span class="dc-d">${DOW[dt.getDay()]}</span><span class="dc-n">${pad2(dt.getDate())}</span>
          ${contDia[d] ? '<span class="dc-dot"></span>' : ''}
        </button>`;
      }).join('')}
    </div>
    ${agDia !== hoje ? `<button class="mini" style="margin:10px 0 4px" onclick="diaHoje()">Voltar para hoje</button>` : ''}
    <div style="margin-top:14px">
      ${doDia.length ? doDia.map(a => `
        <div class="li clickable" onclick="openApptDetail('${a.id}')">
          <div class="lbar" style="background:${corProf(a.profissionalId)}"></div>
          <div class="lbody">
            <div class="lt">${a.hora} · ${esc(nomeCli(a.clienteId))} ${stTag(a.status)}</div>
            <div class="lm">${esc(nomeSrv(a.servicoId))} · ${esc(nomeProf(a.profissionalId))}</div>
          </div>
          <div class="lend">${money(valorDe(a))}</div>
        </div>`).join('') : `<div class="empty-soft">Nenhum atendimento neste dia. Toque no <b>+</b> pra agendar.</div>`}
    </div>
  </div>`;
}

function calGrid(seg, titulo) {
  const ini = hhmmToMin(db.config.abertura), fim = hhmmToMin(db.config.fechamento);
  const dias = Array.from({ length: 7 }, (_, i) => isoOf(addDays(seg, i)));
  const hoje = todayISO();
  const ags = agFiltrada(db.agendamentos.filter(a => dias.includes(a.data)));

  let head = `<div class="cal-corner"></div>` + dias.map(d => {
    const dt = parseISO(d);
    return `<div class="cal-dow${d === hoje ? ' today' : ''}"><div class="d1">${DOW[dt.getDay()]}</div><div class="d2">${pad2(dt.getDate())}</div></div>`;
  }).join('');

  let body = '';
  for (let h = ini; h < fim; h += 60) {
    body += `<div class="cal-hour">${minToHHMM(h)}</div>`;
    dias.forEach(d => {
      const noSlot = ags.filter(a => a.data === d && hhmmToMin(a.hora) >= h && hhmmToMin(a.hora) < h + 60)
        .sort((a, b) => a.hora.localeCompare(b.hora));
      body += `<div class="cal-slot${d === hoje ? ' today-col' : ''}" onclick="openApptForm({data:'${d}',hora:'${minToHHMM(h)}'})">
        ${noSlot.map(a => `<div class="cal-appt ${a.status === 'concluido' ? 'done' : ''}${a.status === 'cancelado' || a.status === 'faltou' ? ' cancel' : ''}"
             style="border-left-color:${corProf(a.profissionalId)}"
             onclick="event.stopPropagation();openApptDetail('${a.id}')" title="${esc(nomeCli(a.clienteId))} — ${esc(nomeSrv(a.servicoId))}">
             <div class="ca-h">${a.hora} · ${esc(nomeProf(a.profissionalId))}</div>
             <div class="ca-n">${esc(nomeCli(a.clienteId))}</div>
           </div>`).join('')}
      </div>`;
    });
  }

  return `<div class="cal-wrap">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="agNav(-1)" title="Semana anterior">‹</button>
      <button class="cal-nav-btn" onclick="agNav(1)" title="Próxima semana">›</button>
      <div class="cal-title">${titulo}</div>
      <button class="mini" onclick="agHoje()">Hoje</button>
      <div style="margin-left:auto;font-size:.76rem;color:var(--text-dim)">Clique num horário vago para agendar</div>
    </div>
    <div class="cal-scroll"><div class="cal-tbl">${head}${body}</div></div>
    <div class="cal-legend">
      ${db.profissionais.map(p => `<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${p.cor}"></div>${esc(p.apelido || p.nome)}</div>`).join('')}
    </div>
  </div>`;
}

function agLista() {
  const seg = startOfWeek(agWeek);
  const dias = Array.from({ length: 7 }, (_, i) => isoOf(addDays(seg, i)));
  const list = agFiltrada(db.agendamentos.filter(a => dias.includes(a.data)))
    .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  return `<div class="tbl-wrap">
    <div class="tbl-header">
      <div class="tbl-title">Atendimentos da semana</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="mini" onclick="agNav(-1)">‹ anterior</button>
        <button class="mini" onclick="agHoje()">hoje</button>
        <button class="mini" onclick="agNav(1)">próxima ›</button>
      </div>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Valor</th><th>Status</th></tr></thead>
      <tbody>${list.length ? list.map(a => `
        <tr onclick="openApptDetail('${a.id}')">
          <td>${fmtDateLong(a.data)}</td><td><b>${a.hora}</b></td>
          <td>${esc(nomeCli(a.clienteId))}</td><td>${esc(nomeSrv(a.servicoId))}</td>
          <td><span style="color:${corProf(a.profissionalId)};font-weight:700">${esc(nomeProf(a.profissionalId))}</span></td>
          <td>${money(valorDe(a))}</td><td>${stTag(a.status)}</td>
        </tr>`).join('') : `<tr><td colspan="7"><div class="empty-soft">Nenhum agendamento nesta semana.</div></td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

   VIEW: Clientes

let cliBusca = '';
function setCliBusca(v) {
  cliBusca = v;
  document.getElementById('cliBody').innerHTML = cliRows();
}
function cliFiltrados() {
  const q = cliBusca.trim().toLowerCase();
  const digits = onlyDigits(q);
  return db.clientes.filter(c =>
    !q || c.nome.toLowerCase().includes(q) || (digits && onlyDigits(c.tel).includes(digits))
  ).sort((a, b) => a.nome.localeCompare(b.nome));
}
function cliRows() {
  const list = cliFiltrados();
  if (!list.length) return `<tr><td colspan="5"><div class="empty-soft">Nenhum cliente encontrado.</div></td></tr>`;
  return list.map(c => {
    const ult = ultimaVisita(c.id);
    const resgate = Number(db.config.pontosResgate) || 10;
    return `<tr onclick="openClienteDetail('${c.id}')">
      <td><div style="display:flex;align-items:center;gap:10px">
        <span class="avatar">${esc(initials(c.nome))}</span><b>${esc(c.nome)}</b></div></td>
      <td>${esc(c.tel || '—')}</td>
      <td><span title="${c.pontos || 0} de ${resgate} pontos" style="color:var(--accent-bright);letter-spacing:1px">
        ${'●'.repeat(Math.min(c.pontos || 0, resgate))}<span style="color:var(--text-mute)">${'○'.repeat(Math.max(0, resgate - (c.pontos || 0)))}</span></span></td>
      <td>${ult ? fmtDateLong(ult) : '<span style="color:var(--text-mute)">nunca</span>'}</td>
      <td>${(c.pontos || 0) >= resgate ? '<span class="tag pos">resgate disponível</span>' : ''}</td>
    </tr>`;
  }).join('');
}
function renderClientes() {
  return `
  <div class="dataview-bar">
    <input class="srch" type="search" placeholder="🔍 Buscar por nome ou telefone..." value="${esc(cliBusca)}" oninput="setCliBusca(this.value)">
    <button class="btn" style="margin-left:auto" onclick="openClienteForm()">+ Novo cliente</button>
  </div>
  <div class="m-cards m-cards-3" style="margin-bottom:18px">
    ${card(String(db.clientes.length), 'Clientes cadastrados', '', ICO.clientes)}
    ${card(String(clientesInativos().length), 'Inativos', `sem visita há ${db.config.inativoDias} dias`, ICO.clock)}
    ${card(String(db.clientes.filter(c => (c.pontos || 0) >= (db.config.pontosResgate || 10)).length), 'Com resgate disponível', `${db.config.pontosResgate} pontos`, ICO.star)}
  </div>
  <div class="tbl-wrap">
    <div class="tbl-header"><div class="tbl-title">Base de clientes</div></div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Cliente</th><th>Telefone</th><th>Fidelidade</th><th>Última visita</th><th></th></tr></thead>

}

/* ══════════════════════════════════════════════════════════════
   VIEW: Mensagens — disparo de WhatsApp
   O WhatsApp não permite envio em massa por link: o wa.me abre uma
   conversa por vez. Então a tela monta a fila e marca quem já recebeu.
   ══════════════════════════════════════════════════════════════ */
let msgSeg = 'confirmar';
const MSG_SEGS = {
  confirmar: { label: 'Confirmar hoje', desc: 'Quem tem horário hoje e ainda não confirmou' },
  aniversario: { label: 'Aniversariantes', desc: 'Quem faz aniversário neste mês' },
  retorno: { label: 'Sumidos', desc: 'Quem não aparece há um tempo' },
  todos: { label: 'Todos os clientes', desc: 'Base inteira — use com parcimônia' }
};
const TPL_PADRAO = {
  confirmar: 'Olá {nome}! Aqui é da {barbearia}. Confirmando seu horário hoje às {hora}. Posso confirmar?',
  aniversario: 'Parabéns, {nome}! 🎉 A {barbearia} te deseja tudo de bom. Passa aqui pra comemorar com um corte.',
  retorno: 'Olá {nome}! Faz um tempo que você não aparece na {barbearia}. Bora marcar um horário?',
  todos: 'Olá {nome}! Aqui é da {barbearia}. '
};
const tplDe = seg => (db.config.templates && db.config.templates[seg]) || TPL_PADRAO[seg];
function setMsgSeg(s) { msgSeg = s; render(); }
function salvarTemplate() {
  db.config.templates = Object.assign({}, db.config.templates, { [msgSeg]: val('msgTpl') });
  saveDB(); render();
  toast('Modelo de mensagem salvo.', '💬');
}
function resetTemplate() {
  if (db.config.templates) delete db.config.templates[msgSeg];
  saveDB(); render();
  toast('Modelo voltou ao padrão.', '↩️');
}
/* destinatários do segmento: { c, hora } */
function msgDestinatarios(seg) {
  if (seg === 'confirmar') {
    return db.agendamentos
      .filter(a => a.data === todayISO() && a.status === 'agendado')
      .sort((a, b) => a.hora.localeCompare(b.hora))
      .map(a => ({ c: getCli(a.clienteId), hora: a.hora }))
      .filter(x => x.c);
  }
  if (seg === 'aniversario') {
    const mes = pad2(new Date().getMonth() + 1);
    return db.clientes.filter(c => c.nasc && c.nasc.slice(5, 7) === mes)
      .sort((a, b) => a.nasc.slice(8).localeCompare(b.nasc.slice(8))).map(c => ({ c }));
  }
  if (seg === 'retorno') return clientesInativos().map(x => ({ c: x.c, ult: x.ult }));
  return db.clientes.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(c => ({ c }));
}
function montarMsg(tpl, d) {
  return String(tpl)
    .replace(/\{nome\}/g, firstName(d.c.nome))
    .replace(/\{barbearia\}/g, nomeBarbearia())
    .replace(/\{hora\}/g, d.hora || '')
    .replace(/\{data\}/g, fmtDateLong(todayISO()));
}
const jaEnviou = (clienteId, seg) => db.msgLog.some(l => l.clienteId === clienteId && l.seg === seg && l.data === todayISO());
function marcarEnviado(clienteId, seg) {
  if (!jaEnviou(clienteId, seg)) db.msgLog.push({ id: uid(), clienteId, seg, data: todayISO() });
  saveDB();
  if (activeTab === 'mensagens') render();
}
function renderMensagens() {
  const dest = msgDestinatarios(msgSeg).filter(d => d.c);
  const tpl = tplDe(msgSeg);
  const enviados = dest.filter(d => jaEnviou(d.c.id, msgSeg)).length;
  const semTel = dest.filter(d => !onlyDigits(d.c.tel)).length;
  return `
  <div class="dataview-bar">
    <span class="view-seg" style="flex-wrap:wrap">
      ${Object.keys(MSG_SEGS).map(k => `<button class="${msgSeg === k ? 'active' : ''}" onclick="setMsgSeg('${k}')">${MSG_SEGS[k].label}</button>`).join('')}
    </span>
  </div>

  <div class="p-block" style="margin-bottom:16px">
    <span class="pb-label">Modelo da mensagem
      <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--text-dim)">
        use <code>{nome}</code>, <code>{barbearia}</code>, <code>{hora}</code>, <code>{data}</code></span></span>
    <textarea id="msgTpl" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:.87rem;outline:none;font-family:inherit;min-height:76px">${esc(tpl)}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="mini" onclick="salvarTemplate()">Salvar modelo</button>
      <button class="mini" onclick="resetTemplate()">Voltar ao padrão</button>
      <span style="margin-left:auto;font-size:.75rem;color:var(--text-mute);align-self:center">
        ${MSG_SEGS[msgSeg].desc}${msgSeg === 'retorno' ? ` (${db.config.inativoDias} dias)` : ''}
      </span>
    </div>
  </div>

  <div class="m-cards m-cards-3" style="margin-bottom:16px">
    ${card(String(dest.length), 'Na fila', MSG_SEGS[msgSeg].label.toLowerCase(), ICO.msg)}
    ${card(String(enviados), 'Enviados hoje', 'neste segmento', ICO.clock)}
    ${card(String(semTel), 'Sem telefone', 'não dá para disparar', ICO.clientes)}
  </div>

  <div class="p-block">
    <span class="pb-label">Fila de envio <span class="tag neutro">${dest.length}</span></span>
    ${dest.length ? dest.map(d => {
      const msg = montarMsg(tpl, d);
      const tel = onlyDigits(d.c.tel);
      const ok = jaEnviou(d.c.id, msgSeg);
      return `<div class="li">
        <div class="ava">${esc(initials(d.c.nome))}</div>
        <div class="lbody">
          <div class="lt">${esc(d.c.nome)} ${ok ? '<span class="tag pos">enviado hoje</span>' : ''}</div>
          <div class="lm">${d.hora ? d.hora + ' · ' : ''}${d.ult ? 'última visita ' + fmtDateLong(d.ult) : esc(d.c.tel || 'sem telefone')}</div>
          <div class="lm" style="color:var(--text-dim);margin-top:5px">${esc(msg)}</div>
        </div>
        ${tel
          ? `<a class="wa-btn" href="${waLink(d.c.tel, msg)}" target="_blank" rel="noopener" onclick="marcarEnviado('${d.c.id}','${msgSeg}')">${ok ? 'Enviar de novo' : 'Enviar'}</a>`
          : `<button class="mini" onclick="openClienteForm('${d.c.id}')">Add telefone</button>`}
      </div>`;
    }).join('') : `<div class="empty-soft">Ninguém nesta fila agora.</div>`}
  </div>

  <div style="font-size:.76rem;color:var(--text-mute);margin-top:14px;line-height:1.6">
    Cada botão abre a conversa do cliente no WhatsApp com o texto já escrito — você confere e aperta enviar lá.
    O WhatsApp não permite envio em massa por link, então o app organiza a fila e marca quem já recebeu hoje.
  </div>`;
}

function renderProfissionais() {

  return `

          <div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-dim)">Faturamento gerado <b style="color:var(--text)">${money(d.fat)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-dim)">Comissão a pagar <b style="color:var(--accent-bright)">${money(d.comissao)}</b></div>

}

let finTab = 'mov';
function setFinTab(t) { finTab = t; render(); }
function renderFinanceiro() {
  return `
  <div class="dataview-bar">
    <div class="modal-tabs" style="margin:0;border:none">
      <button class="mtab ${finTab === 'mov' ? 'active' : ''}" onclick="setFinTab('mov')">Receitas &amp; Despesas</button>
      ${equipeSimples() ? '' : `<button class="mtab ${finTab === 'com' ? 'active' : ''}" onclick="setFinTab('com')">Comissões</button>`}
      <button class="mtab ${finTab === 'proj' ? 'active' : ''}" onclick="setFinTab('proj')">Projeções</button>
    </div>
  </div>
  ${finTab === 'mov' ? finMov() : (finTab === 'com' && !equipeSimples()) ? finComissoes() : finTab === 'proj' ? finProj() : finMov()}`;
}

function finMov() {
  const m = metrics();
  const list = db.financeiro.filter(f => monthKey(f.data) === m.mk).sort((a, b) => b.data.localeCompare(a.data));
  const porForma = {};
  db.financeiro.filter(f => monthKey(f.data) === m.mk && f.tipo === 'receita').forEach(f => {
    const k = f.formaPag || 'outros'; porForma[k] = (porForma[k] || 0) + f.valor;
  });
  const maxF = Math.max(1, ...Object.values(porForma));
  return `
  <div class="m-cards">
    ${card(moneyShort(m.receita), 'Receitas do mês', fmtMonth(m.mk), ICO.money)}
    ${card(moneyShort(m.despesa), 'Despesas do mês', 'lançamentos manuais', ICO.box)}
    ${equipeSimples()
      ? card(String(m.conclMes.length), 'Atendimentos', 'concluídos no mês', ICO.hand)
      : card(moneyShort(m.comissoes), 'Comissões', 'sobre concluídos', ICO.hand)}
    ${card(moneyShort(m.lucro), 'Resultado', equipeSimples() ? 'receitas − despesas' : 'receitas − despesas − comissões', ICO.ticket)}
  </div>
  <div class="p-row2">
    <div class="p-block" style="grid-column:1/-1">
      <span class="pb-label">Receitas por forma de pagamento</span>
      ${Object.keys(porForma).length ? Object.entries(porForma).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
        <div class="st-row">
          <div class="st-name">${PAG_LABEL[k] || k}</div>
          <div class="st-track"><div class="st-fill" style="width:${pct(v, maxF)}%"></div></div>
          <div class="st-val" style="min-width:80px">${money(v)}</div>
        </div>`).join('') : `<div class="empty-soft">Sem receitas no mês.</div>`}
    </div>
  </div>
  <div class="tbl-wrap" style="margin-top:16px">
    <div class="tbl-header">
      <div class="tbl-title">Lançamentos de ${fmtMonth(m.mk)}</div>
      <button class="btn" onclick="openFinForm()">+ Novo lançamento</button>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma</th><th>Valor</th><th></th></tr></thead>
      <tbody>${list.length ? list.map(f => `
        <tr onclick="${f.auto ? `toast('Lançamento gerado automaticamente pelo atendimento concluído.','🔒')` : `openFinForm('${f.id}')`}">
          <td>${fmtDate(f.data)}</td>
          <td><b>${esc(f.descricao)}</b> ${f.auto ? '<span class="tag brass">auto</span>' : ''}</td>
          <td>${esc(f.categoria || '—')}</td>
          <td>${PAG_LABEL[f.formaPag] || '—'}</td>
          <td style="color:${f.tipo === 'receita' ? 'var(--green-bright)' : 'var(--red-bright)'};font-weight:700">
            ${f.tipo === 'receita' ? '+' : '−'} ${money(f.valor)}</td>
          <td style="text-align:right">${f.auto ? '' : `<button class="mini no" onclick="event.stopPropagation();delFin('${f.id}')">excluir</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="6"><div class="empty-soft">Nenhum lançamento neste mês.</div></td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

function finComissoes() {
  const mk = curMonthKey();
  const dados = comissoesPorProf(mk).filter(d => d.atend > 0 || d.p.ativo);
  const total = somaBy(dados, d => d.comissao);
  return `
  <div class="m-cards m-cards-2">
    ${card(moneyShort(total), 'Total a pagar', fmtMonth(mk), ICO.hand)}
    ${card(String(somaBy(dados, d => d.atend)), 'Atendimentos concluídos', 'no mês', ICO.clock)}
  </div>
  <div class="tbl-wrap" style="margin-top:16px">
    <div class="tbl-header"><div class="tbl-title">Fechamento de comissões — ${fmtMonth(mk)}</div></div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Profissional</th><th>%</th><th>Atendimentos</th><th>Faturamento gerado</th><th>Comissão</th></tr></thead>
      <tbody>${dados.map(d => `
        <tr onclick="openProfForm('${d.p.id}')">
          <td><div style="display:flex;align-items:center;gap:10px">
            <span class="avatar" style="background:${d.p.cor}22;color:${d.p.cor};border-color:${d.p.cor}66">${esc(initials(d.p.nome))}</span>
            <b>${esc(d.p.apelido || d.p.nome)}</b></div></td>
          <td>${d.p.comissao || 0}%</td><td>${d.atend}</td><td>${money(d.fat)}</td>
          <td style="font-weight:700;color:var(--accent-bright)">${money(d.comissao)}</td>
        </tr>`).join('')}
        <tr style="cursor:default"><td colspan="4" style="text-align:right;color:var(--text-dim)"><b>Total</b></td>
          <td style="font-weight:800;color:var(--accent-bright)">${money(total)}</td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="p-block" style="margin-top:16px">
    <span class="pb-label">Como é calculado</span>
    <div style="font-size:.82rem;color:var(--text-dim);line-height:1.6">
      A comissão é o percentual do profissional aplicado sobre o preço dos serviços <b style="color:var(--text)">concluídos</b> no mês.
      O cálculo é feito na hora (não fica gravado) — se você mudar o percentual, o histórico do mês é recalculado.
    </div>
  </div>`;
}

function finProj() {
  const mk = curMonthKey(), m = metrics(mk);
  const hoje = new Date();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const diaAtual = hoje.getDate();
  const agendado = somaBy(
    db.agendamentos.filter(a => monthKey(a.data) === mk && a.data >= todayISO() && (a.status === 'agendado' || a.status === 'confirmado')),
    a => valorDe(a));
  const confirmado = somaBy(
    db.agendamentos.filter(a => monthKey(a.data) === mk && a.data >= todayISO() && a.status === 'confirmado'),
    a => valorDe(a));
  const ritmo = diaAtual > 0 ? m.receita / diaAtual : 0;
  const projRitmo = ritmo * diasNoMes;
  const projCarteira = m.receita + agendado;
  const comissaoProj = m.receita > 0 ? projRitmo * (m.comissoes / m.receita) : 0;
  const lucroProj = projRitmo - m.despesa - comissaoProj;
  const bar = (label, v, base) => `
    <div class="st-row">
      <div class="st-name">${label}</div>
      <div class="st-track"><div class="st-fill" style="width:${Math.min(100, pct(v, base))}%"></div></div>
      <div class="st-val" style="min-width:90px">${money(v)}</div>
    </div>`;
  const base = Math.max(m.meta, projRitmo, projCarteira, m.receita, 1);
  return `
  <div class="m-cards">
    ${card(moneyShort(m.receita), 'Realizado', `até dia ${diaAtual}`, ICO.money)}
    ${card(moneyShort(confirmado), 'Agenda confirmada', 'ainda por atender', ICO.clock)}
    ${card(moneyShort(projRitmo), 'Projeção do mês', `ritmo de ${moneyShort(ritmo)}/dia`, ICO.ticket)}
    ${card(moneyShort(lucroProj), 'Lucro projetado', 'já descontando comissões', ICO.hand)}
  </div>
  <div class="p-block" style="margin-top:18px">
    <span class="pb-label">Realizado × Agenda × Meta — ${fmtMonth(mk)}</span>
    ${bar('Realizado', m.receita, base)}
    ${bar('Realizado + agenda', projCarteira, base)}
    ${bar('Projeção por ritmo', projRitmo, base)}
    ${m.meta ? bar('Meta do mês', m.meta, base) : ''}
    <div style="font-size:.78rem;color:var(--text-dim);margin-top:14px;line-height:1.6">
      ${m.meta ? (projRitmo >= m.meta
        ? `No ritmo atual você <b class="g-green">bate a meta</b> e ainda sobra ${money(projRitmo - m.meta)}.`
        : `No ritmo atual você fecha o mês <b class="g-red">${money(m.meta - projRitmo)} abaixo da meta</b> — são cerca de <b>${Math.ceil((m.meta - projRitmo) / Math.max(1, m.ticket))} atendimentos</b> a mais.`)
        : 'Defina uma meta em <b>Cadastros → Metas</b> para acompanhar o quanto falta.'}
      <br><span style="color:var(--text-mute)">A projeção é linear (média diária) e não considera sazonalidade por dia da semana.</span>
    </div>
  </div>
  <div class="p-row2">
    <div class="p-block"><span class="pb-label">Composição do resultado projetado</span>
      <div class="li"><div class="lbody"><div class="lt">Receita projetada</div></div><div class="lend" style="color:var(--green-bright)">${money(projRitmo)}</div></div>
      <div class="li"><div class="lbody"><div class="lt">Despesas lançadas no mês</div></div><div class="lend" style="color:var(--red-bright)">− ${money(m.despesa)}</div></div>
      <div class="li"><div class="lbody"><div class="lt">Comissões projetadas</div></div><div class="lend" style="color:var(--red-bright)">− ${money(comissaoProj)}</div></div>
      <div class="li"><div class="lbody"><div class="lt"><b>Lucro projetado</b></div></div><div class="lend" style="color:var(--accent-bright)">${money(lucroProj)}</div></div>
    </div>
    <div class="p-block"><span class="pb-label">Indicadores</span>
      <div class="li"><div class="lbody"><div class="lt">Ticket médio</div><div class="lm">atendimentos concluídos no mês</div></div><div class="lend">${money(m.ticket)}</div></div>
      <div class="li"><div class="lbody"><div class="lt">Atendimentos concluídos</div><div class="lm">${diaAtual} de ${diasNoMes} dias</div></div><div class="lend">${m.conclMes.length}</div></div>
      <div class="li"><div class="lbody"><div class="lt">Média por dia corrido</div></div><div class="lend">${(m.conclMes.length / Math.max(1, diaAtual)).toFixed(1)}</div></div>
      <div class="li"><div class="lbody"><div class="lt">Margem projetada</div></div><div class="lend">${projRitmo > 0 ? pct(lucroProj, projRitmo) : 0}%</div></div>
    </div>
  </div>`;
}

function finMetas() {
  const list = db.metas.slice().sort((a, b) => b.mes.localeCompare(a.mes));
  return `
  <div class="dataview-bar">
    <span style="font-size:.8rem;color:var(--text-dim)">Meta de faturamento por mês — acompanhada com as receitas lançadas.</span>
    <button class="btn" style="margin-left:auto" onclick="openMetaForm()">+ Nova meta</button>
  </div>
  ${list.length ? list.map(mt => {
    const rec = somaBy(db.financeiro.filter(f => f.tipo === 'receita' && monthKey(f.data) === mt.mes), f => f.valor);
    const p = pct(rec, mt.valor);
    return `<div class="goal" style="margin-top:14px;cursor:pointer" onclick="openMetaForm('${mt.id}')">
      <div class="gh">
        <span class="gt">${fmtMonth(mt.mes)} ${p >= 100 ? '<span class="tag pos">batida</span>' : ''}</span>
        <span class="gv">${money(rec)} de ${money(mt.valor)} · <b style="color:var(--text)">${p}%</b></span>
      </div>
      <div class="gtrack"><div class="gfill" style="width:${Math.min(100, p)}%"></div></div>
    </div>`;
  }).join('') : `<div class="p-block"><div class="empty-soft">Nenhuma meta cadastrada.</div></div>`}`;
}

/* ══════════════════════════════════════════════════════════════
   Overlays: drawer lateral + modal central
   ══════════════════════════════════════════════════════════════ */
let _dwActions = [], _cmActions = [];
function fillOverlay(elId, title, body, actions, store) {
  const el = document.getElementById(elId);
  el.querySelector('.dw-title').textContent = title;
  el.querySelector('.dw-body').innerHTML = body;
  const foot = el.querySelector('.dw-foot');
  const acts = actions || [];
  store.length = 0; acts.forEach(a => store.push(a));
  foot.innerHTML = acts.map((a, i) => `<button class="btn ${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join('');
  foot.style.display = acts.length ? 'flex' : 'none';
  el.classList.add('open');
}
function openDrawer(title, body, actions) {
  fillOverlay('drawer', title, body, actions, _dwActions);
  document.getElementById('fabStack').classList.add('drawer-open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('fabStack').classList.remove('drawer-open');
}
function openCModal(title, body, actions) { fillOverlay('cmodal', title, body, actions, _cmActions); }
function closeCModal() { document.getElementById('cmodal').classList.remove('open'); }
document.getElementById('drawer').querySelector('.dw-foot').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (b) _dwActions[Number(b.dataset.i)].fn();
});
document.getElementById('cmodal').querySelector('.dw-foot').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (b) _cmActions[Number(b.dataset.i)].fn();
});
document.getElementById('drawer').addEventListener('click', e => { if (e.target.id === 'drawer') closeDrawer(); });
document.getElementById('cmodal').addEventListener('click', e => { if (e.target.id === 'cmodal') closeCModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeCModal(); document.getElementById('filtrosPanel').classList.remove('open'); }
});
const val = id => (document.getElementById(id) || {}).value || '';

/* ══════════════════════════════════════════════════════════════
   Ações: Agendamentos
   ══════════════════════════════════════════════════════════════ */
function openApptForm(pre) {
  pre = pre || {};
  const ag = pre.id ? db.agendamentos.find(a => a.id === pre.id) : null;
  const data = ag ? ag.data : (pre.data || todayISO());
  const hora = ag ? ag.hora : (pre.hora || '09:00');
  const vendaveis = db.servicos.filter(s => s.ativo || (ag && s.id === ag.servicoId));
  const body = `
    <div class="form-grid">
      <div class="full">
        <label>Cliente</label>
        <select id="fCliente">
          ${db.clientes.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(c =>
            `<option value="${c.id}"${ag && ag.clienteId === c.id ? ' selected' : ''}>${esc(c.nome)}</option>`).join('')}
        </select>
        ${db.clientes.length ? '' : '<div style="font-size:.75rem;color:var(--red-bright);margin-top:6px">Cadastre um cliente primeiro.</div>'}
      </div>
      <div class="full">
        <label>Serviço / Produto</label>
        <select id="fServico" onchange="apptPreview()">
          ${vendaveis.map(s => `<option value="${s.id}"${ag && ag.servicoId === s.id ? ' selected' : ''}>${esc(s.nome)} — ${money(s.preco)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Profissional</label>
        <select id="fProf">
          ${db.profissionais.filter(p => p.ativo || (ag && p.id === ag.profissionalId)).map(p =>
            `<option value="${p.id}"${ag && ag.profissionalId === p.id ? ' selected' : ''}>${esc(p.apelido || p.nome)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Status</label>
        <select id="fStatus">
          ${Object.keys(ST_LABEL).map(k => `<option value="${k}"${(ag ? ag.status : 'agendado') === k ? ' selected' : ''}>${ST_LABEL[k]}</option>`).join('')}
        </select>
      </div>
      <div><label>Data</label><input type="date" id="fData" value="${data}"></div>
      <div><label>Hora</label><input type="time" id="fHora" value="${hora}" step="300"></div>
      <div class="full"><label>Observações</label><textarea id="fObs" placeholder="Preferências, combinados...">${esc(ag ? ag.obs : '')}</textarea></div>
      <div class="full" id="apptPrev"></div>
    </div>`;
  const actions = [{ label: ag ? 'Salvar alterações' : 'Agendar', cls: '', fn: () => salvarAppt(ag && ag.id) }];
  if (ag) actions.push({ label: 'Excluir', cls: 'btn-danger', fn: () => delAppt(ag.id) });
  actions.push({ label: 'Cancelar', cls: 'btn-ghost', fn: closeDrawer });
  openDrawer(ag ? 'Editar agendamento' : 'Novo agendamento', body, actions);
  apptPreview();
}
function apptPreview() {
  const s = getSrv(val('fServico'));
  const el = document.getElementById('apptPrev');
  if (!el || !s) return;
  el.innerHTML = `<div class="det-item"><div class="k">Resumo</div>
    <div class="v">${money(s.preco)}${s.duracao ? ` · ${s.duracao} min` : ''}${s.tipo !== 'servico' ? ` · ${s.tipo}` : ''}</div></div>`;
}
function salvarAppt(id) {
  const cliente = val('fCliente'), servico = val('fServico'), prof = val('fProf');
  if (!cliente || !servico || !prof) { toast('Preencha cliente, serviço e profissional.', '⚠️'); return; }
  const dados = {
    clienteId: cliente, servicoId: servico, profissionalId: prof,
    data: val('fData'), hora: val('fHora'), status: val('fStatus'), obs: val('fObs')
  };
  if (!dados.data || !dados.hora) { toast('Informe data e hora.', '⚠️'); return; }
  if (id) {
    const ag = db.agendamentos.find(a => a.id === id);
    Object.assign(ag, dados);
    toast('Agendamento atualizado.', '✏️');
  } else {
    db.agendamentos.push(Object.assign({ id: uid(), formaPag: null }, dados));
    toast(`Agendado: <b>${esc(nomeCli(cliente))}</b> em ${fmtDateLong(dados.data)} às ${dados.hora}.`, '📅');
  }
  saveDB(); closeDrawer(); render();
}
function delAppt(id) {
  db.agendamentos = db.agendamentos.filter(a => a.id !== id);
  db.financeiro = db.financeiro.filter(f => f.agendamentoId !== id);
  saveDB(); closeDrawer(); render();
  toast('Agendamento excluído.', '🗑️');
}
function openApptDetail(id) {
  const a = db.agendamentos.find(x => x.id === id);
  if (!a) return;
  const c = getCli(a.clienteId) || {}, s = getSrv(a.servicoId) || {}, p = getProf(a.profissionalId) || {};
  const msg = `Olá ${firstName(c.nome)}! Aqui é da Barbearia Dom Tavares. Seu horário está marcado para ${fmtDateLong(a.data)} às ${a.hora} com ${p.apelido || p.nome}. Confirma pra mim?`;
  const body = `
    <div class="det-grid">
      <div class="det-item"><div class="k">Cliente</div><div class="v">${esc(c.nome || '—')}</div></div>
      <div class="det-item"><div class="k">Status</div><div class="v">${stTag(a.status)}</div></div>
      <div class="det-item"><div class="k">Data</div><div class="v">${fmtDateLong(a.data)}</div></div>
      <div class="det-item"><div class="k">Hora</div><div class="v">${a.hora}${s.duracao ? ` · ${s.duracao} min` : ''}</div></div>
      <div class="det-item"><div class="k">Serviço</div><div class="v">${esc(s.nome || '—')}</div></div>
      <div class="det-item"><div class="k">Valor</div><div class="v">${money(valorDe(a))}</div></div>

      ${a.formaPag ? `<div class="det-item"><div class="k">Forma de pagamento</div><div class="v">${PAG_LABEL[a.formaPag]}</div></div>` : ''}
    </div>
    ${a.obs ? `<div class="det-item" style="margin-bottom:18px"><div class="k">Observações</div><div class="v" style="font-weight:500;font-size:.84rem">${esc(a.obs)}</div></div>` : ''}
