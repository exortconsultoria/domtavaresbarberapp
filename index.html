/* ══════════════════════════════════════════════════════════════
   Projeção anual — o ano inteiro numa tela.
   Mês que já passou usa o que realmente aconteceu; mês futuro usa
   a média do que foi realizado (ou a meta, se houver) e os custos
   fixos cadastrados, que são conhecidos de antemão.
   ══════════════════════════════════════════════════════════════ */
const projecaoPadrao = () => Number(db.config.projecaoPadrao) || 0;
/* quanto esperar de um mês que ainda não começou: o ajuste dele para aquele mês,
   senão o padrão configurado */
const projecaoDoMes = mk => {
  const m = db.metas.find(x => x.mes === mk);
  return m && m.projecao !== undefined && m.projecao !== null ? Number(m.projecao) : projecaoPadrao();
};
function dadosAnuais(ano) {
  const mkAtual = curMonthKey();
  const fixosMensais = totalCustosFixos();
  const meses = Array.from({ length: 12 }, (_, i) => `${ano}-${pad2(i + 1)}`);

  /* média realizada — não entra na conta, serve de referência para ele calibrar o padrão */
  const realizados = meses.filter(mk => mk <= mkAtual).map(mk => ({
    mk, receita: somaBy(db.financeiro.filter(f => f.tipo === 'receita' && monthKey(f.data) === mk), f => f.valor)
  }));
  const comReceita = realizados.filter(r => r.receita > 0);
  const mediaReceita = comReceita.length ? somaBy(comReceita, r => r.receita) / comReceita.length : 0;

  const linhas = meses.map(mk => {
    const passado = mk < mkAtual, atual = mk === mkAtual;
    const receitaReal = somaBy(db.financeiro.filter(f => f.tipo === 'receita' && monthKey(f.data) === mk), f => f.valor);
    const despesaReal = somaBy(db.financeiro.filter(f => f.tipo === 'despesa' && monthKey(f.data) === mk), f => f.valor);
    const fixosLancados = somaBy(db.financeiro.filter(f => f.custoFixoId && monthKey(f.data) === mk), f => f.valor);
    const outrasDespesas = despesaReal - fixosLancados;      // despesas que não são custo fixo
    const registro = db.metas.find(m => m.mes === mk);
    const meta = (registro || {}).valor || 0;
    const projecao = projecaoDoMes(mk);
    const ajustada = !!(registro && registro.projecao !== undefined && registro.projecao !== null);

    /* mês começou (passado ou corrente) vale o que aconteceu de verdade; o resto é projeção */
    const receita = passado || atual ? receitaReal : projecao;
    const fixos = fixosLancados || (passado ? 0 : fixosMensais);
    const outras = passado || atual ? outrasDespesas : 0;
    return { mk, passado, atual, receita, receitaReal, fixos, fixosLancados, outras, meta, projecao, ajustada,
             projetado: !passado && !atual, resultado: receita - fixos - outras };
  });

  return {
    ano, linhas, mediaReceita, fixosMensais,
    totReceita: somaBy(linhas, l => l.receita),
    totFixos: somaBy(linhas, l => l.fixos),
    totOutras: somaBy(linhas, l => l.outras),
    totResultado: somaBy(linhas, l => l.resultado),
    realizadoReceita: somaBy(linhas.filter(l => !l.projetado), l => l.receita),
    mesesSemFixos: linhas.filter(l => !l.passado && !l.fixosLancados).map(l => l.mk),
    mesesAjustados: linhas.filter(l => l.projetado && l.ajustada).length
  };
}
/* ajustar a projeção de um mês específico */
function openProjecaoMes(mk) {
  const registro = db.metas.find(m => m.mes === mk);
  const atual = projecaoDoMes(mk);
  const body = `
    <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6;margin-bottom:16px">
      Quanto você espera faturar em <b style="color:var(--text)" class="cap">${fmtMonth(mk)}</b>?
      Assim que o mês começar, o app passa a usar o que realmente entrou.
    </div>
    <label>Faturamento esperado (R$)</label>
    <input type="number" id="pjValor" step="100" min="0" value="${atual}">
    <div style="font-size:.76rem;color:var(--text-mute);margin-top:12px;line-height:1.5">
      Padrão de todos os meses: <b>${money(projecaoPadrao())}</b>${
        registro && registro.projecao != null ? ' · este mês está ajustado' : ''}
    </div>`;
  const acoes = [
    { label: 'Salvar', fn: () => {
      const v = Number(val('pjValor'));
      if (!(v >= 0)) { toast('Informe um valor válido.', '⚠️'); return; }
      const reg = db.metas.find(m => m.mes === mk);
      if (reg) reg.projecao = v;
      else db.metas.push({ id: uid(), mes: mk, valor: 0, projecao: v });
      saveDB(); closeCModal(); render();
      toast(`Projeção de ${fmtMonth(mk)}: <b>${money(v)}</b>.`, '📈');
    } }
  ];
  if (registro && registro.projecao != null) acoes.push({ label: 'Usar o padrão', cls: 'btn-ghost', fn: () => {
    registro.projecao = undefined;
    if (!registro.valor) db.metas = db.metas.filter(m => m.id !== registro.id);   // registro só existia pela projeção
    saveDB(); closeCModal(); render();
    toast(`${fmtMonth(mk)} voltou ao padrão de ${money(projecaoPadrao())}.`, '↩️');
  } });
  acoes.push({ label: 'Cancelar', cls: 'btn-ghost', fn: closeCModal });
  openCModal('Projeção do mês', body, acoes);
}
function openProjecaoPadrao() {
  const media = dadosAnuais(finAno).mediaReceita;
  const body = `
    <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6;margin-bottom:16px">

    <button class="btn" onclick="abrirLancamentoCustos('${d.mesesSemFixos[0]}','${d.mesesSemFixos[d.mesesSemFixos.length - 1]}')">Lançar esses meses</button>

  <div class="analise" style="margin-bottom:16px">

        </tr>`).join('')}
        <tr style="cursor:default;background:var(--surface-2)">
          <td><b>Total</b></td>
          <td class="valor-oculto" style="font-weight:700;color:var(--green)">${money(d.totReceita)}</td>
          <td class="valor-oculto" style="font-weight:700;color:var(--red)">${money(d.totFixos)}</td>
          <td class="valor-oculto" style="font-weight:700;color:var(--red)">${money(d.totOutras)}</td>
          <td class="valor-oculto" style="font-weight:800;color:var(--${d.totResultado < 0 ? 'red' : 'green'})">${money(d.totResultado)}</td>
        </tr>
      </tbody>
    </table></div>
  </div>`;
}

let _dwActions = [], _cmActions = [];
function fillOverlay(elId, title, body, actions, store) {
  const el = document.getElementById(elId);
  el.querySelector('.dw-title').textContent = title;
  el.querySelector('.dw-body').innerHTML = body;
  const foot = el.querySelector('.dw-foot');
  const acts = actions || [];
  store.length = 0; acts.forEach(a => store.push(a));
  foot.innerHTML = acts.map((a, i) => `<button class="btn ${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join('');
  foot.style.display = acts.length ? 'flex' : 'none';
  el.classList.add('open');
}
function openDrawer(title, body, actions) {
  fillOverlay('drawer', title, body, actions, _dwActions);
  document.getElementById('fabStack').classList.add('drawer-open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('fabStack').classList.remove('drawer-open');
}
function openCModal(title, body, actions) { fillOverlay('cmodal', title, body, actions, _cmActions); }
function closeCModal() { document.getElementById('cmodal').classList.remove('open'); }
document.getElementById('drawer').querySelector('.dw-foot').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (b) _dwActions[Number(b.dataset.i)].fn();
});
document.getElementById('cmodal').querySelector('.dw-foot').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (b) _cmActions[Number(b.dataset.i)].fn();
});
document.getElementById('drawer').addEventListener('click', e => { if (e.target.id === 'drawer') closeDrawer(); });
document.getElementById('cmodal').addEventListener('click', e => { if (e.target.id === 'cmodal') closeCModal(); });
document.addEventListener('keydown', e => {

});

/* duração total de um atendimento; 30 min como piso pra quem não configurou duração */
function duracaoDe(agId, itens) {
  const lista = itens || servicosDoAgendamento(agId);
  return somaBy(lista, i => (getSrv(i.servicoId) || {}).duracao || 0) || 30;
}
/* outros atendimentos do mesmo profissional cujo horário se sobrepõe a este */
function conflitosDe({ id, data, hora, profissionalId, itens }) {
  const ini = hhmmToMin(hora), fim = ini + duracaoDe(id, itens);
  return db.agendamentos.filter(o => {
    if (o.id === id) return false;
    if (o.data !== data || o.profissionalId !== profissionalId) return false;
    if (o.status === 'cancelado' || o.status === 'faltou') return false;
    const oIni = hhmmToMin(o.hora);
    const oFim = oIni + (o.duracaoMin || duracaoDe(o.id));
    return ini < oFim && oIni < fim;
  }).sort((a, b) => a.hora.localeCompare(b.hora));
}
function salvarAppt(id) {
  const cliente = val('fCliente'), prof = val('fProf');
  if (!cliente || !prof) { toast('Preencha cliente e profissional.', '⚠️'); return; }
  const agExistente = id ? db.agendamentos.find(a => a.id === id) : null;
  const travado = !!(agExistente && agExistente.status === 'concluido');
  if (!travado && !formServicosTemp.length) { toast('Adicione ao menos um serviço.', '⚠️'); return; }
  const dados = {
    clienteId: cliente, profissionalId: prof,
    data: val('fData'), hora: val('fHora'), status: val('fStatus'), obs: val('fObs')
  };
  if (!dados.data || !dados.hora) { toast('Informe data e hora.', '⚠️'); return; }

  /* nada disso bloqueia (encaixe e atender na folga acontecem), mas o dono decide sabendo */
  const dur = duracaoDe(id, travado ? null : formServicosTemp);
  const choques = conflitosDe({ id, data: dados.data, hora: dados.hora, profissionalId: prof,
                                itens: travado ? null : formServicosTemp });
  const folga = ehFolga(prof, dados.data);
  const almoco = bateNoAlmoco(prof, dados.hora, dur);

  if (choques.length || folga || almoco) {
    const partes = [];
    if (folga) partes.push(`<div class="li"><div class="lbody">
      <div class="lt">🌴 ${esc(folga.motivo)}</div>
      <div class="lm">${esc(nomeProf(prof))} não atende neste dia</div></div></div>`);
    if (almoco) partes.push(`<div class="li"><div class="lbody">
      <div class="lt">🍽️ Horário de almoço</div>
      <div class="lm">${esc(almoco.label)}</div></div></div>`);
    choques.forEach(o => partes.push(`<div class="li">
      <div class="lbar" style="background:${corProf(o.profissionalId)}"></div>
      <div class="lbody">
        <div class="lt">${o.hora} · ${esc(nomeCli(o.clienteId))}</div>
        <div class="lm">${esc(nomesServicosDe(o))} · ${o.duracaoMin || duracaoDe(o.id)} min</div>
      </div></div>`));
    const titulo = folga ? 'Dia de folga' : almoco && !choques.length ? 'Horário de almoço' : 'Horário ocupado';
    openCModal(titulo, `
      <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6;margin-bottom:14px">
        Este atendimento leva ${dur} min, das <b style="color:var(--text)">${dados.hora}</b> às
        <b style="color:var(--text)">${minToHHMM(hhmmToMin(dados.hora) + dur)}</b>, e esbarra em:
      </div>
      ${partes.join('')}
      <div style="font-size:.8rem;color:var(--text-mute);margin-top:14px;line-height:1.5">
        Se for proposital, pode agendar mesmo assim.
      </div>`, [
      { label: 'Agendar mesmo assim', fn: () => { closeCModal(); gravarAppt(id, dados, travado); } },
      { label: 'Escolher outro horário', cls: 'btn-ghost', fn: closeCModal }
    ]);
    return;
  }
  gravarAppt(id, dados, travado);
}
function gravarAppt(id, dados, travado) {

function setStatus(id, st) {
  const a = db.agendamentos.find(x => x.id === id);
  if (!a) return;
  if (a.status === 'concluido' && st !== 'concluido') {
    db.financeiro = db.financeiro.filter(f => f.agendamentoId !== id);
    const c = getCli(a.clienteId);
    if (c) c.pontos = Math.max(0, (c.pontos || 0) - (Number(db.config.pontosPorCorte) || 0));
    /* desfazer a conclusão devolve o produto pra prateleira */
    servicosDoAgendamento(id).forEach(i => {
      const s = getSrv(i.servicoId);
      if (s && s.tipo === 'produto') s.estoque = (Number(s.estoque) || 0) + 1;
    });
    a.valor = undefined; a.comissaoPct = undefined; a.duracaoMin = undefined; a.concluidaEm = undefined; a.taxaMaquineta = undefined;
  }
  a.status = st;
  saveDB(); render(); openApptDetail(id);
  toast(`Status alterado para <b>${ST_LABEL[st]}</b>.`, '🔁');
}
let concluirBruto = 0;   // valor bruto do atendimento sendo concluído, pro aviso de taxa em tempo real
function concluir(id) {
  const a = db.agendamentos.find(x => x.id === id);
  if (!a || a.status === 'concluido') return;
  const itens = servicosDoAgendamento(a.id);
  if (!itens.length) { toast('Adicione um serviço a este agendamento antes de concluir.', '⚠️'); return; }
  const c = getCli(a.clienteId);
  const bruto = somaBy(itens, i => i.valor);
  const nomes = itens.map(i => nomeSrv(i.servicoId)).join(', ');
  concluirBruto = bruto;
  const body = `
    <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6;margin-bottom:18px">
      Concluir <b style="color:var(--text)">${esc(nomes)}</b> de <b style="color:var(--text)">${esc(c ? c.nome : '—')}</b>
      no valor de <b style="color:var(--accent-bright)">${money(bruto)}</b>.
    </div>
    <label>Forma de pagamento</label>
    <select id="fPag" onchange="avisoSemReceita()">
      <option value="pix">PIX</option><option value="dinheiro">Dinheiro</option>
      <option value="credito">Crédito</option><option value="debito">Débito</option>
      <option value="pacote">Pacote (já pago)</option>
      <option value="permuta">Permuta / cortesia</option>
    </select>
    <div id="avisoPag" style="font-size:.78rem;color:var(--text-mute);margin-top:10px;line-height:1.5"></div>`;
  openCModal('Concluir atendimento', body, [
    { label: 'Confirmar', fn: () => {
      const forma = val('fPag');
      const taxaPct = TAXA_MAQUINETA[forma] || 0;
      const taxa = Math.round(bruto * taxaPct * 100) / 100;
      a.status = 'concluido'; a.formaPag = forma;
      /* congela preço, comissão e duração do dia do atendimento: mudar a tabela
         de preços depois não pode reescrever o faturamento do passado */
      const prof = getProf(a.profissionalId) || {};
      a.valor = bruto;
      a.taxaMaquineta = taxa;
      a.comissaoPct = Number(prof.comissao) || 0;
      a.duracaoMin = somaBy(itens, i => (getSrv(i.servicoId) || {}).duracao || 0);
      a.concluidaEm = new Date().toISOString();
      /* baixa de estoque: produto vendido sai da prateleira */
      itens.forEach(i => {
        const s = getSrv(i.servicoId);
        if (s && s.tipo === 'produto') s.estoque = Math.max(0, (Number(s.estoque) || 0) - 1);
      });
      if (!SEM_RECEITA.includes(forma)) {
        /* se tudo que saiu foi produto, o lançamento é de venda, não de atendimento */
        const soProdutos = itens.every(i => (getSrv(i.servicoId) || {}).tipo === 'produto');
        db.financeiro.push({
          id: uid(), data: a.data, tipo: 'receita', categoria: soProdutos ? 'Produtos' : 'Atendimento',
          descricao: `${nomes} — ${c ? c.nome : '—'}`, valor: bruto, formaPag: forma,
          auto: true, agendamentoId: a.id
        });
        if (taxa > 0) {
          db.financeiro.push({
            id: uid(), data: a.data, tipo: 'despesa', categoria: 'Taxa de cartão',
            descricao: `Taxa ${PAG_LABEL[forma]} (${(taxaPct * 100).toFixed(2).replace('.', ',')}%) — ${c ? c.nome : '—'}`,
            valor: taxa, formaPag: forma, auto: true, agendamentoId: a.id
          });
        }
      }
      let msgExtra = '';
      if (c) {
        c.pontos = (c.pontos || 0) + (Number(db.config.pontosPorCorte) || 0);
        const resgate = Number(db.config.pontosResgate) || 10;
        if (c.pontos >= resgate) msgExtra = `<br><b>${esc(firstName(c.nome))} atingiu ${c.pontos} pontos</b> — resgate liberado!`;
      }
      saveDB(); closeCModal(); closeDrawer(); render();
      const msgTaxa = taxa > 0 ? ` (taxa de ${money(taxa)}, líquido ${money(bruto - taxa)})` : '';
      toast(SEM_RECEITA.includes(forma)
        ? `Atendimento concluído como <b>${PAG_LABEL[forma]}</b> — sem lançar receita.${msgExtra}`
        : `Atendimento concluído · receita de <b>${money(bruto)}</b> lançada${msgTaxa}.${msgExtra}`, '✅');
    } },
    { label: 'Voltar', cls: 'btn-ghost', fn: closeCModal }
  ]);
  avisoSemReceita();
}
function avisoSemReceita() {
  const el = document.getElementById('avisoPag');
  if (!el) return;
  const forma = val('fPag');
  if (SEM_RECEITA.includes(forma)) {
    el.innerHTML = `O atendimento entra no histórico e conta pontos de fidelidade, mas <b>não gera receita</b> no financeiro.`;
    return;
  }
  const pct = TAXA_MAQUINETA[forma];
  if (pct) {
    const taxa = Math.round(concluirBruto * pct * 100) / 100;
    el.innerHTML = `Taxa da maquineta (${(pct * 100).toFixed(2).replace('.', ',')}%): <b style="color:var(--red)">− ${money(taxa)}</b> ·
      líquido <b style="color:var(--green)">${money(concluirBruto - taxa)}</b>`;
    return;
  }
  el.innerHTML = '';
}

function openServicoForm(id, tipoPre) {
  const s = id ? getSrv(id) : null;
  const tipo = s ? s.tipo : (tipoPre || 'servico');
  const body = `
    <div class="form-grid">
      <div class="full"><label>Nome</label><input id="fSNome" value="${esc(s ? s.nome : '')}" placeholder="Ex.: Corte Degradê"></div>
      <div>
        <label>Tipo</label>
        <select id="fSTipo" onchange="srvTipoChange()">
          <option value="servico"${tipo === 'servico' ? ' selected' : ''}>Serviço</option>
          <option value="pacote"${tipo === 'pacote' ? ' selected' : ''}>Pacote</option>
          <option value="produto"${tipo === 'produto' ? ' selected' : ''}>Produto</option>
        </select>
      </div>
      <div><label>Preço (R$)</label><input type="number" id="fSPreco" step="0.01" min="0" value="${s ? s.preco : ''}"></div>
      <div id="wrapDur"><label>Duração (min)</label><input type="number" id="fSDur" min="0" step="5" value="${s ? (s.duracao || 0) : 40}"></div>
      <div id="wrapEst"><label>Estoque (un.)</label><input type="number" id="fSEst" min="0" value="${s ? (s.estoque || 0) : 0}"></div>
      <div class="full"><label>Situação</label>
        <select id="fSAtivo"><option value="1"${!s || s.ativo ? ' selected' : ''}>Ativo</option><option value="0"${s && !s.ativo ? ' selected' : ''}>Inativo</option></select>
      </div>
    </div>`;
  const actions = [{ label: s ? 'Salvar' : 'Cadastrar', fn: () => salvarServico(id) }];
  if (s) actions.push({ label: 'Excluir', cls: 'btn-danger', fn: () => delServico(id) });
  actions.push({ label: 'Cancelar', cls: 'btn-ghost', fn: closeDrawer });
  openDrawer(s ? 'Editar item' : 'Novo item', body, actions);
  srvTipoChange();
}
function srvTipoChange() {
  const t = val('fSTipo');
  const dur = document.getElementById('wrapDur'), est = document.getElementById('wrapEst');
  if (!dur || !est) return;
  dur.style.display = t === 'produto' ? 'none' : '';
  est.style.display = t === 'produto' ? '' : 'none';
}
function salvarServico(id) {
  const nome = val('fSNome').trim();
  if (!nome) { toast('Informe o nome do item.', '⚠️'); return; }
  const tipo = val('fSTipo');
  const dados = {
    nome, tipo, preco: Number(val('fSPreco')) || 0,
    duracao: tipo === 'produto' ? 0 : (Number(val('fSDur')) || 0),
    ativo: val('fSAtivo') === '1'
  };
  if (tipo === 'produto') dados.estoque = Number(val('fSEst')) || 0;
  if (id) { const s = getSrv(id); Object.assign(s, dados); if (tipo !== 'produto') delete s.estoque; }
  else db.servicos.push(Object.assign({ id: uid() }, dados));
  srvTab = tipo;
  saveDB(); closeDrawer(); render();
  toast(id ? 'Item atualizado.' : `<b>${esc(nome)}</b> cadastrado.`, '✂️');
}
function delServico(id) {
  const n = db.agendamentoServicos.filter(x => x.servicoId === id).length;
  if (n) { toast(`Este item aparece em ${n} agendamento(s). Marque como inativo em vez de excluir.`, '⚠️'); return; }
  db.servicos = db.servicos.filter(s => s.id !== id);
  saveDB(); closeDrawer(); render();
  toast('Item excluído.', '🗑️');
}

  };

function salvarFin(id) {

    data: val('fFData') || todayISO(), tipo,

  };

function delFin(id) {

function openMetaForm(id) {

function salvarConfig() {
  const abre = val('cAbre'), fecha = val('cFecha');
  if (hhmmToMin(fecha) <= hhmmToMin(abre)) { toast('O fechamento precisa ser depois da abertura.', '⚠️'); return; }
  db.config = Object.assign({}, db.config, {
    nomeUsuario: val('cNome').trim() || CONFIG_PADRAO.nomeUsuario,
    nomeBarbearia: val('cCasa').trim() || CONFIG_PADRAO.nomeBarbearia,
    abertura: abre, fechamento: fecha,
    inativoDias: Number(val('cInat')) || 45,
    pontosPorCorte: Number(val('cPtsC')) || 0,
    pontosResgate: Number(val('cPtsR')) || 10,
    projecaoPadrao: Math.max(0, Number(val('cProj')) || 0)
  });
  saveDB(); closeCModal(); applyBrand(); render();
  toast('Configurações salvas.', '⚙️');
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dom-tavares-${todayISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exportado.', '💾');
}
function importJSON(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      if (!parsed || !parsed.profissionais) throw new Error('formato');
      db = parsed; normalizeDB(); saveDB(); closeCModal(); render();
      toast('Backup importado com sucesso.', '📥');
    } catch (e) { toast('Arquivo inválido — não parece um backup do Dom Tavares.', '⚠️'); }
  };
  r.readAsText(file);
  input.value = '';
}
function limparTudo() {
  openCModal('Apagar tudo', `
    <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6">
      Apaga <b style="color:var(--red)">clientes, catálogo, agenda e financeiro</b> e volta ao ponto de
      partida (você, os dois serviços e o João Campos). Seu nome e o da barbearia são mantidos.
      Exporte um backup antes se precisar.
    </div>`, [
    { label: 'Apagar tudo', cls: 'btn-danger', fn: () => {

  ]);
}

/* ─────────── Login ───────────
   O Supabase autentica por e-mail, mas a tela pede "usuário" — o e-mail
   fica só aqui e nunca aparece na interface. */
const USUARIOS = {
  'lihn.tavares': 'lihn.stf@hotmail.com',       // o dono da barbearia
  'joao.campos': 'jabcampos97@gmail.com'        // administrador
};
/* enquanto o usuário não trocar a senha provisória, o app não abre */
const precisaCriarSenha = u => !(u && u.user_metadata && u.user_metadata.senha_criada);
let ultimoUsuario = '';        // quem entrou por último neste aparelho

async function fazerLogin(ev) {
  ev.preventDefault();
  const usuario = val('loginUsuario').trim().toLowerCase(), password = val('loginSenha');
  const msg = document.getElementById('loginMsg'), btn = document.getElementById('loginBtn');
  msg.textContent = ''; msg.className = 'login-msg';
  if (!sb) { msg.textContent = 'Sem conexão agora. Tente de novo.'; msg.className = 'login-msg err'; return false; }
  const email = USUARIOS[usuario];
  if (!email) {
    msg.textContent = 'Usuário ou senha errados.';
    msg.className = 'login-msg err';
    return false;
  }
  btn.disabled = true; btn.textContent = 'Entrando…';
  /* A internet (ou o servidor) falhar não é erro de senha. Quando isso acontece
     o navegador devolve "Load failed" / "Failed to fetch" em inglês — inútil para
     quem só quer abrir a agenda. Então: tenta sozinho mais duas vezes e, se ainda
     assim não for, explica em português o que houve. */
  let data = null, error = null;
  for (let tentativa = 1; tentativa <= 3; tentativa++) {
    if (tentativa > 1) {
      btn.textContent = 'Tentando de novo…';
      await new Promise(r => setTimeout(r, tentativa === 2 ? 1200 : 3000));
    }
    const res = await sb.auth.signInWithPassword({ email, password });
    data = res.data; error = res.error;
    if (!error || !ehFalhaDeRede(error)) break;
  }
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) {
    /* servidor fora do ar não pode trancar o dono para fora da própria agenda:
       se este aparelho já entrou com esse usuário, abre com os dados salvos */
    if (ehFalhaDeRede(error) && acessoOfflinePermitido(usuario)) {
      ultimoUsuario = usuario;
      entrarNoApp(true);
      toast('Sem conexão agora — abri com o que estava salvo neste aparelho.', '📴');
      return false;
    }
    msg.textContent = ehFalhaDeRede(error)
        ? 'Não consegui falar com o servidor. Confira a internet e tente de novo daqui a pouco.'
      : error.message === 'Invalid login credentials' ? 'Usuário ou senha errados.'
      : error.message === 'Email not confirmed' ? 'Esta conta ainda não foi liberada. Fale com o administrador.'
      : error.message;
    msg.className = 'login-msg err';
    return false;
  }
  ultimoUsuario = usuario;
  if (precisaCriarSenha(data.user)) { mostrarCriarSenha(); return false; }
  entrarNoApp();
  return false;
}
function mostrarCriarSenha() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('senhaForm').style.display = '';
  document.getElementById('loginSub').textContent = 'Primeiro acesso — crie uma senha só sua';
  const el = document.getElementById('novaSenha'); if (el) el.focus();
}
async function criarSenha(ev) {
  ev.preventDefault();
  const s1 = val('novaSenha'), s2 = val('novaSenha2');
  const msg = document.getElementById('senhaMsg'), btn = document.getElementById('senhaBtn');
  msg.textContent = ''; msg.className = 'login-msg';
  const erro = t => { msg.textContent = t; msg.className = 'login-msg err'; };
  if (s1.length < 6) { erro('A senha precisa ter pelo menos 6 caracteres.'); return false; }
  if (s1 !== s2) { erro('As duas senhas não são iguais.'); return false; }
  if (s1 === '12345678') { erro('Escolha uma senha diferente da provisória.'); return false; }
  btn.disabled = true; btn.textContent = 'Salvando…';
  const { error } = await sb.auth.updateUser({ password: s1, data: { senha_criada: true } });
  btn.disabled = false; btn.textContent = 'Salvar e entrar';
  if (error) { erro(error.message); return false; }
  document.getElementById('senhaForm').style.display = 'none';
  document.getElementById('loginForm').style.display = '';
  entrarNoApp();
  toast('Senha criada. Use ela nos próximos acessos.', '🔒');
  return false;
}
async function sair() {
  /* sair de propósito encerra também o acesso sem internet — senão bastaria
     ficar offline para voltar sem senha */
  Store.del(ACESSO_KEY);
  if (sb) await sb.auth.signOut();
  location.reload();
}
function abrirTrocaSenha() {
  openCModal('Trocar senha', `
    <div class="form-grid">
      <div class="full"><label>Nova senha</label><input type="password" id="tsSenha" autocomplete="new-password"></div>
      <div class="full"><label>Repita a nova senha</label><input type="password" id="tsSenha2" autocomplete="new-password"></div>
    </div>
    <div style="font-size:.78rem;color:var(--text-mute);margin-top:12px">Mínimo de 6 caracteres. Você continua logado depois de trocar.</div>`, [
    { label: 'Salvar', fn: async () => {
      const s1 = val('tsSenha'), s2 = val('tsSenha2');
      if (s1.length < 6) { toast('A senha precisa ter pelo menos 6 caracteres.', '⚠️'); return; }
      if (s1 !== s2) { toast('As duas senhas não são iguais.', '⚠️'); return; }
      const { error } = await sb.auth.updateUser({ password: s1, data: { senha_criada: true } });
      if (error) { toast(`Não consegui trocar: ${esc(error.message)}`, '⚠️'); return; }
      closeCModal();
      toast('Senha trocada.', '🔒');
    } },
    { label: 'Cancelar', cls: 'btn-ghost', fn: openConfig }
  ]);
}
/* ─────────── entrar sem internet ───────────
   O app guarda tudo no aparelho e funciona sem sinal, mas a tela de login
   barrava o dono antes de ele chegar nos próprios dados. Se este aparelho já
   entrou antes e a rede está fora, abre com o que está salvo e sincroniza
   quando voltar. Vale só por 30 dias: aparelho parado há mais tempo pede senha. */
const ACESSO_KEY = 'domtavares_acesso';
const DIAS_OFFLINE = 30;
let modoOffline = false;
let relogioOffline = null;
function registrarAcesso(usuario) {
  let ant = {};
  try { ant = JSON.parse(Store.get(ACESSO_KEY) || '{}'); } catch (e) { ant = {}; }
  Store.set(ACESSO_KEY, JSON.stringify({ usuario: usuario || ant.usuario || '', quando: Date.now() }));
}
function acessoOfflinePermitido(usuario) {
  let a = null;
  try { a = JSON.parse(Store.get(ACESSO_KEY) || 'null'); } catch (e) { return false; }
  if (!a || !a.quando) return false;
  if (Date.now() - a.quando > DIAS_OFFLINE * 86400000) return false;
  if (!Store.get(DB_KEY)) return false;                      // sem dados salvos não há o que mostrar
  return usuario ? a.usuario === usuario : true;
}
function atualizarBarraOffline() {
  const bar = document.getElementById('barraOffline');
  if (!bar) return;
  const mostrar = modoOffline || sbStatus === 'offline';
  bar.style.display = mostrar ? '' : 'none';
  if (!mostrar) return;
  const pend = pendenciasOffline();
  document.getElementById('boDetalhe').textContent = pend
    ? `${pend} alteração(ões) esperando para subir. Está tudo salvo neste aparelho — nada se perde.`
    : 'Você está vendo o que já estava salvo neste aparelho. O que fizer agora sobe sozinho quando a internet voltar.';
}
/* volta a falar com o servidor: refaz a sessão, sobe o que ficou pendente e baixa o resto */
async function tentarVoltarOnline(manual) {
  const btn = document.getElementById('boBtn');
  if (manual && btn) { btn.disabled = true; btn.textContent = 'Tentando…'; }
  await checarSupabase();
  if (sbStatus !== 'online') {
    if (manual) { toast('Ainda sem conexão. Pode seguir usando — nada se perde.', '📴'); atualizarBarraOffline(); }
    if (btn) { btn.disabled = false; btn.textContent = 'Tentar de novo'; }
    return false;
  }
  /* o token pode ter vencido enquanto estava offline; o refresh precisa de rede */
  let sessao = null;
  try { const r = await sb.auth.getSession(); sessao = r.data && r.data.session; } catch (e) { sessao = null; }
  if (!sessao) {
    sbStatus = 'offline';
    if (btn) { btn.disabled = false; btn.textContent = 'Tentar de novo'; }
    document.getElementById('boDetalhe').textContent =
      'A internet voltou, mas seu acesso expirou. Feche e abra o app para entrar de novo — seus dados continuam salvos aqui.';
    return false;
  }
  modoOffline = false;
  if (relogioOffline) { clearInterval(relogioOffline); relogioOffline = null; }
  if (btn) { btn.disabled = false; btn.textContent = 'Tentar de novo'; }
  registrarAcesso();
  await conectarNuvem();
  applyBrand();
  if (!modoOffline && sbStatus === 'online') toast('Conexão de volta. Tudo sincronizado.', '☁️');
  return true;
}
async function entrarNoApp(offline) {
  modoOffline = !!offline;
  /* sem isso o app continuaria se dando por online: a bolinha ficaria verde e
     cada saveDB tentaria subir com uma sessão que não existe */
  if (modoOffline) sbStatus = 'offline';
  document.body.classList.remove('locked');
  buildNav();
  updateSyncChip();
  switchTab('painel');                 // mostra o cache local na hora, sem esperar a rede
  atualizarBarraOffline();
  if (modoOffline) {
    applyBrand();
    /* tenta sozinho de tempos em tempos; quando a rede voltar, sobe tudo */
    if (!relogioOffline) {
      relogioOffline = setInterval(() => tentarVoltarOnline(false), 30000);
      window.addEventListener('online', () => tentarVoltarOnline(false));
    }
    return;
  }
  registrarAcesso(ultimoUsuario);
  await checarSupabase();
  await conectarNuvem();               // depois troca pelos dados da nuvem
  atualizarBarraOffline();             // conectarNuvem sai cedo se o servidor não respondeu
  applyBrand();
}

/* ─────────── Boot ─────────── */
function boot() {
  loadDB();
  carregarEspelho();
  applyTheme(Store.get('domtavares_theme') === 'dark' ? 'dark' : 'light');   // claro é o padrão
  applyValores(Store.get('domtavares_ocultar') === '1');
  if (Store.get('domtavares_sidebar') === '1') document.getElementById('appwin').classList.add('sidebar-collapsed');
  applyBrand();
  document.getElementById('loginLogo').querySelector('img').alt = nomeBarbearia();
  document.getElementById('loginNomeApp').textContent = nomeBarbearia();
  if (!sb) { entrarNoApp(); return; }   // sem SDK, não trava o dono fora do próprio app
  /* getSession lê do próprio aparelho, mas renova o token pela rede quando ele
     venceu — com o servidor fora, isso trava. Por isso o prazo: passou disso,
     assume que é queda de conexão e abre com o que está salvo. */
  const comSessao = ({ data }) => {
    if (!data || !data.session) { semSessao(); return; }
    if (precisaCriarSenha(data.session.user)) mostrarCriarSenha();
    else entrarNoApp();
  };
  const semSessao = () => { if (acessoOfflinePermitido()) entrarNoApp(true); };  // senão, segue na tela de login
  let respondeu = false;
  const prazo = setTimeout(() => { if (!respondeu) semSessao(); }, 8000);
  sb.auth.getSession()
    .then(r => { respondeu = true; clearTimeout(prazo); comSessao(r); })
    .catch(() => { respondeu = true; clearTimeout(prazo); semSessao(); });
}
boot();
</script>
