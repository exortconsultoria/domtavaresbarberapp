/* ══════════════════════════════════════════════════════════════
   MÓDULO: Atendimentos — Hoje / Esta semana / Este mês
   Cada período responde a uma pergunta diferente:
   hoje = "o que eu faço agora", semana = "como está minha semana",
   mês = "o negócio está indo bem?". Por isso cada um mostra números
   diferentes, e cada bloco vem com a frase que explica o número.
   ══════════════════════════════════════════════════════════════ */
let atdPeriodo = 'hoje';        // 'hoje' | 'semana' | 'mes'
let atdOffDia = 0, atdOffSem = 0, atdOffMes = 0;
let atdGrade = false;           // na semana, alterna lista <-> grade de horários
let agProf = '';                // filtro por profissional

function startOfWeek(offset) {
  const h = new Date();
  const seg = addDays(h, -((h.getDay() + 6) % 7));
  return addDays(seg, offset * 7);
}
function mondayOf(iso) { const d = parseISO(iso); return addDays(d, -((d.getDay() + 6) % 7)); }
function setAtdPeriodo(p) { atdPeriodo = p; render(); }
function atdNav(n) {
  if (atdPeriodo === 'hoje') atdOffDia += n;
  else if (atdPeriodo === 'semana') atdOffSem += n;
  else atdOffMes += n;
  render();
}
function atdAgora() { atdOffDia = 0; atdOffSem = 0; atdOffMes = 0; render(); }
function toggleGrade() { atdGrade = !atdGrade; render(); }
function setAgProf(v) { agProf = v; updateFiltrosBadge(); render(); }
function agFiltrada(list) { return agProf ? list.filter(a => a.profissionalId === agProf) : list; }

/* intervalo [inicio, fim] do período escolhido */
function atdIntervalo() {
  if (atdPeriodo === 'hoje') {
    const d = isoOf(addDays(new Date(), atdOffDia));
    return { ini: d, fim: d };
  }
  if (atdPeriodo === 'semana') {
    const seg = startOfWeek(atdOffSem);
    return { ini: isoOf(seg), fim: isoOf(addDays(seg, 6)) };
  }
  const h = new Date();
  const ini = new Date(h.getFullYear(), h.getMonth() + atdOffMes, 1);
  const fim = new Date(h.getFullYear(), h.getMonth() + atdOffMes + 1, 0);
  return { ini: isoOf(ini), fim: isoOf(fim) };
}
function atdTitulo() {
  const { ini, fim } = atdIntervalo();
  if (atdPeriodo === 'hoje') {
    const rel = atdOffDia === 0 ? ' · hoje' : atdOffDia === 1 ? ' · amanhã' : atdOffDia === -1 ? ' · ontem' : '';
    return fmtDateLong(ini) + rel;
  }
  if (atdPeriodo === 'semana') {
    const a = parseISO(ini), b = parseISO(fim);
    return `${pad2(a.getDate())} ${MES[a.getMonth()]} — ${pad2(b.getDate())} ${MES[b.getMonth()]}`;
  }
  return fmtMonth(monthKey(ini));
}
const noPeriodo = () => {
  const { ini, fim } = atdIntervalo();
  return agFiltrada(db.agendamentos.filter(a => a.data >= ini && a.data <= fim));
};

/* números do período — mesma base para os três, cada view escolhe o que mostra */
function atdResumo() {
  const lista = noPeriodo();
  const vivos = lista.filter(a => a.status !== 'cancelado');
  const concl = lista.filter(a => a.status === 'concluido');
  const previstos = vivos.filter(a => a.status === 'agendado' || a.status === 'confirmado');
  const faturado = somaBy(concl.filter(a => !SEM_RECEITA.includes(a.formaPag)), valorDe);
  return {
    lista, vivos, concl, previstos,
    aConfirmar: lista.filter(a => a.status === 'agendado').length,
    faltas: lista.filter(a => a.status === 'faltou').length,
    cancelados: lista.filter(a => a.status === 'cancelado').length,
    aReceber: somaBy(previstos, valorDe),
    faturado,
    ticket: concl.length ? somaBy(concl, valorDe) / concl.length : 0,
    permutas: concl.filter(a => SEM_RECEITA.includes(a.formaPag)).length
  };
}

function renderAtendimentos() {
  const r = atdResumo();
  const ehAgora = (atdPeriodo === 'hoje' && atdOffDia === 0) ||
                  (atdPeriodo === 'semana' && atdOffSem === 0) ||
                  (atdPeriodo === 'mes' && atdOffMes === 0);
  return `
  <div class="dataview-bar">
    <span class="periodo-seg">
      <button class="${atdPeriodo === 'hoje' ? 'active' : ''}" onclick="setAtdPeriodo('hoje')">Hoje</button>
      <button class="${atdPeriodo === 'semana' ? 'active' : ''}" onclick="setAtdPeriodo('semana')">Esta semana</button>
      <button class="${atdPeriodo === 'mes' ? 'active' : ''}" onclick="setAtdPeriodo('mes')">Este mês</button>
    </span>
    ${db.profissionais.length > 1 ? `<select class="srch" style="min-width:170px" onchange="setAgProf(this.value)">
      <option value="">Todos os profissionais</option>
      ${db.profissionais.map(p => `<option value="${p.id}"${agProf === p.id ? ' selected' : ''}>${esc(p.apelido || p.nome)}</option>`).join('')}
    </select>` : ''}
    <button class="btn" data-mobile-hide style="margin-left:auto" onclick="openApptForm()">+ Novo agendamento</button>
  </div>

  <div class="periodo-nav">
    <button class="cal-nav-btn" onclick="atdNav(-1)" title="Anterior">‹</button>
    <button class="cal-nav-btn" onclick="atdNav(1)" title="Próximo">›</button>
    <div class="pn-titulo">${atdTitulo()}</div>
    ${ehAgora ? '' : `<button class="mini" onclick="atdAgora()">Voltar para ${atdPeriodo === 'hoje' ? 'hoje' : 'agora'}</button>`}
  </div>

  ${atdPeriodo === 'hoje' ? viewHoje(r) : atdPeriodo === 'semana' ? viewSemana(r) : viewMes(r)}`;
}

/* ─────────── HOJE: o que fazer agora ─────────── */
function viewHoje(r) {
  const { ini } = atdIntervalo();
  const lista = r.vivos.slice().sort((a, b) => a.hora.localeCompare(b.hora));
  const agora = new Date();
  const minAgora = agora.getHours() * 60 + agora.getMinutes();
  const ehHoje = ini === todayISO();
  const proximo = ehHoje ? lista.find(a => hhmmToMin(a.hora) >= minAgora && a.status !== 'concluido') : lista[0];

  /* folga vale por profissional; com filtro ligado olha o escolhido, senão o primeiro da equipe */
  const profDoDia = agProf || (db.profissionais[0] || {}).id;
  const folga = profDoDia ? ehFolga(profDoDia, ini) : null;
  /* almoço entra na linha do tempo na posição cronológica certa, junto dos atendimentos */
  const almoco = folga ? null : almocoDe(profDoDia);
  const linhaDoTempo = lista.map(a => ({ min: hhmmToMin(a.hora), ag: a }));
  if (almoco) linhaDoTempo.push({ min: almoco.ini, pausa: true, label: almoco.label });
  linhaDoTempo.sort((x, y) => x.min - y.min);

  const historia = folga
    ? `<b>${esc(folga.motivo)}.</b> ${lista.length ? `Mesmo assim há ${lista.length} atendimento(s) marcado(s) — vale conferir.` : 'Nenhum atendimento marcado, como esperado.'}`
    : !lista.length
    ? `Dia livre. ${clientesInativos().length ? `Que tal chamar os <b>${clientesInativos().length} clientes sumidos</b>?` : 'Aproveite para organizar o catálogo.'}`
    : `${ehHoje ? 'Você tem' : 'Nesse dia são'} <b>${lista.length} atendimento${lista.length > 1 ? 's' : ''}</b>` +
      (r.aReceber > 0 ? `, <b class="valor-oculto">${money(r.aReceber)}</b> a receber` : '') +
      (r.aConfirmar ? ` · <b>${r.aConfirmar}</b> ainda sem confirmar` : ' · todos confirmados') +
      (proximo && ehHoje ? ` · próximo às <b>${proximo.hora}</b>` : '') + '.';

  return `
  ${folga ? `<div class="aviso-folga">
    <span class="af-ico">🌴</span>
    <div class="af-txt">
      <div class="af-t">${esc(folga.motivo)}</div>
      <div class="af-s">${folga.tipo === 'semanal'
        ? 'Folga fixa da semana. Dá para mudar em Ajustes → Equipe.'
        : 'Folga marcada só para este dia.'}</div>
    </div>
    ${folga.tipo === 'avulsa'
      ? `<button class="mini" onclick="removerFolga('${folga.id}')">Desmarcar folga</button>`
      : `<button class="mini" onclick="setAjTab('equipe');switchTab('ajustes')">Ajustar</button>`}
  </div>` : `<div style="margin-bottom:16px">
    <button class="mini" onclick="marcarFolga('${ini}','${profDoDia || ''}')">🌴 Marcar folga neste dia</button>
  </div>`}

  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit">${ehHoje ? 'Seu dia' : 'Esse dia'}</div>
    <div class="an-hist">${historia}</div>
    <div class="stat-grid">
      ${stat(ICO.agenda, 'Atendimentos', String(lista.length), `${r.concl.length} já concluído(s)`)}
      ${stat(ICO.money, 'A receber', money(r.aReceber), 'do que ainda falta atender', 'valor')}
      ${stat(ICO.clock, 'A confirmar', String(r.aConfirmar), r.aConfirmar ? 'mande um lembrete' : 'nada pendente', '', r.aConfirmar ? 'neg' : 'pos')}
      ${stat(ICO.hand, 'Já faturado', money(r.faturado), r.permutas ? `${r.permutas} permuta(s) fora da conta` : 'atendimentos concluídos', 'valor')}
    </div>
  </div>

  ${lista.length || almoco ? `<div class="analise">
    <div class="an-tit">Linha do tempo</div>
    <div class="an-hist">Toque num atendimento para ver detalhes, concluir ou avisar o cliente.</div>
    <div class="tl">
      ${linhaDoTempo.map(item => {
        if (item.pausa) return `<div class="tl-pausa">
          <div class="tl-hora">${minToHHMM(item.min)}</div>
          <div class="tp-faixa">🍽️ <b>Almoço</b> · ${esc(item.label)}</div>
        </div>`;
        const a = item.ag, c = getCli(a.clienteId) || {};
        const feito = a.status === 'concluido';
        const perdido = a.status === 'faltou';
        const noAlmoco = bateNoAlmoco(a.profissionalId, a.hora, a.duracaoMin || duracaoDe(a.id));
        return `<div class="tl-item${feito ? ' feito' : ''}${perdido ? ' perdido' : ''}">
          <div class="tl-hora">${a.hora}</div>
          <div class="tl-ponto" style="${!feito && !perdido ? `background:${corProf(a.profissionalId)}` : ''}"></div>
          <div class="tl-card" onclick="openApptDetail('${a.id}')">
            <div class="tc-top">
              <span class="tc-nome">${esc(c.nome || '—')}</span>
              ${stTag(a.status)}
              ${noAlmoco && !feito ? '<span class="tag neg">no almoço</span>' : ''}
              <span style="margin-left:auto;font-weight:700" class="valor-oculto">${money(valorDe(a))}</span>
            </div>
            <div class="tc-sub">${esc(nomesServicosDe(a))}${db.profissionais.length > 1 ? ' · ' + esc(nomeProf(a.profissionalId)) : ''}</div>
            ${!feito && !perdido ? `<div class="tc-acoes" onclick="event.stopPropagation()">
              <button class="mini ok" onclick="concluir('${a.id}')">Concluir</button>
              ${a.status === 'agendado' ? `<button class="mini" onclick="setStatus('${a.id}','confirmado')">Confirmar</button>` : ''}
              ${waIco(a)}
            </div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>` : `<div class="analise"><div class="empty-soft">
    Nenhum atendimento neste dia.<br><button class="btn" style="margin-top:12px" onclick="openApptForm({data:'${ini}'})">Agendar alguém</button>
  </div></div>`}`;
}

/* ─────────── ESTA SEMANA: como a semana está distribuída ─────────── */
function viewSemana(r) {
  const seg = mondayOf(atdIntervalo().ini);
  const dias = Array.from({ length: 7 }, (_, i) => isoOf(addDays(seg, i)));
  const hoje = todayISO();
  const porDia = dias.map(d => {
    const doDia = r.vivos.filter(a => a.data === d);
    return { d, qtd: doDia.length, valor: somaBy(doDia, valorDe), lista: doDia.sort((a, b) => a.hora.localeCompare(b.hora)) };
  });
  const maxQtd = Math.max(1, ...porDia.map(x => x.qtd));
  const cheio = porDia.slice().sort((a, b) => b.qtd - a.qtd)[0];
  const vazios = porDia.filter(x => !x.qtd).length;

  const historia = !r.vivos.length
    ? 'Semana sem nenhum atendimento marcado ainda.'
    : `<b>${r.vivos.length} atendimentos</b> na semana, <b class="valor-oculto">${money(r.aReceber + r.faturado)}</b> no total.` +
      (cheio && cheio.qtd ? ` <b>${diaSemanaLongo(cheio.d)}</b> é seu dia mais cheio, com ${cheio.qtd}.` : '') +
      (vazios ? ` ${vazios} dia(s) sem ninguém — espaço para encaixar.` : '');

  return `
  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit">Sua semana</div>
    <div class="an-hist">${historia}</div>
    <div class="stat-grid">
      ${stat(ICO.agenda, 'Atendimentos', String(r.vivos.length), `${r.concl.length} concluído(s)`)}
      ${stat(ICO.money, 'Faturado', money(r.faturado), 'já concluído e pago', 'valor')}
      ${stat(ICO.clock, 'A receber', money(r.aReceber), 'ainda por atender', 'valor')}
      ${stat(ICO.ticket, 'Ticket médio', money(r.ticket), 'por atendimento concluído', 'valor')}
    </div>
  </div>

  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit">Movimento por dia</div>
    <div class="an-hist">Onde estão os seus horários. Toque num dia para ver quem está marcado.</div>
    ${porDia.map(x => `
      <div class="barra ${x.qtd === maxQtd && x.qtd ? 'destaque' : ''}${x.qtd ? '' : ' vazio'}" style="cursor:pointer" onclick="irParaDia('${x.d}')">
        <div class="ba-top">
          <span class="ba-rot">${diaSemanaLongo(x.d)}${x.d === hoje ? ' · hoje' : ''}</span>
          <span class="ba-val">${x.qtd ? `${x.qtd} · <span class="valor-oculto">${money(x.valor)}</span>` : 'livre'}</span>
        </div>
        <div class="ba-track"><div class="ba-fill" style="width:${x.qtd ? Math.max(6, pct(x.qtd, maxQtd)) : 2}%"></div></div>
      </div>`).join('')}
  </div>

  <div class="analise">
    <div class="an-tit" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span>${atdGrade ? 'Grade de horários' : 'Todos os atendimentos'}</span>
      <button class="mini" onclick="toggleGrade()">${atdGrade ? 'Ver como lista' : 'Ver grade de horários'}</button>
    </div>
    <div class="an-hist">${atdGrade ? 'Toque num horário vago para agendar.' : 'Em ordem de dia e hora.'}</div>
    ${atdGrade ? gradeSemana(seg) : listaAgrupada(porDia)}
  </div>`;
}
function diaSemanaLongo(iso) {
  const d = parseISO(iso);
  const nomes = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  return `${nomes[d.getDay()]} ${pad2(d.getDate())}`;
}
function marcarFolga(data, profId) {
  if (!profId) { toast('Cadastre um profissional primeiro.', '⚠️'); return; }
  const marcados = db.agendamentos.filter(a => a.data === data && a.profissionalId === profId && a.status !== 'cancelado');
  const body = `
    <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6;margin-bottom:16px">
      Marcar <b style="color:var(--text)">${fmtDateLong(data)}</b> como folga de
      <b style="color:var(--text)">${esc(nomeProf(profId))}</b>.
    </div>
    <label>Motivo (opcional)</label>
    <input id="fFolgaMotivo" placeholder="Ex.: feriado, viagem, médico">
    ${marcados.length ? `<div style="font-size:.8rem;color:var(--red);margin-top:14px;line-height:1.5">
      Atenção: já existem <b>${marcados.length} atendimento(s)</b> marcados nesse dia. Eles não são apagados —
      só ficam sinalizados. Reagende ou avise os clientes.
    </div>` : ''}`;
  openCModal('Marcar folga', body, [
    { label: 'Marcar folga', fn: () => {
      db.folgas.push({ id: uid(), profissionalId: profId, data, motivo: val('fFolgaMotivo').trim() || 'Folga' });
      saveDB(); closeCModal(); render();
      toast(`${fmtDateLong(data)} marcado como folga.`, '🌴');
    } },
    { label: 'Cancelar', cls: 'btn-ghost', fn: closeCModal }
  ]);
}
function removerFolga(id) {
  db.folgas = db.folgas.filter(f => f.id !== id);
  saveDB(); render();
  toast('Folga desmarcada.', '↩️');
}
function irParaDia(iso) {
  atdPeriodo = 'hoje';
  atdOffDia = Math.round((parseISO(iso) - parseISO(todayISO())) / 86400000);
  render();
}
function listaAgrupada(porDia) {
  const comGente = porDia.filter(x => x.qtd);
  if (!comGente.length) return `<div class="empty-soft">Nenhum atendimento nesta semana.</div>`;
  return comGente.map(x => `
    <div style="margin-top:14px">
      <span class="pb-label" style="margin-bottom:6px">${diaSemanaLongo(x.d)}</span>
      ${x.lista.map(a => `
        <div class="li clickable" onclick="openApptDetail('${a.id}')">
          <div class="lbar" style="background:${corProf(a.profissionalId)}"></div>
          <div class="lbody">
            <div class="lt">${a.hora} · ${esc(nomeCli(a.clienteId))} ${stTag(a.status)}</div>
            <div class="lm">${esc(nomesServicosDe(a))}</div>
          </div>
          <div class="lend valor-oculto">${money(valorDe(a))}</div>
          ${a.status === 'agendado' || a.status === 'confirmado' ? waIco(a) : ''}
        </div>`).join('')}
    </div>`).join('');
}
function gradeSemana(seg) {
  const ini = hhmmToMin(db.config.abertura), fim = hhmmToMin(db.config.fechamento);
  const dias = Array.from({ length: 7 }, (_, i) => isoOf(addDays(seg, i)));
  const hoje = todayISO();
  const ags = agFiltrada(db.agendamentos.filter(a => dias.includes(a.data)));
  let head = `<div class="cal-corner"></div>` + dias.map(d => {
    const dt = parseISO(d);
    return `<div class="cal-dow${d === hoje ? ' today' : ''}"><div class="d1">${DOW[dt.getDay()]}</div><div class="d2">${pad2(dt.getDate())}</div></div>`;
  }).join('');
  let body = '';
  for (let h = ini; h < fim; h += 60) {
    body += `<div class="cal-hour">${minToHHMM(h)}</div>`;
    dias.forEach(d => {
      const noSlot = ags.filter(a => a.data === d && hhmmToMin(a.hora) >= h && hhmmToMin(a.hora) < h + 60)
        .sort((a, b) => a.hora.localeCompare(b.hora));
      const profRef = agProf || (db.profissionais[0] || {}).id;
      const folgaDia = profRef ? ehFolga(profRef, d) : null;
      const alm = profRef && !folgaDia ? almocoDe(profRef) : null;
      const noAlmoco = alm && h < alm.fim && alm.ini < h + 60;
      body += `<div class="cal-slot${d === hoje ? ' today-col' : ''}${folgaDia ? ' folga-dia' : noAlmoco ? ' pausa' : ''}"
        title="${folgaDia ? esc(folgaDia.motivo) : noAlmoco ? 'Almoço · ' + esc(alm.label) : ''}"
        onclick="openApptForm({data:'${d}',hora:'${minToHHMM(h)}'})">
        ${noSlot.map(a => `<div class="cal-appt ${a.status === 'concluido' ? 'done' : ''}${a.status === 'cancelado' || a.status === 'faltou' ? ' cancel' : ''}"
             style="border-left-color:${corProf(a.profissionalId)}"
             onclick="event.stopPropagation();openApptDetail('${a.id}')" title="${esc(nomeCli(a.clienteId))} — ${esc(nomesServicosDe(a))}">
             <div class="ca-h">${a.hora}</div><div class="ca-n">${esc(firstName(nomeCli(a.clienteId)))}</div>
           </div>`).join('')}
      </div>`;
    });
  }
  return `<div class="cal-scroll" style="margin-top:10px"><div class="cal-tbl">${head}${body}</div></div>`;
}

/* ─────────── ESTE MÊS: o negócio está indo bem? ─────────── */
function viewMes(r) {
  const { ini, fim } = atdIntervalo();
  const mk = monthKey(ini);
  const meta = db.metas.find(m => m.mes === mk);
  const receitaMes = somaBy(db.financeiro.filter(f => f.tipo === 'receita' && monthKey(f.data) === mk), f => f.valor);

  /* semanas do mês */
  const semanas = [];
  let cursor = mondayOf(ini);
  const fimD = parseISO(fim);
  while (cursor <= fimD) {
    const a = isoOf(cursor), b = isoOf(addDays(cursor, 6));
    const doPeriodo = r.vivos.filter(x => x.data >= a && x.data <= b);
    semanas.push({ a, b, qtd: doPeriodo.length, valor: somaBy(doPeriodo, valorDe) });
    cursor = addDays(cursor, 7);
  }
  const maxSem = Math.max(1, ...semanas.map(s => s.qtd));
  const melhorSem = semanas.slice().sort((x, y) => y.valor - x.valor)[0];

  /* clientes que mais aparecem — por agendamento, com o valor total dele */
  const contaPor = (arr, chave) => {
    const m = {};
    arr.forEach(a => { const k = chave(a); m[k] = m[k] || { qtd: 0, valor: 0 }; m[k].qtd++; m[k].valor += valorDe(a); });
    return Object.entries(m).map(([k, v]) => ({ k, ...v })).sort((x, y) => y.valor - x.valor);
  };
  /* serviços que mais aparecem — por item, não por agendamento */
  const contaPorServico = arr => {
    const ids = new Set(arr.map(a => a.id));
    const m = {};
    db.agendamentoServicos.filter(x => ids.has(x.agendamentoId)).forEach(x => {
      m[x.servicoId] = m[x.servicoId] || { qtd: 0, valor: 0 }; m[x.servicoId].qtd++; m[x.servicoId].valor += x.valor;
    });
    return Object.entries(m).map(([k, v]) => ({ k, ...v })).sort((x, y) => y.valor - x.valor);
  };
  const topServicos = contaPorServico(r.concl).slice(0, 5);
  const topClientes = contaPor(r.concl, a => a.clienteId).slice(0, 5);
  const maxSrv = Math.max(1, ...topServicos.map(s => s.valor));
  const maxCli = Math.max(1, ...topClientes.map(c => c.valor));
  const totalTop = somaBy(topClientes, c => c.valor);

  const diasNoMes = parseISO(fim).getDate();
  const diaHoje = monthKey(todayISO()) === mk ? new Date().getDate() : diasNoMes;
  const ritmo = diaHoje > 0 ? receitaMes / diaHoje : 0;
  const projecao = ritmo * diasNoMes;

  const historia = !r.lista.length
    ? 'Nenhum atendimento registrado neste mês ainda.'
    : `<b>${r.concl.length} atendimento(s)</b> concluídos e <b class="valor-oculto">${money(receitaMes)}</b> faturados.` +
      (meta ? (receitaMes >= meta.valor
        ? ` <b>Meta batida!</b> Passou em ${money(receitaMes - meta.valor)}.`
        : ` Faltam <b class="valor-oculto">${money(meta.valor - receitaMes)}</b> para a meta — cerca de <b>${Math.ceil((meta.valor - receitaMes) / Math.max(1, r.ticket))} atendimentos</b>.`) : '') +
      (r.faltas ? ` ${r.faltas} falta(s) no período.` : '');

  return `
  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit">Seu mês</div>
    <div class="an-hist">${historia}</div>
    <div class="stat-grid">
      ${stat(ICO.agenda, 'Atendimentos', String(r.vivos.length), `${r.concl.length} concluído(s)`)}
      ${stat(ICO.money, 'Faturado', money(receitaMes), 'receitas do mês', 'valor')}
      ${stat(ICO.ticket, 'Ticket médio', money(r.ticket), 'por atendimento', 'valor')}
      ${meta
        ? stat(ICO.star, 'Meta do mês', `${pct(receitaMes, meta.valor)}%`, `de ${moneyShort(meta.valor)}`, '', receitaMes >= meta.valor ? 'pos' : '')
        : stat(ICO.clock, 'Projeção', money(projecao), 'no ritmo atual', 'valor')}
    </div>
    ${meta ? `<div class="goal" style="margin-top:14px">
      <div class="gh"><span class="gt">Meta de ${fmtMonth(mk)}</span>
        <span class="gv valor-oculto">${money(receitaMes)} de ${money(meta.valor)}</span></div>
      <div class="gtrack"><div class="gfill" style="width:${Math.min(100, pct(receitaMes, meta.valor))}%"></div></div>
    </div>` : ''}
  </div>

  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit">Semana a semana</div>
    <div class="an-hist">${melhorSem && melhorSem.qtd
      ? `A semana de <b>${fmtDate(melhorSem.a)}</b> foi a mais forte, com ${melhorSem.qtd} atendimento(s).`
      : 'Ainda não há movimento para comparar.'}</div>
    ${semanas.map(s => `
      <div class="barra ${s.qtd === maxSem && s.qtd ? 'destaque' : ''}${s.qtd ? '' : ' vazio'}">
        <div class="ba-top">
          <span class="ba-rot">${fmtDate(s.a)} a ${fmtDate(s.b)}</span>
          <span class="ba-val">${s.qtd ? `${s.qtd} · <span class="valor-oculto">${money(s.valor)}</span>` : 'sem movimento'}</span>
        </div>
        <div class="ba-track"><div class="ba-fill" style="width:${s.qtd ? Math.max(6, pct(s.qtd, maxSem)) : 2}%"></div></div>
      </div>`).join('')}
  </div>

  <div class="p-row2">
    <div class="analise">
      <div class="an-tit">O que mais sai</div>
      <div class="an-hist">${topServicos.length
        ? `<b>${esc(nomeSrv(topServicos[0].k))}</b> é o seu carro-chefe do mês.`
        : 'Conclua atendimentos para ver o ranking.'}</div>
      ${topServicos.length ? topServicos.map(s => `
        <div class="barra">
          <div class="ba-top"><span class="ba-rot">${esc(nomeSrv(s.k))}</span>
            <span class="ba-val">${s.qtd}× · <span class="valor-oculto">${money(s.valor)}</span></span></div>
          <div class="ba-track"><div class="ba-fill" style="width:${Math.max(6, pct(s.valor, maxSrv))}%"></div></div>
        </div>`).join('') : `<div class="empty-soft">Nada concluído ainda.</div>`}
    </div>
    <div class="analise">
      <div class="an-tit">Quem mais volta</div>
      <div class="an-hist">${topClientes.length && totalTop
        ? `<b>${esc(firstName(nomeCli(topClientes[0].k)))}</b> representa ${pct(topClientes[0].valor, totalTop)}% do que esses clientes deixaram no mês.`
        : 'Conclua atendimentos para ver o ranking.'}</div>
      ${topClientes.length ? topClientes.map(c => `
        <div class="barra" style="cursor:pointer" onclick="openClienteDetail('${c.k}')">
          <div class="ba-top"><span class="ba-rot">${esc(nomeCli(c.k))}</span>
            <span class="ba-val">${c.qtd}× · <span class="valor-oculto">${money(c.valor)}</span></span></div>
          <div class="ba-track"><div class="ba-fill" style="width:${Math.max(6, pct(c.valor, maxCli))}%"></div></div>
        </div>`).join('') : `<div class="empty-soft">Nada concluído ainda.</div>`}
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   VIEW: Mensagens — disparo de WhatsApp
   O WhatsApp não permite envio em massa por link: o wa.me abre uma
   conversa por vez. Então a tela monta a fila e marca quem já recebeu.
   ══════════════════════════════════════════════════════════════ */
let msgSeg = 'confirmar';
const MSG_SEGS = {
  confirmar: { label: 'Confirmar hoje', desc: 'Quem tem horário hoje e ainda não confirmou' },
  aniversario: { label: 'Aniversariantes', desc: 'Quem faz aniversário neste mês' },
  retorno: { label: 'Sumidos', desc: 'Quem não aparece há um tempo' },
  todos: { label: 'Todos os clientes', desc: 'Base inteira — use com parcimônia' }
};
const TPL_PADRAO = {
  confirmar: 'Olá {nome}! Aqui é da {barbearia}. Confirmando seu horário hoje às {hora}. Posso confirmar?',
  aniversario: 'Parabéns, {nome}! 🎉 A {barbearia} te deseja tudo de bom. Passa aqui pra comemorar com um corte.',
  retorno: 'Olá {nome}! Faz um tempo que você não aparece na {barbearia}. Bora marcar um horário?',
  todos: 'Olá {nome}! Aqui é da {barbearia}. '
};
const tplDe = seg => (db.config.templates && db.config.templates[seg]) || TPL_PADRAO[seg];
function setMsgSeg(s) { msgSeg = s; render(); }
function salvarTemplate() {
  db.config.templates = Object.assign({}, db.config.templates, { [msgSeg]: val('msgTpl') });
  saveDB(); render();
  toast('Modelo de mensagem salvo.', '💬');
}
function resetTemplate() {
  if (db.config.templates) delete db.config.templates[msgSeg];
  saveDB(); render();
  toast('Modelo voltou ao padrão.', '↩️');
}
/* destinatários do segmento: { c, hora } */
function msgDestinatarios(seg) {
  if (seg === 'confirmar') {
    return db.agendamentos
      .filter(a => a.data === todayISO() && a.status === 'agendado')
      .sort((a, b) => a.hora.localeCompare(b.hora))
      .map(a => ({ c: getCli(a.clienteId), hora: a.hora }))
      .filter(x => x.c);
  }
  if (seg === 'aniversario') {
    const mes = pad2(new Date().getMonth() + 1);
    return db.clientes.filter(c => c.nasc && c.nasc.slice(5, 7) === mes)
      .sort((a, b) => a.nasc.slice(8).localeCompare(b.nasc.slice(8))).map(c => ({ c }));
  }
  if (seg === 'retorno') return clientesInativos().map(x => ({ c: x.c, ult: x.ult }));
  return db.clientes.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(c => ({ c }));
}
function montarMsg(tpl, d) {
  return String(tpl)
    .replace(/\{nome\}/g, firstName(d.c.nome))
    .replace(/\{barbearia\}/g, nomeBarbearia())
    .replace(/\{hora\}/g, d.hora || '')
    .replace(/\{data\}/g, fmtDateLong(todayISO()));
}
const jaEnviou = (clienteId, seg) => db.msgLog.some(l => l.clienteId === clienteId && l.seg === seg && l.data === todayISO());
function marcarEnviado(clienteId, seg) {
  if (!jaEnviou(clienteId, seg)) db.msgLog.push({ id: uid(), clienteId, seg, data: todayISO() });
  saveDB();
  if (activeTab === 'mensagens') render();
}

/* ══════════════════════════════════════════════════════════════
   Custos fixos — as contas que chegam todo mês (aluguel, energia, água...).
   Ficam cadastrados uma vez; a cada mês o app lança de uma vez só no
   financeiro, sem duplicar o que já foi lançado.
   ══════════════════════════════════════════════════════════════ */
const custosAtivos = () => (db.custosFixos || []).filter(c => c.ativo);
const totalCustosFixos = () => somaBy(custosAtivos(), c => c.valor);
/* custos já lançados no mês corrente */
const custosLancadosNoMes = (mk) => new Set(
  db.financeiro.filter(f => f.custoFixoId && monthKey(f.data) === (mk || curMonthKey())).map(f => f.custoFixoId)
);
function custosPendentes(mk) {
  const jaFoi = custosLancadosNoMes(mk);
  return custosAtivos().filter(c => !jaFoi.has(c.id));
}
/* lista de meses 'YYYY-MM' entre dois extremos, inclusive */
function mesesEntre(de, ate) {
  const out = [];
  let [ay, am] = de.split('-').map(Number);
  const [by, bm] = ate.split('-').map(Number);
  while (ay < by || (ay === by && am <= bm)) {
    out.push(`${ay}-${pad2(am)}`);
    am++; if (am > 12) { am = 1; ay++; }
    if (out.length > 60) break;                    // trava de segurança
  }
  return out;
}
/* despesa solta do mês que é claramente esse mesmo custo (mesmo nome, mesmo valor)
   e ainda não está vinculada — evita lançar em cima do que já foi lançado na mão */
function despesaEquivalente(mk, custo) {
  const norm = s => String(s || '').trim().toLowerCase();
  const a = norm(custo.nome);
  return db.financeiro.find(f => {
    if (f.tipo !== 'despesa' || f.custoFixoId || monthKey(f.data) !== mk) return false;
    if (Number(f.valor) !== Number(custo.valor)) return false;      // valor tem que bater
    const b = norm(f.descricao);
    return b === a || b.includes(a) || a.includes(b);               // "Aluguel" ≈ "Aluguel do ponto"
  });
}
/* grava os pendentes de um mês; devolve quantos entraram e quantos foram só vinculados */
function gravarCustosDoMes(mk) {
  const pendentes = custosPendentes(mk);
  if (!pendentes.length) return { qtd: 0, total: 0, vinculados: 0 };
  const ultimoDia = new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate();
  let vinculados = 0;
  pendentes.forEach(c => {
    const jaExiste = despesaEquivalente(mk, c);
    if (jaExiste) { jaExiste.custoFixoId = c.id; vinculados++; return; }   // adota em vez de duplicar
    const dia = Math.min(Number(c.diaVenc) || 5, ultimoDia);   // dia 31 em mês de 30 não pode virar data inválida
    db.financeiro.push({
      id: uid(), data: `${mk}-${pad2(dia)}`, tipo: 'despesa', categoria: c.categoria || 'Geral',
      descricao: c.nome, valor: c.valor, formaPag: null, auto: false, custoFixoId: c.id,
      escopo: c.escopo === 'pessoal' ? 'pessoal' : 'barbearia',   // herda de quem é a conta
      pago: mk <= curMonthKey()   // mês futuro nasce como previsto, não como pago
    });
  });
  return { qtd: pendentes.length, total: somaBy(pendentes, c => c.valor), vinculados };
}
function lancarCustosDoMes() { abrirLancamentoCustos(finMes, finMes); }
function lancarCustosAteDezembro() {
  const mk = curMonthKey();
  abrirLancamentoCustos(mk, `${mk.slice(0, 4)}-12`);
}
function abrirLancamentoCustos(de, ate) {
  if (!custosAtivos().length) { toast('Cadastre um custo fixo antes de lançar.', '⚠️'); return; }
  const body = `
    <div class="form-grid">
      <div><label>De</label><input type="month" id="lcDe" value="${de}"></div>
      <div><label>Até</label><input type="month" id="lcAte" value="${ate}"></div>
    </div>
    <div id="lcPrevia" style="margin-top:16px"></div>`;
  openCModal('Lançar custos fixos', body, [
    { label: 'Lançar', fn: () => {
      const d = val('lcDe'), a = val('lcAte');
      if (!d || !a || a < d) { toast('O mês final tem que ser igual ou depois do inicial.', '⚠️'); return; }
      let qtd = 0, total = 0, meses = 0, vinc = 0;
      mesesEntre(d, a).forEach(mk => {
        const res = gravarCustosDoMes(mk);
        if (res.qtd) { meses++; qtd += res.qtd; total += res.total; vinc += res.vinculados; }
      });
      if (!qtd) { toast('Nada a lançar: esses meses já estão todos em dia.', '👍'); return; }
      saveDB(); closeCModal(); render();
      toast(`${qtd} lançamento(s) em ${meses} mês(es) — <b>${money(total)}</b>.` +
        (vinc ? `<br><small>${vinc} já existia(m) na mão e foi(ram) aproveitado(s), sem duplicar.</small>` : ''), '📌');
    } },
    { label: 'Cancelar', cls: 'btn-ghost', fn: closeCModal }
  ]);
  const atualizar = () => {
    const d = val('lcDe'), a = val('lcAte');
    const el = document.getElementById('lcPrevia');
    if (!el) return;
    if (!d || !a || a < d) { el.innerHTML = `<div class="empty-soft">Escolha um intervalo válido.</div>`; return; }
    const linhas = mesesEntre(d, a).map(mk => ({ mk, p: custosPendentes(mk) }));
    const totalGeral = somaBy(linhas, l => somaBy(l.p, c => c.valor));
    const aLancar = somaBy(linhas, l => l.p.length);
    el.innerHTML = `
      <div style="font-size:.84rem;color:var(--text-dim);line-height:1.6;margin-bottom:10px">
        ${aLancar
          ? `Vou lançar <b style="color:var(--text)">${aLancar} despesa(s)</b> somando <b style="color:var(--red)">${money(totalGeral)}</b>. Meses já lançados são pulados.`
          : 'Todos esses meses já estão lançados — nada será duplicado.'}
      </div>
      ${linhas.map(l => `<div class="li">
        <div class="lbody"><div class="lt" style="text-transform:capitalize">${fmtMonth(l.mk)}</div>
          <div class="lm">${l.p.length ? `${l.p.length} conta(s) a lançar` : 'já lançado'}</div></div>
        <div class="lend valor-oculto" style="color:var(--${l.p.length ? 'red' : 'text-mute'})">${l.p.length ? money(somaBy(l.p, c => c.valor)) : '—'}</div>
      </div>`).join('')}`;
  };
  ['lcDe', 'lcAte'].forEach(id => { const el = document.getElementById(id); if (el) el.onchange = atualizar; });
  atualizar();
}
function renderCustosFixos() {
  const lista = (db.custosFixos || []).slice().sort((a, b) => (a.diaVenc - b.diaVenc) || a.nome.localeCompare(b.nome));
  const mk = finMes;

  return `
  <div class="dataview-bar">
    <span style="font-size:.8rem;color:var(--text-dim)">Contas que se repetem todo mês. Cadastre uma vez e lance de uma tacada só.</span>
    <button class="btn" style="margin-left:auto" onclick="openCustoForm()">+ Novo custo fixo</button>
  </div>
  <div class="stat-grid stat-3" style="margin-bottom:16px">
    ${stat(ICO.box, 'Total por mês', money(totalCustosFixos()),
      `barbearia ${moneyShort(somaBy(custosAtivos().filter(c => c.escopo !== 'pessoal'), c => c.valor))} · Tavares ${moneyShort(somaBy(custosAtivos().filter(c => c.escopo === 'pessoal'), c => c.valor))}`,
      'valor', 'neg')}
    ${stat(ICO.clock, 'A lançar neste mês', String(pendentes.length), pendentes.length ? 'ainda fora do financeiro' : 'tudo lançado', '', pendentes.length ? 'neg' : 'pos')}
    ${stat(ICO.money, 'Sobra sobre os fixos', money(m.receita - totalCustosFixos()), `faturado ${moneyShort(m.receita)} no mês`, 'valor', (m.receita - totalCustosFixos()) < 0 ? 'neg' : 'pos')}
  </div>
  ${custosAtivos().length ? `<div class="p-block" style="margin-bottom:16px;${pendentes.length ? 'border-color:var(--accent)' : ''}">
    <span class="pb-label">Lançar no financeiro</span>
    <div style="font-size:.84rem;color:var(--text-dim);line-height:1.5;margin-bottom:12px">
      ${pendentes.length
        ? `${pendentes.length} conta(s) somando <b class="valor-oculto" style="color:var(--text)">${money(somaBy(pendentes, c => c.valor))}</b> ainda não entraram em ${fmtMonth(mk)}.`
        : `${fmtMonth(mk)} está em dia. Você pode adiantar os próximos meses para já enxergar o ano inteiro.`}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">

      <button class="${pendentes.length ? 'mini' : 'btn'}" onclick="lancarCustosAteDezembro()">Lançar até dezembro</button>
      <button class="mini" onclick="abrirLancamentoCustos(finMes, finMes)">Escolher período…</button>
    </div>
  </div>` : ''}
  <div class="tbl-wrap">
    <div class="tbl-header"><div class="tbl-title">Custos cadastrados</div>
      <div style="font-size:.76rem;color:var(--text-dim)">${lista.length} item(ns)</div></div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Conta</th><th>De quem</th><th>Categoria</th><th>Vence</th><th>Valor</th><th>Status</th></tr></thead>
      <tbody>${lista.length ? lista.map(c => {
        const lancado = custosLancadosNoMes(mk).has(c.id);
        return `<tr onclick="openCustoForm('${c.id}')">
          <td><b>${esc(c.nome)}</b></td>
          <td>${c.escopo === 'pessoal' ? '<span class="tag neutro">Tavares</span>' : '<span class="tag brass">Barbearia</span>'}</td>
          <td>${esc(c.categoria || '—')}</td>
          <td>dia ${c.diaVenc}</td>
          <td class="valor-oculto">${money(c.valor)}</td>
          <td>${!c.ativo ? '<span class="tag neutro">inativo</span>'
                : lancado ? '<span class="tag pos">lançado</span>'
                : '<span class="tag brass">a lançar</span>'}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="6"><div class="empty-soft">Nenhum custo fixo cadastrado. Comece pelo aluguel.</div></td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
function openCustoForm(id) {
  const c = id ? (db.custosFixos || []).find(x => x.id === id) : null;
  const body = `
    <div class="form-grid">
      <div class="full"><label>Nome da conta</label><input id="fCNome" value="${esc(c ? c.nome : '')}" placeholder="Ex.: Aluguel do ponto"></div>
      <div class="full"><label>Essa conta é de quê?</label>
        <select id="fCEscopo" onchange="trocarCategoriasCusto()">
          <option value="barbearia"${!c || c.escopo !== 'pessoal' ? ' selected' : ''}>Da barbearia (ponto, energia, internet da loja...)</option>
          <option value="pessoal"${c && c.escopo === 'pessoal' ? ' selected' : ''}>Pessoal do Tavares (aluguel do ap, pensão, internet de casa...)</option>
        </select>
      </div>
      <div class="full" id="wrapCatCusto"><label>Categoria</label>
        ${selectCategoria('fCCat', 'fCCatOutra', c && c.escopo === 'pessoal' ? 'pessoal' : 'barbearia', c ? c.categoria : '')}
      </div>
      <div><label>Valor (R$)</label><input type="number" id="fCVal" step="0.01" min="0" value="${c ? c.valor : ''}"></div>
      <div><label>Vence no dia</label><input type="number" id="fCDia" min="1" max="31" value="${c ? c.diaVenc : 5}"></div>
      <div><label>Situação</label>
        <select id="fCAtivo"><option value="1"${!c || c.ativo ? ' selected' : ''}>Ativo</option><option value="0"${c && !c.ativo ? ' selected' : ''}>Inativo</option></select>
      </div>
    </div>
    <div style="font-size:.78rem;color:var(--text-mute);margin-top:14px;line-height:1.5">
      Cadastrar aqui não lança nada sozinho. Todo mês você aperta <b>Lançar no mês</b> e o app joga
      as contas no financeiro de uma vez.
    </div>`;
  const actions = [{ label: c ? 'Salvar' : 'Cadastrar', fn: () => salvarCusto(id) }];
  if (c) actions.push({ label: 'Excluir', cls: 'btn-danger', fn: () => delCusto(id) });
  actions.push({ label: 'Cancelar', cls: 'btn-ghost', fn: closeDrawer });
  openDrawer(c ? 'Editar custo fixo' : 'Novo custo fixo', body, actions);
}
function salvarCusto(id) {
  const nome = val('fCNome').trim(), valor = Number(val('fCVal'));
  if (!nome) { toast('Dê um nome para a conta.', '⚠️'); return; }
  if (!(valor > 0)) { toast('Informe um valor maior que zero.', '⚠️'); return; }
  const dia = Math.min(31, Math.max(1, Number(val('fCDia')) || 5));
  const dados = { nome, categoria: leCategoria('fCCat', 'fCCatOutra'), valor, diaVenc: dia,
                  ativo: val('fCAtivo') === '1', escopo: val('fCEscopo') || 'barbearia' };
  if (!Array.isArray(db.custosFixos)) db.custosFixos = [];
  if (id) Object.assign(db.custosFixos.find(x => x.id === id), dados);
  else db.custosFixos.push(Object.assign({ id: uid() }, dados));
  saveDB(); closeDrawer(); render();
  toast(id ? 'Custo atualizado.' : `<b>${esc(nome)}</b> cadastrado.`, '🧾');
}
function delCusto(id) {
  const usados = db.financeiro.filter(f => f.custoFixoId === id).length;
  db.custosFixos = db.custosFixos.filter(c => c.id !== id);
  db.financeiro.forEach(f => { if (f.custoFixoId === id) f.custoFixoId = undefined; });
  saveDB(); closeDrawer(); render();
  toast(usados ? `Custo excluído. Os ${usados} lançamento(s) já feitos continuam no financeiro.` : 'Custo excluído.', '🗑️');
}

          <div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-dim)">Faturamento gerado <b style="color:var(--text)">${money(d.fat)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-dim)">Comissão a pagar <b style="color:var(--accent-bright)">${money(d.comissao)}</b></div>

        .sort((a, b) => a.hora.localeCompare(b.hora));
      const fg = ehFolga(p.id, todayISO());

      return `<div class="li">

          <div class="lm">${l.length ? l.map(a => `${a.hora} ${esc(firstName(nomeCli(a.clienteId)))}`).join(' · ') : 'sem atendimentos hoje'}${alm ? ` · almoço ${esc(alm.label)}` : ''}</div>

let finTab = 'mov';
let finMes = curMonthKey();          // mês em foco no financeiro (filtro de mês/ano)
let finAno = new Date().getFullYear();
function setFinTab(t) { finTab = t; render(); }
function setFinMes(v) { if (v) { finMes = v; render(); } }
function finMesNav(n) {
  let [y, m] = finMes.split('-').map(Number);
  m += n; if (m > 12) { m = 1; y++; } if (m < 1) { m = 12; y--; }
  finMes = `${y}-${pad2(m)}`; render();
}
function finMesHoje() { finMes = curMonthKey(); render(); }
function setFinAno(v) { finAno = Number(v) || new Date().getFullYear(); render(); }
/* barra de mês/ano usada pelas abas que olham um mês por vez */
function seletorMes() {
  return `<div class="periodo-nav" style="margin:0 0 16px">

}
function renderFinanceiro() {

/* Categorias sugeridas por escopo. Texto livre fragmenta o gráfico
   ("mercado" vs "Mercado" vs "Supermercado" viram três barras), então
   ele escolhe de uma lista — e ainda pode criar a própria em "Outra". */
const CATEGORIAS = {
  barbearia: ['Aluguel', 'Energia', 'Água', 'Água mineral', 'Internet', 'Insumos', 'Produtos', 'Lavanderia',
              'Manutenção', 'Equipamento', 'Marketing', 'Taxa de cartão', 'Contador', 'Impostos', 'Outros'],
  /* as 14 primeiras são as que o próprio Tavares pediu, na palavra dele;
     o resto são sugestões que já estavam aqui e continuam disponíveis */
  pessoal: ['Aluguel', 'Água mineral', 'Almoço', 'Empréstimo', 'Equipamentos', 'Insumos',
            'Internet', 'Impostos', 'Lavanderia', 'Mercado', 'Pensão', 'Pessoal',
            'Produtos', 'Passagem', 'Pet',
            'Energia', 'Água', 'Telefone', 'Transporte', 'Combustível',
            'Saúde', 'Farmácia', 'Educação', 'Lazer', 'Roupas', 'Cartão de crédito', 'Outros']
};
/* junta as sugeridas com as que ele já usou, pra não perder nada do histórico */
function categoriasDe(escopo) {
  const usadas = new Set();
  db.financeiro.filter(f => f.tipo === 'despesa' && (f.escopo === 'pessoal') === (escopo === 'pessoal'))
    .forEach(f => { if (f.categoria) usadas.add(f.categoria); });
  (db.custosFixos || []).filter(c => (c.escopo === 'pessoal') === (escopo === 'pessoal'))
    .forEach(c => { if (c.categoria) usadas.add(c.categoria); });
  const base = CATEGORIAS[escopo === 'pessoal' ? 'pessoal' : 'barbearia'];
  return [...new Set([...base, ...usadas])].sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
/* monta o <select> de categoria; "Outra" revela um campo de texto */
function selectCategoria(idSelect, idOutra, escopo, valorAtual) {
  const lista = categoriasDe(escopo);
  const naLista = valorAtual && lista.includes(valorAtual);
  return `
    <select id="${idSelect}" onchange="document.getElementById('${idOutra}').style.display = this.value === '__outra' ? '' : 'none'">
      ${lista.map(c => `<option value="${esc(c)}"${naLista && c === valorAtual ? ' selected' : ''}>${esc(c)}</option>`).join('')}
      <option value="__outra"${valorAtual && !naLista ? ' selected' : ''}>Outra…</option>
    </select>
    <input id="${idOutra}" placeholder="Escreva a categoria" value="${valorAtual && !naLista ? esc(valorAtual) : ''}"
           style="margin-top:8px;${valorAtual && !naLista ? '' : 'display:none'}">`;
}
const leCategoria = (idSelect, idOutra) => {
  const v = val(idSelect);
  return v === '__outra' ? (val(idOutra).trim() || 'Outros') : v;
};

let finFiltro = 'tudo';        // filtro da lista de lançamentos: tudo | barbearia | pessoal
function setFinFiltro(v) { finFiltro = v; render(); }
/* categorias abertas no gráfico; chave "escopo|categoria" pra os dois lados não se confundirem */
let catAbertas = {};
function toggleCat(chave) { catAbertas[chave] = !catAbertas[chave]; render(); }

const despesasDoMes = (mk, escopo) => db.financeiro.filter(f =>
  f.tipo === 'despesa' && monthKey(f.data) === mk && (ehPessoal(f) ? 'pessoal' : 'barbearia') === escopo);
function porCategoria(lista) {
  const m = {};
  lista.forEach(f => { const k = f.categoria || 'Outros'; (m[k] = m[k] || []).push(f); });
  return Object.entries(m)
    .map(([k, itens]) => ({ k, itens, v: somaBy(itens, f => f.valor) }))
    .sort((a, b) => b.v - a.v);
}

/* ── Bloco "para onde vai o dinheiro": barras por categoria que abrem
   e mostram os lançamentos que formam aquele valor ── */
function blocoDespesas(mk, escopo, opts) {
  opts = opts || {};
  const lista = despesasDoMes(mk, escopo);
  const total = somaBy(lista, f => f.valor);
  const cats = porCategoria(lista);
  const maior = Math.max(1, ...cats.map(c => c.v));
  const ehBarb = escopo === 'barbearia';
  const quem = ehBarb ? 'A barbearia' : 'O Tavares';

  /* comparação com o mês anterior dá o "está piorando ou melhorando?" */
  const [y, mo] = mk.split('-').map(Number);
  const mkAnt = mo === 1 ? `${y - 1}-12` : `${y}-${pad2(mo - 1)}`;
  const totalAnt = somaBy(despesasDoMes(mkAnt, escopo), f => f.valor);
  const variacao = totalAnt > 0 ? Math.round((total - totalAnt) / totalAnt * 100) : null;

  const historia = !cats.length
    ? `Nenhuma despesa ${ehBarb ? 'da barbearia' : 'pessoal'} lançada em ${fmtMonth(mk)}.`
    : `${quem} gastou <b class="valor-oculto">${money(total)}</b>. ` +
      `O maior peso é <b>${esc(cats[0].k)}</b>, com ${pct(cats[0].v, total)}% do total.` +
      (variacao !== null
        ? variacao === 0 ? ' Igual ao mês passado.'
        : variacao > 0 ? ` <b style="color:var(--red)">${variacao}% a mais</b> que ${fmtMonth(mkAnt).split('/')[0]}.`
        : ` <b style="color:var(--green)">${Math.abs(variacao)}% a menos</b> que ${fmtMonth(mkAnt).split('/')[0]}.`
        : '');

  return `
  <div class="analise">
    <div class="an-tit">${opts.titulo || (ehBarb ? '🏪 Despesas da barbearia' : '👤 Despesas do Tavares')}</div>
    <div class="an-hist">${historia}${cats.length ? ' Toque numa categoria para ver os lançamentos.' : ''}</div>
    ${cats.length ? cats.map(c => {
      const chave = `${escopo}|${c.k}`;
      const aberta = !!catAbertas[chave];
      return `
      <div class="cat-linha${aberta ? ' aberta' : ''}" onclick="toggleCat('${esc(chave).replace(/'/g, "\\'")}')">
        <div class="ba-top">
          <span class="ba-rot"><span class="cat-seta">▶</span>${esc(c.k)}
            <span style="color:var(--text-mute);font-weight:400">· ${c.itens.length}</span></span>
          <span class="ba-val valor-oculto">${money(c.v)}</span>
        </div>
        <div class="ba-track"><div class="ba-fill" style="width:${Math.max(4, pct(c.v, maior))}%;background:var(--red)"></div></div>
      </div>
      ${aberta ? `<div class="cat-itens">
        ${c.itens.slice().sort((a, b) => a.data.localeCompare(b.data)).map(f => `
          <div class="ci">
            <span class="ci-d">${fmtDate(f.data)}</span>
            <span class="ci-n">${esc(f.descricao)}${f.auto ? ' <span class="tag brass">auto</span>' : ''}</span>
            <span class="ci-v valor-oculto">${money(f.valor)}</span>
          </div>`).join('')}
      </div>` : ''}`;
    }).join('') : `<div class="empty-soft">Sem despesas ${ehBarb ? 'da barbearia' : 'pessoais'} neste mês.</div>`}
  </div>`;
}

/* ── Quanto ele acha que vai faturar × quanto já faturou ──
   Mês corrente compara com o ritmo; mês passado vira placar do que deu. */
function flagProjecao(m) {
  const mk = m.mk;
  const alvo = projecaoDoMes(mk);
  const hoje = new Date();
  const ehMesAtual = mk === curMonthKey();
  const diasNoMes = new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate();
  const diaAtual = ehMesAtual ? hoje.getDate() : diasNoMes;
  const ritmo = diaAtual > 0 ? m.receita / diaAtual : 0;
  const noRitmo = ritmo * diasNoMes;
  const falta = alvo - m.receita;
  const atingido = pct(m.receita, alvo || 1);

  /* quanto ele precisa faturar só pra não ficar no vermelho */
  const equilibrio = m.despesaBarbearia + m.despesaPessoal;
  const ticket = m.ticket || 0;

  const historia = !alvo
    ? 'Você ainda não disse quanto espera faturar neste mês.'
    : ehMesAtual
      ? m.receita >= alvo
        ? `<b style="color:var(--green)">Projeção batida!</b> Você já passou em <b class="valor-oculto">${money(m.receita - alvo)}</b>, e ainda faltam ${diasNoMes - diaAtual} dia(s).`
        : `Faltam <b class="valor-oculto">${money(falta)}</b> para a sua projeção` +
          (ticket > 0 ? `, cerca de <b>${Math.ceil(falta / ticket)} atendimentos</b>` : '') + '. ' +
          (noRitmo >= alvo
            ? `No ritmo de hoje você fecha em <b class="valor-oculto" style="color:var(--green)">${money(noRitmo)}</b> — dá.`
            : `No ritmo de hoje você fecha em <b class="valor-oculto" style="color:var(--red)">${money(noRitmo)}</b> — precisa acelerar.`)
      : m.receita >= alvo
        ? `Fechou em <b class="valor-oculto">${money(m.receita)}</b> e bateu a projeção de ${money(alvo)}.`
        : `Fechou em <b class="valor-oculto">${money(m.receita)}</b>, <b class="valor-oculto" style="color:var(--red)">${money(falta)}</b> abaixo do esperado.`;

  return `
  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span>Quanto você espera faturar</span>
      <button class="mini" onclick="openProjecaoMes('${mk}')">${alvo ? 'Mudar: ' + moneyShort(alvo) : 'Definir'}</button>
    </div>
    <div class="an-hist">${historia}</div>
    ${alvo ? `
    <div class="goal" style="margin-top:0">
      <div class="gh">
        <span class="gt">${atingido}% da projeção</span>
        <span class="gv valor-oculto">${money(m.receita)} de ${money(alvo)}</span>
      </div>
      <div class="gtrack"><div class="gfill" style="width:${Math.min(100, atingido)}%;background:${m.receita >= alvo ? 'var(--green)' : 'linear-gradient(90deg,var(--accent),var(--accent-bright))'}"></div></div>
    </div>` : ''}
    ${equilibrio > 0 ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.82rem;color:var(--text-dim);line-height:1.6">
      Para não ficar no vermelho, contando as contas da barbearia e as suas, você precisa de
      <b class="valor-oculto" style="color:var(--text)">${money(equilibrio)}</b> no mês${
        ticket > 0 ? ` — uns <b>${Math.ceil(equilibrio / ticket)} atendimentos</b>` : ''}.
      ${m.receita >= equilibrio
        ? `<b style="color:var(--green)">Já passou disso.</b>`
        : `Faltam <b class="valor-oculto" style="color:var(--red)">${money(equilibrio - m.receita)}</b>.`}
    </div>` : ''}
  </div>`;
}

/* ── Cascata: o caminho do dinheiro no mês ──
   Colunas lado a lado mostram tamanho; a cascata mostra o que entrou,
   o que cada lado consumiu e o que sobrou no fim. */
function graficoCascata(m) {
  const R = m.receita, Db = m.despesaBarbearia, Dp = m.despesaPessoal;
  const lucro = R - Db, sobra = lucro - Dp;
  const passos = [
    { lbl: 'Receitas', de: 0, ate: R, tipo: 'pos' },
    { lbl: 'Barbearia', de: R, ate: lucro, tipo: 'neg', valor: -Db },
    { lbl: 'Lucro', de: 0, ate: lucro, tipo: 'tot', total: true },
    { lbl: 'Pessoal', de: lucro, ate: sobra, tipo: 'neg', valor: -Dp },
    { lbl: 'Sobra', de: 0, ate: sobra, tipo: sobra < 0 ? 'neg' : 'pos', total: true }
  ];
  const todos = passos.flatMap(p => [p.de, p.ate]).concat(0);
  const topo = Math.max(...todos), fundo = Math.min(...todos);
  const escala = (topo - fundo) || 1;
  const posY = v => ((v - fundo) / escala) * 100;    // % a partir da base

  const historia = R === 0
    ? 'Sem receita lançada neste mês ainda.'
    : sobra >= 0
      ? `De <b class="valor-oculto">${money(R)}</b> que entraram, a barbearia consumiu ${pct(Db, R)}% e as contas do Tavares ${pct(Dp, R)}%. Sobraram <b class="valor-oculto" style="color:var(--green)">${money(sobra)}</b>.`
      : `De <b class="valor-oculto">${money(R)}</b> que entraram, sobrou <b class="valor-oculto" style="color:var(--green)">${money(lucro)}</b> depois da barbearia — mas as contas do Tavares (<b class="valor-oculto">${money(Dp)}</b>) passaram disso, deixando <b class="valor-oculto" style="color:var(--red)">${money(sobra)}</b>.`;

  return `
  <div class="analise">
    <div class="an-tit">O caminho do dinheiro</div>
    <div class="an-hist">${historia}</div>
    <div class="cascata">
      ${passos.map(p => {
        const alto = Math.abs(posY(p.ate) - posY(p.de));
        const base = Math.min(posY(p.de), posY(p.ate));
        const mostra = p.total ? p.ate : (p.valor !== undefined ? p.valor : p.ate);
        return `<div class="cs-col">
          <div class="cs-area">
            <div class="cs-zero" style="bottom:${posY(0)}%"></div>
            <div class="cs-bar ${p.tipo}" style="bottom:${base}%;height:${Math.max(1.5, alto)}%"></div>
          </div>
          <div class="cs-val valor-oculto" style="color:var(--${p.tipo === 'neg' ? 'red' : p.tipo === 'pos' ? 'green' : 'text'})">${moneyShort(mostra)}</div>
          <div class="cs-lbl">${p.total ? '= ' : ''}${p.lbl}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function finMov() {
  const m = metrics(finMes);
  /* filtro da lista: ver tudo, só a barbearia ou só o que é dele */
  const list = db.financeiro
    .filter(f => monthKey(f.data) === m.mk)
    .filter(f => finFiltro === 'tudo' ? true
      : finFiltro === 'pessoal' ? (f.tipo === 'despesa' && ehPessoal(f))
      : !(f.tipo === 'despesa' && ehPessoal(f)))
    .sort((a, b) => b.data.localeCompare(a.data));
  const porForma = {};
  db.financeiro.filter(f => monthKey(f.data) === m.mk && f.tipo === 'receita').forEach(f => {
    const k = f.formaPag || 'outros'; porForma[k] = (porForma[k] || 0) + f.valor;
  });
  const maxF = Math.max(1, ...Object.values(porForma));
  /* quanto a maquineta comeu no mês e quanto entrou por cartão */
  const taxasDoMes = somaBy(db.financeiro.filter(f => f.categoria === 'Taxa de cartão' && monthKey(f.data) === m.mk), f => f.valor);
  const recebidoCartao = (porForma.credito || 0) + (porForma.debito || 0) + (porForma.cartao || 0);
  return `
  <div class="stat-grid">
    ${stat(ICO.money, 'Receitas do mês', money(m.receita), fmtMonth(m.mk), 'valor', 'pos')}
    ${stat(ICO.box, 'Despesas da barbearia', money(m.despesaBarbearia), 'sem as contas pessoais', 'valor', 'neg')}
    ${stat(ICO.ticket, 'Resultado da barbearia', money(m.lucro), 'receitas − despesas do negócio', 'valor', m.lucro < 0 ? 'neg' : 'pos')}
    ${m.despesaPessoal > 0
      ? stat(ICO.hand, 'Sobra pro Tavares', money(m.sobraFinal), `depois de ${moneyShort(m.despesaPessoal)} de contas pessoais`, 'valor', m.sobraFinal < 0 ? 'neg' : 'pos')
      : (equipeSimples()
        ? stat(ICO.hand, 'Atendimentos', String(m.conclMes.length), 'concluídos no mês', '')
        : stat(ICO.hand, 'Comissões', money(m.comissoes), 'sobre concluídos', 'valor', 'neg'))}
  </div>
  ${flagProjecao(m)}

  <div class="p-row2">
    <div class="analise">
      <div class="an-tit">Como o cliente pagou</div>
      <div class="an-hist">${Object.keys(porForma).length
        ? `${(() => { const top = Object.entries(porForma).sort((a, b) => b[1] - a[1])[0];
             return `<b>${PAG_LABEL[top[0]] || top[0]}</b> é a forma mais usada, com ${pct(top[1], m.receita)}% do que entrou.`; })()}`
        : 'Sem receitas no mês.'}</div>
      ${Object.keys(porForma).length ? Object.entries(porForma).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
        <div class="barra">
          <div class="ba-top"><span class="ba-rot">${PAG_LABEL[k] || k}</span>
            <span class="ba-val valor-oculto">${money(v)}</span></div>
          <div class="ba-track"><div class="ba-fill" style="width:${Math.max(4, pct(v, maxF))}%;background:var(--green)"></div></div>
        </div>`).join('') : `<div class="empty-soft">Sem receitas no mês.</div>`}
      ${taxasDoMes > 0 ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:.78rem;color:var(--text-dim);line-height:1.5">
        A maquineta ficou com <b class="valor-oculto" style="color:var(--red)">${money(taxasDoMes)}</b>.
        Do cartão, sobrou <b class="valor-oculto" style="color:var(--green)">${money(recebidoCartao - taxasDoMes)}</b> líquido.
      </div>` : ''}

    ${graficoCascata(m)}

  <div class="p-row2">
    ${blocoDespesas(m.mk, 'barbearia')}
    ${blocoDespesas(m.mk, 'pessoal')}
  </div>

  ${custosPendentes(m.mk).length ? `<div class="p-block" style="margin-top:16px;border-color:var(--accent)">
    <span class="pb-label">Custos fixos de ${fmtMonth(m.mk)}</span>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px;font-size:.84rem;color:var(--text-dim)">
        ${custosPendentes(m.mk).length} conta(s) fixa(s) somando
        <b style="color:var(--text)">${money(somaBy(custosPendentes(m.mk), c => c.valor))}</b> ainda não lançadas.
      </div>
      <button class="btn" onclick="lancarCustosDoMes()">Lançar no mês</button>
    </div>
  </div>` : ''}
  <div class="tbl-wrap" style="margin-top:16px">
    <div class="tbl-header">
      <div class="tbl-title">Lançamentos de ${fmtMonth(m.mk)}</div>
      <button class="btn" onclick="openFinForm()">+ Novo lançamento</button>
    </div>
    <div class="dataview-bar" style="margin-bottom:12px">
      <span class="periodo-seg">
        <button class="${finFiltro === 'tudo' ? 'active' : ''}" onclick="setFinFiltro('tudo')">Tudo</button>
        <button class="${finFiltro === 'barbearia' ? 'active' : ''}" onclick="setFinFiltro('barbearia')">Barbearia</button>
        <button class="${finFiltro === 'pessoal' ? 'active' : ''}" onclick="setFinFiltro('pessoal')">Pessoal</button>
      </span>
      ${finFiltro !== 'tudo' ? `<span style="font-size:.78rem;color:var(--text-dim)">
        ${list.length} lançamento(s) · <b class="valor-oculto">${money(somaBy(list, f => f.valor))}</b></span>` : ''}
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma</th><th>Valor</th><th></th></tr></thead>
      <tbody>${list.length ? list.map(f => `
        <tr onclick="${f.auto ? `toast('Lançamento gerado automaticamente pelo atendimento concluído.','🔒')` : `openFinForm('${f.id}')`}">
          <td>${fmtDate(f.data)}</td>
          <td><b>${esc(f.descricao)}</b> ${f.auto ? '<span class="tag brass">auto</span>' : ''}${
            f.tipo === 'despesa' && ehPessoal(f) ? ' <span class="tag neutro">pessoal</span>' : ''}</td>
          <td>${esc(f.categoria || '—')}</td>
          <td>${PAG_LABEL[f.formaPag] || '—'}</td>
          <td style="color:${f.tipo === 'receita' ? 'var(--green-bright)' : 'var(--red-bright)'};font-weight:700">
            ${f.tipo === 'receita' ? '+' : '−'} ${money(f.valor)}</td>
          <td style="text-align:right">${f.auto ? '' : `<button class="mini no" onclick="event.stopPropagation();delFin('${f.id}')">excluir</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="6"><div class="empty-soft">Nenhum lançamento neste mês.</div></td></tr>`}
      </tbody>
    </table></div>

}

/* ── Contas do mês: o custo fixo cadastrado cruzado com o que já foi
   lançado, pra ele dar baixa e corrigir valor variável (energia, água) ── */
function contasDoMes(mk, escopo) {
  const lancados = db.financeiro.filter(f => f.custoFixoId && monthKey(f.data) === mk);
  return (db.custosFixos || [])
    .filter(c => c.ativo && (c.escopo === 'pessoal') === (escopo === 'pessoal'))
    .map(c => ({ custo: c, lanc: lancados.find(f => f.custoFixoId === c.id) || null }))
    .sort((a, b) => (a.custo.diaVenc - b.custo.diaVenc) || a.custo.nome.localeCompare(b.custo.nome));
}
function marcarPago(idLanc, pago) {
  const f = db.financeiro.find(x => x.id === idLanc);
  if (!f) return;
  f.pago = pago;
  saveDB(); render();
  toast(pago ? `<b>${esc(f.descricao)}</b> marcada como paga.` : `<b>${esc(f.descricao)}</b> voltou para "a pagar".`, pago ? '✅' : '↩️');
}
/* lança a conta de um mês só, já pedindo o valor — serve pra energia/água,
   que variam todo mês e a projeção do cadastro é só um chute */
function openContaDoMes(custoId, mk) {
  const c = (db.custosFixos || []).find(x => x.id === custoId);
  if (!c) return;
  const lanc = db.financeiro.find(f => f.custoFixoId === custoId && monthKey(f.data) === mk);
  const ultimoDia = new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate();
  const dia = Math.min(Number(c.diaVenc) || 5, ultimoDia);
  const body = `
    <div style="font-size:.86rem;color:var(--text-dim);line-height:1.6;margin-bottom:16px">
      <b style="color:var(--text)">${esc(c.nome)}</b> · vence dia ${c.diaVenc} de ${fmtMonth(mk)}.
      ${lanc ? '' : 'Esta conta ainda não foi lançada neste mês.'}
    </div>
    <div class="form-grid">
      <div><label>Valor real (R$)</label><input type="number" id="fCMValor" step="0.01" min="0" value="${lanc ? lanc.valor : c.valor}"></div>
      <div><label>Vence dia</label><input type="date" id="fCMData" value="${lanc ? lanc.data : `${mk}-${pad2(dia)}`}"></div>
      <div class="full"><label>Situação</label>
        <select id="fCMPago">
          <option value="0"${lanc && lanc.pago ? '' : ' selected'}>A pagar</option>
          <option value="1"${lanc && lanc.pago ? ' selected' : ''}>Já paguei</option>
        </select>
      </div>
    </div>
    <div style="font-size:.76rem;color:var(--text-mute);margin-top:12px;line-height:1.5">
      O cadastro da conta continua com <b>${money(c.valor)}</b>. Mudar aqui vale só para ${fmtMonth(mk)} —
      é o que serve pra energia e água, que mudam todo mês.
    </div>`;
  const acoes = [{ label: lanc ? 'Salvar' : 'Lançar', fn: () => {
    const v = Number(val('fCMValor'));
    if (!(v >= 0)) { toast('Informe um valor válido.', '⚠️'); return; }
    const pago = val('fCMPago') === '1';
    if (lanc) { lanc.valor = v; lanc.data = val('fCMData') || lanc.data; lanc.pago = pago; }
    else db.financeiro.push({
      id: uid(), data: val('fCMData') || `${mk}-${pad2(dia)}`, tipo: 'despesa',
      categoria: c.categoria || 'Geral', descricao: c.nome, valor: v, formaPag: null,
      auto: false, custoFixoId: c.id, escopo: c.escopo === 'pessoal' ? 'pessoal' : 'barbearia', pago
    });
    saveDB(); closeCModal(); render();
    toast(`<b>${esc(c.nome)}</b> de ${fmtMonth(mk)}: ${money(v)}${pago ? ' · paga' : ' · a pagar'}.`, '🧾');
  } }];
  if (lanc) acoes.push({ label: 'Desfazer lançamento', cls: 'btn-danger', fn: () => {
    db.financeiro = db.financeiro.filter(f => f.id !== lanc.id);
    saveDB(); closeCModal(); render();
    toast('Lançamento desfeito.', '🗑️');
  } });
  acoes.push({ label: 'Cancelar', cls: 'btn-ghost', fn: closeCModal });
  openCModal('Conta do mês', body, acoes);
}
function tabelaContas(mk, escopo) {
  const linhas = contasDoMes(mk, escopo);
  if (!linhas.length) return '';
  const hoje = todayISO();
  const pago = somaBy(linhas.filter(l => l.lanc && l.lanc.pago), l => l.lanc.valor);
  const aPagar = somaBy(linhas.filter(l => l.lanc && !l.lanc.pago), l => l.lanc.valor);
  const naoLancado = somaBy(linhas.filter(l => !l.lanc), l => l.custo.valor);
  const vencidas = linhas.filter(l => l.lanc && !l.lanc.pago && l.lanc.data < hoje);

  return `
  <div class="tbl-wrap" style="margin-top:16px">
    <div class="tbl-header">
      <div><div class="tbl-title">Contas de ${fmtMonth(mk)}</div>
        <div style="font-size:.76rem;color:var(--text-dim);margin-top:4px">
          Toque na conta para corrigir o valor — energia e água mudam todo mês.
        </div></div>
    </div>
    <div style="font-size:.84rem;color:var(--text-dim);line-height:1.6;margin-bottom:12px">
      ${vencidas.length
        ? `<b style="color:var(--red)">${vencidas.length} conta(s) vencida(s)</b> sem baixa. `
        : ''}Já pagou <b class="valor-oculto" style="color:var(--green)">${money(pago)}</b>${
        aPagar > 0 ? ` · faltam <b class="valor-oculto" style="color:var(--red)">${money(aPagar)}</b>` : ''}${
        naoLancado > 0 ? ` · <b class="valor-oculto">${money(naoLancado)}</b> ainda nem lançados` : ''}.
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Conta</th><th>Valor</th><th>Vence</th><th>Situação</th><th></th></tr></thead>
      <tbody>
        ${linhas.map(l => {
          const v = l.lanc ? l.lanc.valor : l.custo.valor;
          const data = l.lanc ? l.lanc.data : `${mk}-${pad2(Math.min(l.custo.diaVenc, new Date(Number(mk.slice(0,4)), Number(mk.slice(5,7)), 0).getDate()))}`;
          const vencida = l.lanc && !l.lanc.pago && data < hoje;
          const variou = l.lanc && Number(l.lanc.valor) !== Number(l.custo.valor);
          return `<tr onclick="openContaDoMes('${l.custo.id}','${mk}')">
            <td><b>${esc(l.custo.nome)}</b>${variou ? ` <span class="tag neutro" title="cadastro: ${money(l.custo.valor)}">ajustado</span>` : ''}</td>
            <td class="valor-oculto">${money(v)}</td>
            <td${vencida ? ' style="color:var(--red);font-weight:700"' : ''}>${fmtDate(data)}</td>
            <td>${!l.lanc ? '<span class="tag neutro">não lançada</span>'
              : l.lanc.pago ? '<span class="tag pos">paga</span>'
              : vencida ? '<span class="tag neg">vencida</span>' : '<span class="tag brass">a pagar</span>'}</td>
            <td style="text-align:right" onclick="event.stopPropagation()">
              ${!l.lanc
                ? `<button class="mini" onclick="openContaDoMes('${l.custo.id}','${mk}')">Lançar</button>`
                : l.lanc.pago
                  ? `<button class="mini" onclick="marcarPago('${l.lanc.id}',false)">Desfazer</button>`
                  : `<button class="mini ok" onclick="marcarPago('${l.lanc.id}',true)">Marcar paga</button>`}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

/* ── Aba dedicada a um lado só: barbearia ou pessoal ──
   Aqui cabe o que não cabe na visão geral: evolução mês a mês,
   peso de cada categoria e a lista completa daquele lado. */
function finAnaliseEscopo(escopo) {
  const mk = finMes;
  const ehBarb = escopo === 'barbearia';
  const m = metrics(mk);
  const lista = despesasDoMes(mk, escopo);
  const total = somaBy(lista, f => f.valor);
  const cats = porCategoria(lista);
  const fixos = (db.custosFixos || []).filter(c => c.ativo && (c.escopo === 'pessoal') === !ehBarb);
  const totalFixos = somaBy(fixos, c => c.valor);
  const variaveis = Math.max(0, total - somaBy(lista.filter(f => f.custoFixoId), f => f.valor));

  /* últimos 6 meses pra ver tendência */
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const [y, mo] = mk.split('-').map(Number);
    const d = new Date(y, mo - 1 - i, 1);
    const k = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    meses.push({ k, v: somaBy(despesasDoMes(k, escopo), f => f.valor) });
  }
  const maxMes = Math.max(1, ...meses.map(x => x.v));
  const comValor = meses.filter(x => x.v > 0);
  const media = comValor.length ? somaBy(comValor, x => x.v) / comValor.length : 0;

  const historia = !total
    ? `Nada lançado em ${fmtMonth(mk)}.`
    : ehBarb
      ? `A barbearia gastou <b class="valor-oculto">${money(total)}</b> em ${fmtMonth(mk)}, sendo <b class="valor-oculto">${money(totalFixos)}</b> de contas fixas. ` +
        (m.receita > 0 ? `Isso é <b>${pct(total, m.receita)}%</b> de tudo que ela faturou.` : '')
      : `O Tavares gastou <b class="valor-oculto">${money(total)}</b> em ${fmtMonth(mk)}. ` +
        (m.lucro > 0
          ? total > m.lucro
            ? `A barbearia gerou <b class="valor-oculto">${money(m.lucro)}</b> de lucro — <b style="color:var(--red)">faltaram ${money(total - m.lucro)}</b> para cobrir.`
            : `A barbearia gerou <b class="valor-oculto">${money(m.lucro)}</b>, então coube com <b class="valor-oculto" style="color:var(--green)">${money(m.lucro - total)}</b> de folga.`
          : 'A barbearia não gerou lucro neste mês para cobrir.');

  return `
  <div class="analise" style="margin-bottom:16px">
    <div class="an-tit">${ehBarb ? '🏪 Contas da barbearia' : '👤 Contas do Tavares'}</div>
    <div class="an-hist">${historia}</div>
    <div class="stat-grid">
      ${stat(ICO.box, 'Total do mês', money(total), `${lista.length} lançamento(s)`, 'valor', 'neg')}
      ${stat(ICO.clock, 'Contas fixas', money(totalFixos), `${fixos.length} conta(s) cadastrada(s)`, 'valor', 'neg')}
      ${stat(ICO.money, 'Variável', money(variaveis), 'fora as contas fixas', 'valor', 'neg')}
      ${ehBarb
        ? stat(ICO.ticket, 'Peso no faturamento', m.receita > 0 ? `${pct(total, m.receita)}%` : '—', 'do que a barbearia fatura', '', total > m.receita * 0.7 ? 'neg' : '')
        : stat(ICO.hand, 'Coberto pelo lucro', m.lucro > 0 ? `${Math.min(999, pct(total, m.lucro))}%` : '—', 'do lucro da barbearia', '', total > m.lucro ? 'neg' : 'pos')}
    </div>
  </div>

  <div class="p-row2">
    ${blocoDespesas(mk, escopo, { titulo: 'Por categoria' })}
    <div class="analise">
      <div class="an-tit">Últimos 6 meses</div>
      <div class="an-hist">${comValor.length > 1
        ? `Média de <b class="valor-oculto">${money(media)}</b> por mês. ` +
          (total > media * 1.1 ? `Este mês está <b style="color:var(--red)">acima da média</b>.`
           : total < media * 0.9 && total > 0 ? `Este mês está <b style="color:var(--green)">abaixo da média</b>.`
           : 'Este mês está na média.')
        : 'Ainda não há meses suficientes para comparar.'}</div>
      ${meses.map(x => `
        <div class="barra ${x.k === mk ? 'destaque' : ''}${x.v ? '' : ' vazio'}" style="cursor:pointer" onclick="setFinMes('${x.k}')">
          <div class="ba-top">
            <span class="ba-rot" style="text-transform:capitalize">${MES_LONGO[Number(x.k.slice(5)) - 1]}${x.k === mk ? ' · aberto' : ''}</span>
            <span class="ba-val valor-oculto">${x.v ? money(x.v) : '—'}</span>
          </div>
          <div class="ba-track"><div class="ba-fill" style="width:${x.v ? Math.max(4, pct(x.v, maxMes)) : 2}%;background:var(--red)"></div></div>
        </div>`).join('')}
    </div>
  </div>

  ${tabelaContas(mk, escopo)}

  <div class="tbl-wrap" style="margin-top:16px">
    <div class="tbl-header">
      <div class="tbl-title">Todos os lançamentos de ${fmtMonth(mk)}</div>
      <button class="btn" onclick="openFinForm()">+ Novo lançamento</button>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr></thead>
      <tbody>${lista.length ? lista.slice().sort((a, b) => b.data.localeCompare(a.data)).map(f => `
        <tr onclick="${f.auto ? `toast('Lançamento gerado automaticamente pelo atendimento.','🔒')` : `openFinForm('${f.id}')`}">
          <td>${fmtDate(f.data)}</td>
          <td><b>${esc(f.descricao)}</b>${f.auto ? ' <span class="tag brass">auto</span>' : ''}${
            f.custoFixoId && !f.pago ? ' <span class="tag neg">a pagar</span>' : ''}</td>
          <td>${esc(f.categoria || '—')}</td>
          <td class="valor-oculto" style="color:var(--red);font-weight:700">− ${money(f.valor)}</td>
          <td style="text-align:right">${f.auto ? '' : `<button class="mini no" onclick="event.stopPropagation();delFin('${f.id}')">excluir</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="5"><div class="empty-soft">Nenhuma despesa ${ehBarb ? 'da barbearia' : 'pessoal'} em ${fmtMonth(mk)}.</div></td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

function finComissoes() {
  const mk = finMes;
  const dados = comissoesPorProf(mk).filter(d => d.atend > 0 || d.p.ativo);
  const total = somaBy(dados, d => d.comissao);
  return `
  <div class="stat-grid stat-2">
    ${stat(ICO.hand, 'Total a pagar', money(total), fmtMonth(mk), 'valor', 'neg')}
    ${stat(ICO.clock, 'Atendimentos concluídos', String(somaBy(dados, d => d.atend)), 'no mês', '')}
  </div>
  <div class="tbl-wrap" style="margin-top:16px">
    <div class="tbl-header"><div class="tbl-title">Fechamento de comissões — ${fmtMonth(mk)}</div></div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Profissional</th><th>%</th><th>Atendimentos</th><th>Faturamento gerado</th><th>Comissão</th></tr></thead>
      <tbody>${dados.map(d => `
        <tr onclick="openProfForm('${d.p.id}')">
          <td><div style="display:flex;align-items:center;gap:10px">
            <span class="avatar" style="background:${d.p.cor}22;color:${d.p.cor};border-color:${d.p.cor}66">${esc(initials(d.p.nome))}</span>
            <b>${esc(d.p.apelido || d.p.nome)}</b></div></td>
          <td>${d.p.comissao || 0}%</td><td>${d.atend}</td><td>${money(d.fat)}</td>
          <td style="font-weight:700;color:var(--accent-bright)">${money(d.comissao)}</td>
        </tr>`).join('')}
        <tr style="cursor:default"><td colspan="4" style="text-align:right;color:var(--text-dim)"><b>Total</b></td>
          <td style="font-weight:800;color:var(--accent-bright)">${money(total)}</td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="p-block" style="margin-top:16px">
    <span class="pb-label">Como é calculado</span>
    <div style="font-size:.82rem;color:var(--text-dim);line-height:1.6">
      A comissão é o percentual do profissional aplicado sobre o preço dos serviços <b style="color:var(--text)">concluídos</b> no mês.
      O cálculo é feito na hora (não fica gravado) — se você mudar o percentual, o histórico do mês é recalculado.
    </div>
  </div>`;
}

function finProj() {
  const mk = curMonthKey(), m = metrics(mk);
  const hoje = new Date();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const diaAtual = hoje.getDate();
  const agendado = somaBy(
    db.agendamentos.filter(a => monthKey(a.data) === mk && a.data >= todayISO() && (a.status === 'agendado' || a.status === 'confirmado')),
    a => valorDe(a));
  const confirmado = somaBy(
    db.agendamentos.filter(a => monthKey(a.data) === mk && a.data >= todayISO() && a.status === 'confirmado'),
    a => valorDe(a));
  const ritmo = diaAtual > 0 ? m.receita / diaAtual : 0;
  const projRitmo = ritmo * diasNoMes;
  const projCarteira = m.receita + agendado;
  const comissaoProj = m.receita > 0 ? projRitmo * (m.comissoes / m.receita) : 0;
  const lucroProj = projRitmo - m.despesa - comissaoProj;
  const bar = (label, v, base) => `
    <div class="st-row">
      <div class="st-name">${label}</div>
      <div class="st-track"><div class="st-fill" style="width:${Math.min(100, pct(v, base))}%"></div></div>
      <div class="st-val" style="min-width:90px">${money(v)}</div>
    </div>`;
  const base = Math.max(m.meta, projRitmo, projCarteira, m.receita, 1);
  return `
  <div class="stat-grid">
    ${stat(ICO.money, 'Realizado', money(m.receita), `até dia ${diaAtual}`, 'valor', 'pos')}
    ${stat(ICO.clock, 'Agenda confirmada', money(confirmado), 'ainda por atender', 'valor')}
    ${stat(ICO.ticket, 'Projeção do mês', money(projRitmo), `ritmo de ${moneyShort(ritmo)}/dia`, 'valor')}
    ${stat(ICO.hand, 'Lucro projetado', money(lucroProj), 'já descontando custos', 'valor', lucroProj < 0 ? 'neg' : 'pos')}
  </div>
  <div class="p-block" style="margin-top:18px">
    <span class="pb-label">Realizado × Agenda × Meta — ${fmtMonth(mk)}</span>
    ${bar('Realizado', m.receita, base)}
    ${bar('Realizado + agenda', projCarteira, base)}
    ${bar('Projeção por ritmo', projRitmo, base)}
