<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dom Tavares — Gestão da barbearia</title>
<!-- ícone da logo ao "adicionar à tela de início", em vez de um print da página -->
<link rel="icon" href="logodomtavares.jpg">
<link rel="apple-touch-icon" href="logodomtavares.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14293f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dom Tavares">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* Tema escuro (opcional — o padrão do app é o claro, em body.light) */
  :root {
    --bg: #14171b;
    --surface: #1b1f24;
    --surface-2: #21262c;
    --surface-3: #2a3037;
    --border: #2e353d;
    --border-light: #3d4650;
    --text: #e6eaef;
    --text-dim: #97a1ad;
    --text-mute: #6b7684;
    /* no escuro o azul quase preto sumiria: usa o mesmo tom clareado só o bastante */
    --accent: #9db4cc;
    --accent-bright: #b8c9dc;
    --accent-soft: rgba(157,180,204,.14);
    --on-accent: #0e1822;
    /* status: agendado(cinza claro)/confirmado(azul)/concluído(verde)/cancelado(cinza)/faltou(vermelho) */
    --st-pend: #7a8593;           --st-pend-soft: rgba(122,133,147,.20);
    --st-wait: #9aa5b3;           --st-wait-soft: rgba(154,165,179,.18);
    --st-late: #d15b53;           --st-late-soft: rgba(209,91,83,.18);
    --st-done: #58a878;           --st-done-soft: rgba(88,168,120,.20);
    --green: #58a878;   --green-soft: rgba(88,168,120,.18);   --green-bright: #6fbf8e;
    --red: #d15b53;     --red-soft: rgba(209,91,83,.16);      --red-bright: #e2756d;
    --blue: #68a6e6;    --blue-soft: rgba(104,166,230,.18);
    --yellow: #d9a63c;  --yellow-soft: rgba(217,166,60,.16);
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-cond: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 10px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.28);
    --shadow-md: 0 6px 24px rgba(0,0,0,.38);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
    font-size: 15px;
  }
  /* Tema claro — padrão do app */
  body.light {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --surface-3: #e8ebef;
    --border: #dfe3e8;
    --border-light: #cbd2da;
    --text: #14181d;
    --text-dim: #58636f;
    --text-mute: #6b7684;   /* claro lava os cinzas: mute mais escuro que no dark p/ manter leitura */
    --accent: #14293f;            /* azul quase preto: sóbrio, deixa verde e vermelho falarem */
    --accent-bright: #0c1a29;
    --accent-soft: rgba(20,41,63,.08);
    --on-accent: #ffffff;
    --st-pend: #7a8593;           --st-pend-soft: rgba(122,133,147,.14);
    /* tons de texto das pills: escurecidos até passarem 4.5:1 sobre o próprio fundo tingido */
    --st-wait: #5a6472;           --st-wait-soft: rgba(107,118,132,.13);
    --st-late: #b5342b;           --st-late-soft: rgba(192,57,47,.11);
    --st-done: #2a6f48;           --st-done-soft: rgba(47,125,81,.12);
    --green: #2a6f48;   --green-soft: rgba(47,125,81,.11);    --green-bright: #2a6f48;
    --red: #b5342b;     --red-soft: rgba(192,57,47,.11);      --red-bright: #b5342b;
    --blue: #2a6199;    --blue-soft: rgba(47,111,176,.12);
    --yellow: #a9761a;  --yellow-soft: rgba(169,118,26,.12);
    --shadow-sm: 0 1px 3px rgba(16,24,40,.06);
    --shadow-md: 0 4px 16px rgba(16,24,40,.09);
    --shadow-lg: 0 12px 36px rgba(16,24,40,.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    min-height: 100vh; transition: background .25s, color .25s;
    -webkit-font-smoothing: antialiased;
  }
  /* textura cinematográfica (só no dark) */
  body:not(.light)::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.013) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.013) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  body:not(.light)::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 95% 65% at 50% 0%, transparent 52%, rgba(0,0,0,.55) 100%);
  }
  h1, h2, h3, .dw-title, .cal-title, .tbl-title, .m-title { font-family: var(--font-display); }
  button, input, select, textarea { font-family: inherit; }

  /* ════════ Janela / sidebar / chrome ════════ */
  .appwin {
    position: relative; z-index: 1; margin: 20px auto;
    display: flex; align-items: stretch;
    width: calc(100% - 40px); max-width: 1380px; height: calc(100vh - 40px);
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--surface); box-shadow: var(--shadow-lg); overflow: hidden;
  }
  body:not(.light) .appwin { background: rgba(255,255,255,.022); }
  @media (max-width: 760px) { .appwin { width: 100%; height: 100vh; margin: 0; border: none; border-radius: 0; } }
  .bottom-nav { display: none; }

  .app-sidebar {
    width: 216px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--surface-2); border-right: 1px solid var(--border);
    transition: width .22s ease; overflow: hidden; position: relative;
  }
  body:not(.light) .app-sidebar { background: rgba(255,255,255,.03); }
  .appwin.sidebar-collapsed .app-sidebar { width: 72px; }
  .sb-top { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 12px 16px; border-bottom: 1px solid var(--border); }
  .sb-burger {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; align-self: flex-end;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .sb-burger:hover { color: var(--accent); border-color: var(--accent); }
  .appwin.sidebar-collapsed .sb-burger { align-self: center; }
  /* a logo já é redonda sobre fundo preto: recorte circular fecha certinho */
  .sb-logo {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: -.5px;
    box-shadow: var(--shadow-sm);
  }
  .sb-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sb-brand { text-align: center; line-height: 1.2; }
  .sb-brand .b1 { font-family: var(--font-display); font-size: .92rem; font-weight: 700; }
  .sb-brand .b2 { font-size: .58rem; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1.6px; margin-top: 2px; }
  .appwin.sidebar-collapsed .sb-brand { display: none; }

  .sb-nav { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 16px 12px; overflow-y: auto; }
  .tab-btn {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; gap: 11px; transition: all .15s;
    justify-content: flex-start; width: 100%; padding: 13px 14px; border-radius: 11px;
    white-space: nowrap; font-size: .82rem; font-weight: 600; font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface-3); }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent-bright); }
  .tab-btn svg { flex-shrink: 0; width: 17px; height: 17px; }
  .appwin.sidebar-collapsed .tab-btn { justify-content: center; padding: 14px; }
  .appwin.sidebar-collapsed .tab-btn .sb-label, .appwin.sidebar-collapsed .tab-btn .sb-count { display: none; }
  .sb-count { margin-left: auto; background: var(--accent); color: var(--on-accent); font-size: .66rem; font-weight: 800;
    padding: 1px 7px; border-radius: 99px; line-height: 1.5; }
  .sb-count:empty { display: none; }
  .sb-bottom { padding: 12px 10px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .sb-bottom .btn-icon { width: 100%; border-radius: 10px; }
  .appwin.sidebar-collapsed .sb-bottom .btn-icon { width: 40px; margin: 0 auto; }

  .app-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  header.chrome {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; padding: 13px 20px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); background: transparent; z-index: 5;
  }
  header.chrome::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-bright) 16%, transparent 62%);
  }
  .chrome-title h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
  .chrome-title span { display: block; font-size: .64rem; color: var(--text-mute); font-weight: 500;
    text-transform: uppercase; letter-spacing: 1.3px; margin-top: 3px; font-family: var(--font-cond); }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn {
    background: var(--accent); color: var(--on-accent); border: none; cursor: pointer;
    padding: 10px 18px; border-radius: var(--radius); font-weight: 700; font-size: .88rem;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-weight: 600; }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); filter: none; }
  .btn-danger { background: transparent; border: 1px solid rgba(179,64,58,.45); color: var(--red-bright); font-weight: 600; }
  .btn-danger:hover { background: var(--red-soft); filter: none; }
  .btn-ok { background: var(--st-done); color: #fff; }
  .btn-icon {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    width: 40px; height: 40px; border-radius: var(--radius); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; transition: all .15s;
  }
  .btn-icon:hover { color: var(--accent); border-color: var(--accent); }
  .mini {
    background: none; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
    font-size: .7rem; font-weight: 700; padding: 5px 11px; border-radius: 7px; transition: all .15s;
  }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .mini.ok:hover { color: var(--st-done); border-color: var(--st-done); }
  .mini.no:hover { color: var(--st-late); border-color: var(--st-late); }

  .sync-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 99px; padding: 8px 14px; font-size: .72rem; color: var(--text-dim);
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .sync-chip:hover { border-color: var(--accent); color: var(--text); }
  .sync-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; box-shadow: 0 0 6px rgba(124,144,99,.6); }
  .sync-chip.saving .dot { background: var(--accent); animation: pulse 1s infinite; }
  .sync-chip.erro { border-color: var(--red); color: var(--red); }
  .sync-chip.erro .dot { background: var(--red); box-shadow: none; }
  /* sem conexão não é "tudo certo": bolinha apagada, não verde */
  .sync-chip.offline .dot { background: var(--text-mute); box-shadow: none; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* filtros no chrome */
  .filtros-wrap { position: relative; }
  .filtros-badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: var(--on-accent);
    font-size: .6rem; min-width: 16px; height: 16px; border-radius: 99px; display: flex; align-items: center;
    justify-content: center; padding: 0 4px; font-weight: 800; }
  .filtros-panel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 70; width: 260px;
    max-width: calc(100vw - 20px); background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-md); padding: 14px; display: none; flex-direction: column; gap: 4px; }
  .filtros-panel.open { display: flex; }
  .filtros-panel label { font-size: .64rem; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); font-weight: 700; margin-top: 6px; }
  .filtros-panel select { width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: .84rem; outline: none; }

  main#main { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 26px 90px; position: relative; z-index: 1; }
  @media (max-width: 640px) { main#main { padding: 18px 14px 90px; } }

  /* ════════ Blocos de conteúdo ════════ */
  .greet h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.4px; }
  .greet .sentence { font-family: var(--font-body); font-size: .95rem; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }
  .greet .sentence b { font-weight: 700; color: var(--text); }
  .g-brass { color: var(--accent-bright); } .g-green { color: var(--green-bright); }
  .g-red { color: var(--red-bright); } .g-blue { color: var(--blue); }

  .cmd { display: flex; align-items: center; gap: 18px; margin-top: 20px; padding: 18px 22px; cursor: pointer;
    border-radius: 16px; border: 1px solid var(--border-light);
    background: linear-gradient(120deg, var(--accent-soft), transparent); transition: border-color .15s, transform .15s; }
  .cmd:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cmd .big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: var(--accent-bright); letter-spacing: -1.5px; line-height: 1; }
  .cmd .ctxt { flex: 1; } .cmd .ctxt .t { font-size: .96rem; font-weight: 700; } .cmd .ctxt .s { font-size: .76rem; color: var(--text-dim); margin-top: 3px; }
  .cmd .go { color: var(--accent); font-size: 1.4rem; }

  .section-label { font-size: .66rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-mute); font-weight: 700; margin: 24px 2px 12px; display: block; font-family: var(--font-cond); }

  .m-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .m-cards-3 { grid-template-columns: repeat(3, 1fr); }
  .m-cards-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .m-cards, .m-cards-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .m-cards, .m-cards-3, .m-cards-2 { grid-template-columns: 1fr; } }
  .m3d { position: relative; padding: 18px; border-radius: 15px;
    background: linear-gradient(158deg, rgba(255,255,255,.06), rgba(255,255,255,.018));
    border: 1px solid var(--border); border-top-color: var(--border-light);
    box-shadow: 0 16px 26px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .25s ease, box-shadow .25s ease; }
  body.light .m3d { background: var(--surface); box-shadow: var(--shadow-sm); }
  .m3d:hover { transform: perspective(900px) translateY(-4px) rotateX(5deg); box-shadow: 0 26px 40px -16px rgba(0,0,0,.7); }
  .m3d .ico { position: absolute; top: 15px; right: 15px; color: var(--accent); opacity: .8; }
  .m3d .ico svg { width: 24px; height: 24px; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m3d .num { font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
  .m3d .num.sm { font-size: 1.5rem; }
  .m3d .lbl { font-size: .74rem; color: var(--text-dim); margin-top: 7px; font-weight: 500; }
  .m3d .hint { font-size: .64rem; color: var(--text-mute); margin-top: 2px; }

  .p-block { padding: 16px 18px 18px; background: rgba(255,255,255,.022);
    border: 1px solid var(--border); border-radius: 16px; min-width: 0; }
  body.light .p-block { background: var(--surface); }
  .p-block .pb-label { font-size: .66rem; text-transform: uppercase; letter-spacing: 1.4px; font-family: var(--font-cond);
    color: var(--text-mute); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .p-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .p-row2 { grid-template-columns: 1fr; } }

  .li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--border); }
  .li:last-child { border-bottom: none; }
  .li.clickable { cursor: pointer; } .li.clickable:hover { background: var(--accent-soft); border-radius: 8px; }
  .li .lbar { width: 3px; height: 36px; border-radius: 3px; flex-shrink: 0; background: var(--accent); }
  .li .lbody { flex: 1; min-width: 0; }
  .li .lt { font-size: .85rem; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .li .lm { font-size: .7rem; color: var(--text-mute); margin-top: 2px; }
  .li .lend { font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .li .ava, .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-3); flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; font-size: .66rem; font-weight: 800;
    color: var(--accent-bright); border: 1px solid var(--border-light); }
  .li .ava svg { width: 15px; height: 15px; }
  .empty-soft { color: var(--text-mute); font-size: .82rem; padding: 16px 2px; text-align: center; }

  .st-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .st-row:last-child { margin-bottom: 0; }
  .st-name { width: 130px; font-size: .74rem; color: var(--text-dim); flex-shrink: 0; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-track { flex: 1; height: 9px; background: rgba(128,128,128,.18); border-radius: 99px; overflow: hidden; }
  .st-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s ease; }
  .st-val { min-width: 34px; font-size: .78rem; font-weight: 700; text-align: right; color: var(--text-dim); }

  .goal { margin-top: 18px; padding: 16px 20px; border-radius: 14px; border: 1px solid var(--border); background: rgba(128,128,128,.05); }
  .goal .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .goal .gh .gt { font-size: .8rem; font-weight: 700; }
  .goal .gh .gv { font-size: .78rem; color: var(--text-dim); }
  .goal .gtrack { height: 11px; background: rgba(128,128,128,.2); border-radius: 99px; overflow: hidden; }
  .goal .gfill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); transition: width .6s ease; }

  .tag { font-size: .63rem; padding: 3px 9px; border-radius: 99px; font-weight: 700; letter-spacing: .2px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .tag.st-agendado { background: var(--st-wait-soft); color: var(--st-wait); }
  .tag.st-confirmado { background: var(--blue-soft); color: var(--blue); }
  .tag.st-concluido { background: var(--st-done-soft); color: var(--st-done); }
  .tag.st-cancelado { background: var(--st-pend-soft); color: var(--st-pend); }
  .tag.st-faltou { background: var(--st-late-soft); color: var(--st-late); }
  .tag.brass { background: var(--accent-soft); color: var(--accent-bright); }
  .tag.neutro { background: var(--surface-3); color: var(--text-dim); }
  .tag.pos { background: var(--green-soft); color: var(--green-bright); }
  .tag.neg { background: var(--red-soft); color: var(--red-bright); }
  body.light .m3d:hover { box-shadow: var(--shadow-md); }

  /* segmentos / abas */
  .dataview-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .view-seg button { background: none; border: none; color: var(--text-dim); padding: 8px 16px; border-radius: 8px;
    font-size: .81rem; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
  .view-seg button:hover { color: var(--text); }
  .view-seg button.active { background: var(--accent); color: var(--on-accent); }
  .modal-tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .mtab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim);
    padding: 9px 16px; font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: -1px; }
  .mtab:hover { color: var(--text); }
  .mtab.active { color: var(--accent-bright); border-bottom-color: var(--accent); }

  /* tabelas */
  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  body:not(.light) .tbl-wrap { background: rgba(255,255,255,.022); }
  .tbl-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .tbl-title { font-size: .92rem; font-weight: 700; }
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .66rem; text-transform: uppercase; letter-spacing: .8px; font-family: var(--font-cond);
    color: var(--text-dim); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 12px; font-size: .81rem; border-bottom: 1px solid var(--border); }
  tbody tr { cursor: pointer; transition: background .15s; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  .srch { background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: var(--radius); font-size: .85rem; outline: none; min-width: 240px; }
  .srch:focus { border-color: var(--accent); }

  /* ════════ Agenda / calendário semanal ════════ */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  body:not(.light) .cal-wrap { background: rgba(255,255,255,.022); }
  .cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-nav-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .cal-nav-btn:hover { color: var(--accent); border-color: var(--accent); }
  .cal-title { font-size: .95rem; font-weight: 700; text-transform: capitalize; }
  .cal-scroll { overflow-x: auto; }
  .cal-tbl { display: grid; grid-template-columns: 58px repeat(7, minmax(112px, 1fr)); min-width: 800px; }
  .cal-dow { text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .cal-dow .d1 { font-size: .62rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-mute); font-family: var(--font-cond); font-weight: 700; }
  .cal-dow .d2 { font-size: .95rem; font-weight: 700; margin-top: 2px; }
  .cal-dow.today .d2 { color: var(--accent-bright); }
  .cal-dow.today { background: var(--accent-soft); border-radius: 8px 8px 0 0; }
  .cal-corner { border-bottom: 1px solid var(--border); }
  .cal-hour { font-size: .64rem; color: var(--text-mute); text-align: right; padding: 4px 8px 0 0;
    border-right: 1px solid var(--border); font-family: var(--font-cond); font-weight: 600; }
  .cal-slot { border-bottom: 1px dashed var(--border); border-right: 1px solid var(--border);
    min-height: 52px; padding: 3px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; transition: background .12s; }
  .cal-slot:hover { background: var(--accent-soft); }
  .cal-slot.today-col { background: var(--accent-soft); }
  .cal-appt { font-size: .63rem; font-weight: 600; padding: 4px 6px; border-radius: 5px; cursor: pointer;
    background: var(--surface-2); border-left: 3px solid var(--accent); line-height: 1.25;
    overflow: hidden; transition: filter .15s; }
  body.light .cal-appt { background: var(--surface-3); }
  .cal-appt:hover { filter: brightness(1.2); }
  .cal-appt .ca-h { color: var(--text-dim); font-size: .58rem; font-weight: 700; }
  .cal-appt .ca-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-appt.done { opacity: .55; }
  .cal-appt.cancel { opacity: .4; text-decoration: line-through; }
  .cal-legend { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .cal-legend-item { display: flex; align-items: center; gap: 7px; font-size: .72rem; color: var(--text-dim); }
  .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ── seletor de período: Hoje / Esta semana / Este mês ── */
  .periodo-seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 99px; padding: 3px; gap: 2px; }
  .periodo-seg button { background: none; border: none; color: var(--text-dim); padding: 8px 16px;
    border-radius: 99px; font-size: .8rem; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
  .periodo-seg button:hover { color: var(--text); }
  .periodo-seg button.active { background: var(--accent); color: var(--on-accent); }
  .periodo-nav { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
  .periodo-nav .pn-titulo { font-size: .92rem; font-weight: 700; text-transform: capitalize; flex: 1; min-width: 140px; }

  /* ── cartão compacto: ícone à esquerda, número à direita (cabe 2 por linha no celular) ── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat-grid.stat-3 { grid-template-columns: repeat(3, 1fr); }
  .stat-grid.stat-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .stat-grid, .stat-grid.stat-3 { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-sm);
    min-width: 0;
  }
  body:not(.light) .stat { background: rgba(255,255,255,.03); }
  .stat .st-ico { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
  .stat .st-ico svg { width: 19px; height: 19px; }
  .stat.neg .st-ico { background: var(--red-soft); color: var(--red); }
  .stat.pos .st-ico { background: var(--green-soft); color: var(--green); }
  .stat .st-txt { min-width: 0; display: flex; flex-direction: column; }
  .stat .st-lbl { font-size: .7rem; color: var(--text-dim); font-weight: 600; }
  /* valores em reais são largos; o cartão tem ~110px úteis no celular */
  .stat .st-num { font-size: 1.05rem; font-weight: 800; letter-spacing: -.5px; margin-top: 1px;
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 400px) { .stat { padding: 12px; gap: 9px; } .stat .st-num { font-size: .98rem; }
    .stat .st-ico { width: 32px; height: 32px; border-radius: 9px; } .stat .st-ico svg { width: 16px; height: 16px; } }
  .stat .st-hint { font-size: .64rem; color: var(--text-mute); margin-top: 2px; line-height: 1.3; }

  /* ── bloco de análise: título + a frase que explica o número ── */
  .analise { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px 18px; min-width: 0; }
  body:not(.light) .analise { background: rgba(255,255,255,.022); }
  .analise .an-tit { font-size: .86rem; font-weight: 700; }
  .analise .an-hist { font-size: .76rem; color: var(--text-dim); line-height: 1.5; margin: 4px 0 14px; }
  .analise .an-hist b { color: var(--text); font-weight: 700; }

  /* ── barras horizontais de comparação (por dia, por semana, por serviço) ── */
  .barra { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .barra:last-child { margin-bottom: 0; }
  .barra .ba-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: .78rem; }
  .barra .ba-rot { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra .ba-val { font-size: .72rem; color: var(--text-dim); flex-shrink: 0; }
  .barra .ba-track { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
  .barra .ba-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s ease; }
  .barra.destaque .ba-rot { color: var(--accent); }
  .barra.vazio .ba-fill { background: var(--border-light); }

  /* ── linha do tempo do dia ── */
  .tl { position: relative; padding-left: 62px; }
  .tl-item { position: relative; padding: 0 0 14px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item .tl-hora { position: absolute; left: -62px; top: 12px; width: 48px; text-align: right;
    font-size: .78rem; font-weight: 700; color: var(--text-dim); }
  .tl-item .tl-ponto { position: absolute; left: -8px; top: 17px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px var(--bg); z-index: 1; }
  .tl-item::before { content: ''; position: absolute; left: -4px; top: 17px; bottom: -4px; width: 1px; background: var(--border); }
  .tl-item:last-child::before { display: none; }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    cursor: pointer; transition: border-color .15s, transform .15s; }
  body:not(.light) .tl-card { background: rgba(255,255,255,.03); }
  .tl-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tl-card .tc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tl-card .tc-nome { font-size: .9rem; font-weight: 700; }
  .tl-card .tc-sub { font-size: .74rem; color: var(--text-dim); margin-top: 3px; }
  .tl-card .tc-acoes { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  .tl-item.feito .tl-ponto { background: var(--st-done); }
  .tl-item.feito .tl-card { opacity: .82; }
  .tl-item.perdido .tl-ponto { background: var(--st-late); }
  .tl-item.perdido .tl-card { opacity: .6; }

  /* ── valores escondíveis (abrir o app na frente do cliente) ── */
  body.ocultar-valores .valor-oculto { color: transparent !important; position: relative; user-select: none; }
  body.ocultar-valores .valor-oculto::after {
    content: '•••••'; position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    color: var(--text-mute); letter-spacing: 2px; display: flex; align-items: center;
  }
  .stat .st-num.valor-oculto::after { justify-content: flex-start; }

  /* ── cascata: mostra o caminho do dinheiro, não só o tamanho de cada parte ── */
  .cascata { display: flex; align-items: flex-end; gap: 6px; margin-top: 6px; }
  .cs-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .cs-area { position: relative; width: 100%; height: 132px; }
  .cs-zero { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border-light); }
  .cs-bar { position: absolute; left: 12%; right: 12%; border-radius: 4px; min-height: 2px; transition: height .5s ease, bottom .5s ease; }
  .cs-bar.pos { background: var(--green); }
  .cs-bar.neg { background: var(--red); }
  .cs-bar.tot { background: var(--accent); }
  .cs-lig { position: absolute; left: 12%; right: 12%; border-top: 1px dotted var(--text-mute); opacity: .5; }
  .cs-val { font-size: .62rem; font-weight: 700; text-align: center; line-height: 1.2; white-space: nowrap; }
  .cs-lbl { font-size: .58rem; color: var(--text-dim); text-align: center; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 420px) { .cs-area { height: 108px; } .cs-val { font-size: .56rem; } .cs-lbl { font-size: .53rem; } }

  /* ── categoria que abre pra mostrar os lançamentos ── */
  .cat-linha { cursor: pointer; border-radius: 8px; padding: 6px 6px 2px; margin: 0 -6px 8px; transition: background .15s; }
  .cat-linha:hover { background: var(--surface-2); }
  .cat-linha.aberta { background: var(--surface-2); }
  .cat-seta { display: inline-block; font-size: .6rem; color: var(--text-mute); transition: transform .2s; margin-right: 4px; }
  .cat-linha.aberta .cat-seta { transform: rotate(90deg); }
  .cat-itens { margin: 2px 0 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 10px;
    border-left: 3px solid var(--red); }
  .cat-itens .ci { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 5px 0; font-size: .78rem; border-bottom: 1px solid var(--border); }
  .cat-itens .ci:last-child { border-bottom: none; }
  .cat-itens .ci-d { color: var(--text-dim); font-size: .7rem; flex-shrink: 0; }
  .cat-itens .ci-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-itens .ci-v { font-weight: 700; white-space: nowrap; }

  /* ── folga e almoço ── */
  .dia-folga { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px;
    padding: 8px 13px; font-size: .8rem; font-weight: 600; color: var(--text-dim); user-select: none; }
  .dia-folga input { width: auto; margin: 0; accent-color: var(--accent); }
  .dia-folga.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  /* faixa de almoço/folga na linha do tempo do dia */
  .tl-pausa { position: relative; padding: 0 0 14px; }
  .tl-pausa .tl-hora { position: absolute; left: -62px; top: 10px; width: 48px; text-align: right;
    font-size: .74rem; font-weight: 700; color: var(--text-mute); }
  .tl-pausa .tp-faixa {
    border: 1px dashed var(--border-light); border-radius: 12px; padding: 10px 14px;
    background: repeating-linear-gradient(45deg, transparent, transparent 7px, var(--surface-2) 7px, var(--surface-2) 14px);
    font-size: .82rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .tl-pausa .tp-faixa b { color: var(--text); }
  /* dia inteiro de folga */
  .aviso-folga { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 14px;
    border: 1px dashed var(--border-light); background: var(--surface-2); margin-bottom: 16px; flex-wrap: wrap; }
  .aviso-folga .af-ico { font-size: 1.5rem; }
  .aviso-folga .af-txt { flex: 1; min-width: 160px; }
  .aviso-folga .af-t { font-weight: 700; font-size: .92rem; }
  .aviso-folga .af-s { font-size: .78rem; color: var(--text-dim); margin-top: 2px; }
  /* slot de almoço/folga na grade da semana */
  .cal-slot.pausa { background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--surface-3) 5px, var(--surface-3) 10px); }
  .cal-slot.folga-dia { background: var(--surface-3); opacity: .55; }

  /* tira de dias da view "Dia" — o padrão no celular */
  .dia-strip { display: flex; gap: 6px; margin: 14px 0 2px; overflow-x: auto; padding-bottom: 2px; }
  .dia-chip {
    flex: 1; min-width: 40px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 4px 9px; cursor: pointer; font-family: inherit; position: relative; transition: all .15s;
  }
  .dia-chip .dc-d { font-size: .58rem; text-transform: uppercase; color: var(--text-mute); font-weight: 700; letter-spacing: .3px; }
  .dia-chip .dc-n { font-size: .92rem; font-weight: 700; color: var(--text); }
  .dia-chip.today { border-color: var(--accent); }
  .dia-chip.active { background: var(--accent); border-color: var(--accent); }
  .dia-chip.active .dc-d, .dia-chip.active .dc-n { color: var(--on-accent); }
  .dia-chip .dc-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .dia-chip.active .dc-dot { background: var(--on-accent); }

  /* ════════ Overlays: drawer lateral + modal central ════════ */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(2px); z-index: 100;
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
  .overlay.open { opacity: 1; visibility: visible; }
  .overlay.drawer .panel {
    position: fixed; top: 0; right: 0; height: 100vh; height: 100dvh; width: 480px; max-width: 100%;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: -8px 0 32px rgba(0,0,0,.35); display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .3s cubic-bezier(.22,1,.36,1);
  }
  .overlay.drawer.open .panel { transform: translateX(0); }
  .overlay.center { display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; overflow-y: auto; }
  .overlay.center .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 560px; max-height: calc(100vh - 100px); display: flex; flex-direction: column;
    transform: translateY(-10px); transition: transform .25s ease; }
  .overlay.center.open .panel { transform: translateY(0); }
  .dw-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 18px 22px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .dw-title { font-size: 1.02rem; font-weight: 700; }
  .dw-x { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer;
    line-height: 1; padding: 4px 9px; border-radius: 8px; }
  .dw-x:hover { color: var(--accent); background: var(--surface-2); }
  .dw-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; }
  .dw-foot { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 22px 18px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .dw-foot .btn { flex: 1; min-width: 110px; }
  .dw-foot .spacer { flex: 1 1 100%; height: 0; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: .68rem; color: var(--text-dim); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: .6px; font-weight: 700; font-family: var(--font-cond); }
  .dw-body input, .dw-body select, .dw-body textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: var(--radius); font-size: .87rem; outline: none; font-family: inherit;
  }
  .dw-body input:focus, .dw-body select:focus, .dw-body textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  .det-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
  .det-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .det-item .k { font-size: .6rem; text-transform: uppercase; letter-spacing: .7px; color: var(--text-mute); font-family: var(--font-cond); font-weight: 700; }
  .det-item .v { font-size: .88rem; font-weight: 700; margin-top: 3px; }
  .det-sep { height: 1px; background: var(--border); margin: 18px 0; }
  .wa-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--green-soft); color: var(--green-bright);
    border: 1px solid rgba(124,144,99,.4); padding: 8px 14px; border-radius: 99px; font-size: .78rem;
    font-weight: 700; text-decoration: none; cursor: pointer; }
  .wa-btn:hover { filter: brightness(1.15); }
  /* aviso de que o app está rodando com o que estava salvo no aparelho */
  .barra-offline { display: flex; align-items: center; gap: 10px; padding: 9px 16px;
    background: var(--amber-soft, rgba(190,140,40,.14)); border-bottom: 1px solid var(--border);
    font-size: .74rem; line-height: 1.35; }
  .barra-offline .bo-ico { font-size: .95rem; flex: 0 0 auto; }
  .barra-offline .bo-txt { flex: 1 1 auto; color: var(--text-dim); min-width: 0; }
  .barra-offline .bo-txt b { color: var(--text); display: block; font-size: .78rem; }
  .barra-offline .mini { flex: 0 0 auto; padding: 6px 11px; font-size: .7rem; }
  @media (max-width: 560px) {
    .barra-offline { padding: 8px 14px; gap: 8px; }
  }
  .wa-glifo { display: inline-flex; }
  .wa-glifo svg { width: 15px; height: 15px; display: block; }
  /* botão redondo de confirmação, na agenda do dia e na lista da semana */
  .wa-ico { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--green-soft); color: var(--green-bright);
    border: 1px solid rgba(124,144,99,.4); cursor: pointer; text-decoration: none; }
  .wa-ico svg { width: 17px; height: 17px; display: block; }
  .wa-ico:hover { filter: brightness(1.12); }
  /* já perguntou hoje: fica discreto, mas continua clicável para insistir */
  .wa-ico.enviado { background: transparent; color: var(--text-mute); border-color: var(--border-light); }
  .li > .wa-ico { margin-left: 10px; }

  /* FAB + toast */
  .fab-stack { position: fixed; right: 26px; bottom: 26px; display: flex; gap: 14px; z-index: 90; transition: transform .28s ease; }
  .fab-stack.drawer-open { transform: translateX(calc(-480px - 20px)); }
  @media (max-width: 560px) { .fab-stack.drawer-open { display: none; } }

<script>
/* ══════════════════════════════════════════════════════════════
   Dom Tavares — ERP de Barbearia (single-file)
   Persistência: localStorage com fallback em memória.
   Shape de dados pensado para migrar direto para o Supabase.
   ══════════════════════════════════════════════════════════════ */

/* ─────────── Supabase (conexão) ───────────
   A anon key abaixo é pública por natureza: só funciona se o RLS deixar,
   e o schema.sql trava tudo pra role "authenticated". Sem login ainda,
   então por enquanto o app só verifica se dá pra alcançar o Supabase —
   os dados continuam indo pro Store (localStorage) até o login existir. */
const SUPABASE_URL = 'https://ttqflxpsqmkzfrjvjtvp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cWZseHBzcW1remZyanZqdHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDQyOTUsImV4cCI6MjEwMTcyMDI5NX0.jBNfursbYMc8U6DVQ7Aw93McEM7CwMuWJFTGuDxCk14';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
/* "Load failed" (Safari), "Failed to fetch" (Chrome) e afins: a requisição nem
   chegou ao servidor. Não é senha errada — é internet ou o Supabase fora do ar. */
const ehFalhaDeRede = err => /load failed|failed to fetch|networkerror|network request failed|timeout|conex/i
  .test(String((err && err.message) || err));
let sbStatus = 'checando';   // 'checando' | 'online' | 'offline'
async function checarSupabase() {
  if (!sb) { sbStatus = 'offline'; updateSyncChip(); return; }
  try {
    /* o cliente não lança em falha de rede: devolve { error }. Sem olhar esse
       error, o app se dava por online com a internet caída. */
    const { error } = await sb.from('configuracoes').select('id', { head: true, count: 'exact' });
    sbStatus = error && ehFalhaDeRede(error) ? 'offline' : 'online';
  } catch (e) {
    sbStatus = 'offline';
  }
  updateSyncChip();
}

/* ─────────── Persistência (Store resiliente) ─────────── */
const Store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } },
    del(k) { try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();
const DB_KEY = 'domtavares_db';
const CONFIG_PADRAO = {
  nomeUsuario: 'Tavares',          // como o app se dirige ao dono
  nomeBarbearia: 'Dom Tavares',
  abertura: '09:00', fechamento: '20:00',
  inativoDias: 45, pontosPorCorte: 1, pontosResgate: 10,
  projecaoPadrao: 5000             // quanto assumir de faturamento num mês que ainda não começou
};

/* ─────────── Helpers ─────────── */
/* UUID de verdade: as tabelas do Supabase usam uuid como chave primária */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    }));
const ehUUID = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s || ''));
/* negativo em real é "-R$ 100,00", não "R$ -100,00" */
const money = v => { const n = Number(v) || 0;
  return (n < 0 ? '-R$ ' : 'R$ ') + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const moneyShort = v => { const n = Number(v) || 0;
  return (n < 0 ? '-R$ ' : 'R$ ') + Math.abs(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 }); };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const pad2 = n => String(n).padStart(2, '0');
/* datas SEMPRE em ISO local — nunca toISOString() (bug de fuso) */
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monthKey = iso => String(iso || '').slice(0, 7);
const curMonthKey = () => monthKey(todayISO());
const hhmmToMin = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + (b || 0); };
const minToHHMM = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
const DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MES_LONGO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const fmtDate = iso => { if (!iso) return '—'; const d = parseISO(iso); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`; };
const fmtDateLong = iso => { if (!iso) return '—'; const d = parseISO(iso); return `${DOW[d.getDay()]}, ${pad2(d.getDate())} ${MES[d.getMonth()]}`; };
const fmtMonth = mk => { const [y, m] = mk.split('-'); return `${MES_LONGO[Number(m) - 1]}/${y}`; };
const initials = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase();
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
const somaBy = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const onlyDigits = s => String(s || '').replace(/\D/g, '');
function waLink(tel, msg) {
  const d = onlyDigits(tel);
  const full = d.length <= 11 ? '55' + d : d;
  return `https://wa.me/${full}?text=${encodeURIComponent(msg || '')}`;
}
const SVG_WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.95 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47 0 1.45 1.07 2.86 1.22 3.06.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.71 2-1.4.25-.69.25-1.28.17-1.4-.07-.13-.27-.2-.57-.35zM12 2C6.48 2 2 6.48 2 12c0 1.77.46 3.43 1.27 4.87L2 22l5.25-1.24A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>';
function waBtn(tel, msg, label) {
  if (!onlyDigits(tel)) return '';
  return `<a class="wa-btn" href="${waLink(tel, msg)}" target="_blank" rel="noopener">
    <span class="wa-glifo">${SVG_WA}</span>
    ${esc(label || 'WhatsApp')}</a>`;
}

/* ─────────── confirmação de horário pelo WhatsApp ───────────
   Um único texto para o app inteiro: agenda do dia, lista da semana e
   detalhe do atendimento mandam exatamente a mesma mensagem. */
function msgConfirmacao(a) {
  const c = getCli(a.clienteId) || {};
  const dias = Math.round((parseISO(a.data) - parseISO(todayISO())) / 86400000);
  const quando = dias === 0 ? `hoje (${fmtDate(a.data)})`
    : dias === 1 ? `amanhã (${fmtDate(a.data)})`
    : `${diaSemanaLongo(a.data).split(' ')[0].toLowerCase()}, ${fmtDate(a.data)}`;
  const srv = nomesServicosDe(a);
  return `Olá, ${firstName(c.nome)}! Aqui é da ${nomeBarbearia()}.\n\n`
    + `Você tem horário marcado para ${quando} às ${a.hora}${srv ? ` — ${srv}` : ''}.\n\n`
    + `Consegue vir? Se precisar remarcar, é só me avisar por aqui que eu ajeito. 💈`;
}
/* botão redondo só com o ícone, para caber na lista sem roubar espaço */
function waIco(a) {
  const c = getCli(a.clienteId) || {};
  if (!onlyDigits(c.tel)) return '';
  const feito = jaEnviou(a.clienteId, 'confirmar');
  return `<a class="wa-ico${feito ? ' enviado' : ''}" href="${waLink(c.tel, msgConfirmacao(a))}"
    target="_blank" rel="noopener" title="${feito ? 'Confirmação já enviada hoje' : 'Perguntar no WhatsApp se ele vem'}"
    aria-label="Confirmar por WhatsApp"
    onclick="event.stopPropagation();registrarConfirma('${a.clienteId}')">${SVG_WA}</a>`;
}
function registrarConfirma(clienteId) {
  if (!clienteId || jaEnviou(clienteId, 'confirmar')) return;
  db.msgLog.push({ id: uid(), clienteId, seg: 'confirmar', data: todayISO() });
  saveDB();
  /* redesenha depois, senão o link some antes de o WhatsApp abrir */
  setTimeout(render, 600);
}
let toastT = null;
function toast(msg, ico) {
  const el = document.getElementById('toast');
  el.querySelector('.ico').textContent = ico || '✂️';
  el.querySelector('.tx').innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 4200);
}

/* ─────────── Estado ─────────── */
let db = null;
const getCli = id => db.clientes.find(c => c.id === id);
const getProf = id => db.profissionais.find(p => p.id === id);

function loadDB() {
  const raw = Store.get(DB_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.profissionais) { db = parsed; normalizeDB(); return; }
    } catch (e) { /* cai nos dados iniciais */ }
  }
  db = dadosIniciais();
  saveDB();
}
function normalizeDB() {
  const base = { profissionais: [], servicos: [], clientes: [], agendamentos: [], agendamentoServicos: [], financeiro: [], metas: [], custosFixos: [], folgas: [], msgLog: [] };
  Object.keys(base).forEach(k => { if (!Array.isArray(db[k])) db[k] = base[k]; });
  db.config = Object.assign({}, CONFIG_PADRAO, db.config || {});
  migrarServicoUnicoParaLista();
}
/* dado antigo (de antes de vários serviços por atendimento) tinha um servicoId
   solto no agendamento; converte pra um item de agendamentoServicos, sem tocar
   no campo antigo — idempotente, roda toda vez que carrega. */
function migrarServicoUnicoParaLista() {
  const jaTem = new Set(db.agendamentoServicos.map(x => x.agendamentoId));
  (db.agendamentos || []).forEach(a => {
    if (a.servicoId && !jaTem.has(a.id)) {
      db.agendamentoServicos.push({
        id: uid(), agendamentoId: a.id, servicoId: a.servicoId,
        valor: a.valor !== undefined && a.valor !== null ? Number(a.valor) : precoSrv(a.servicoId)
      });
    }
  });
}
const servicosDoAgendamento = agId => (db.agendamentoServicos || []).filter(x => x.agendamentoId === agId);

/* ─── Folga e almoço ───
   Três situações do mundo real: almoço todo dia, folga fixa na semana
   (ex.: não abre domingo) e folga avulsa (feriado, viagem, médico). */
const DOW_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const folgaAvulsa = (profId, data) => (db.folgas || []).find(f => f.profissionalId === profId && f.data === data);
function ehFolga(profId, data) {
  const p = getProf(profId);
  if (!p) return null;
  const avulsa = folgaAvulsa(profId, data);
  if (avulsa) return { tipo: 'avulsa', motivo: avulsa.motivo || 'Folga', id: avulsa.id };
  const dow = parseISO(data).getDay();
  if ((p.folgaSemanal || []).includes(dow)) return { tipo: 'semanal', motivo: `Folga de ${DOW_LONGO[dow].toLowerCase()}` };
  return null;
}
/* intervalo de almoço do profissional em minutos, ou null se não configurou */
function almocoDe(profId) {
  const p = getProf(profId);
  if (!p || !p.almocoInicio || !p.almocoFim) return null;
  const ini = hhmmToMin(p.almocoInicio), fim = hhmmToMin(p.almocoFim);
  return fim > ini ? { ini, fim, label: `${p.almocoInicio} às ${p.almocoFim}` } : null;
}
/* o atendimento cai no almoço? compara o intervalo inteiro, não só o começo */
function bateNoAlmoco(profId, hora, duracao) {
  const a = almocoDe(profId);
  if (!a) return null;
  const ini = hhmmToMin(hora), fim = ini + (duracao || 30);
  return (ini < a.fim && a.ini < fim) ? a : null;
}
/* nome pra mostrar em listas: "Corte" · "Corte + Barba" · "Corte + 2" quando são muitos */
function nomesServicosDe(ag) {
  const itens = servicosDoAgendamento(ag.id);
  if (!itens.length) return '—';
  const nomes = itens.map(i => nomeSrv(i.servicoId));
  return nomes.length <= 2 ? nomes.join(' + ') : `${nomes[0]} + ${nomes.length - 1}`;
}
/* app "em branco" = sem catálogo cadastrado (o dono ainda não montou a barbearia dele) */
const appVazio = () => db.servicos.length === 0;
function saveDB() {
  db._upd = Date.now();
  Store.set(DB_KEY, JSON.stringify(db));          // cache local: abre rápido e funciona sem sinal
  agendarSync();                                   // e sobe as mudanças para o Supabase
  updateSyncChip();
}
function updateSyncChip() {
  const d = new Date(db._upd || Date.now());
  const hora = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  const txt = sbStatus !== 'online' ? `Só neste aparelho · ${hora}`
    : syncEstado === 'enviando' ? 'Salvando na nuvem…'
    : syncEstado === 'erro' ? 'Falha ao salvar na nuvem'
    : `Na nuvem · ${hora}`;
  const chip = document.getElementById('syncChip');
  chip.classList.toggle('saving', syncEstado === 'enviando');
  chip.classList.toggle('erro', syncEstado === 'erro');
  chip.classList.toggle('offline', sbStatus !== 'online');
  document.getElementById('syncLabel').textContent = txt;
}

const COLECOES = Object.keys(MAP);
const configToRow = c => ({ id: true, nome_usuario: c.nomeUsuario, nome_barbearia: c.nomeBarbearia,
  abertura: c.abertura, fechamento: c.fechamento, inativo_dias: num(c.inativoDias) || 45,
  pontos_por_corte: num(c.pontosPorCorte) || 0, pontos_resgate: num(c.pontosResgate) || 10,
  projecao_padrao: num(c.projecaoPadrao) || 0 });
const configFromRow = r => ({ nomeUsuario: r.nome_usuario, nomeBarbearia: r.nome_barbearia,
  abertura: hhmm(r.abertura), fechamento: hhmm(r.fechamento), inativoDias: Number(r.inativo_dias),
  pontosPorCorte: Number(r.pontos_por_corte), pontosResgate: Number(r.pontos_resgate),
  projecaoPadrao: r.projecao_padrao === null || r.projecao_padrao === undefined
    ? CONFIG_PADRAO.projecaoPadrao : Number(r.projecao_padrao) });

let nuvem = null;              // espelho do que já está no Supabase
/* O espelho também vai pro localStorage. Sem ele, ao reconectar o app não teria
   como saber o que foi feito offline — e `conectarNuvem()` substituiria tudo
   pelos dados da nuvem, apagando o trabalho do dia. */
const NUVEM_KEY = 'domtavares_nuvem';
let espelhoSalvo = null;
const guardarEspelho = () => { try { Store.set(NUVEM_KEY, JSON.stringify(nuvem)); } catch (e) { /* cota cheia: só perde o atalho */ } };
function carregarEspelho() {
  try { const r = Store.get(NUVEM_KEY); espelhoSalvo = r ? JSON.parse(r) : null; }
  catch (e) { espelhoSalvo = null; }
}
/* quantas linhas mudaram neste aparelho desde a última vez que falamos com a nuvem */
function pendenciasOffline() {
  if (!espelhoSalvo) return 0;
  let n = 0;
  for (const chave of COLECOES) {
    const m = MAP[chave];
    const antes = new Map((espelhoSalvo[chave] || []).map(o => [o.id, JSON.stringify(m.toRow(o))]));
    const agora = db[chave] || [];
    n += agora.filter(o => antes.get(o.id) !== JSON.stringify(m.toRow(o))).length;
    const ids = new Set(agora.map(o => o.id));
    n += [...antes.keys()].filter(id => !ids.has(id)).length;
  }
  return n;
}
let syncEstado = 'ok';         // 'ok' | 'enviando' | 'erro'
let syncTimer = null;

function agendarSync() {
  if (!sb || sbStatus !== 'online' || !nuvem) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sincronizar, 400);   // junta rajadas de saveDB numa só ida
}

/* Colunas que o banco ainda não tem. Enquanto o SQL não roda, o app não pode
   PERDER o lançamento — ele grava sem o campo desconhecido e segue.
   Isso já custou 46 receitas: o app dependia de `pago` antes da coluna existir. */
const colunasIgnoradas = {};
const nomeColunaDoErro = err => {
  const m = /Could not find the '([^']+)' column/.exec(err.message || '');
  if (m) return m[1];
  const m2 = /column "?([a-z_]+)"? of relation/.exec(err.message || '');
  return m2 ? m2[1] : null;
};
/* remove das linhas as colunas que já sabemos que o banco não conhece */
function semColunasIgnoradas(tabela, rows) {
  const fora = colunasIgnoradas[tabela];
  if (!fora || !fora.size) return rows;
  return rows.map(r => { const c = { ...r }; fora.forEach(k => delete c[k]); return c; });
}
/* upsert que, ao esbarrar em coluna inexistente, tira a coluna e tenta de novo */
async function upsertTolerante(tabela, rows) {
  for (let tentativa = 0; tentativa < 6; tentativa++) {
    const { error } = await sb.from(tabela).upsert(semColunasIgnoradas(tabela, rows));
    if (!error) return { ok: true, ignoradas: [...(colunasIgnoradas[tabela] || [])] };
    const col = error.code === 'PGRST204' || error.code === '42703' ? nomeColunaDoErro(error) : null;
    if (!col) return { ok: false, error };
    (colunasIgnoradas[tabela] = colunasIgnoradas[tabela] || new Set()).add(col);
  }
  return { ok: false, error: new Error(`${tabela}: colunas demais faltando`) };
}

/* manda para a nuvem apenas as linhas que mudaram desde o último espelho */
async function sincronizar() {
  if (!sb || sbStatus !== 'online' || !nuvem) return;
  syncEstado = 'enviando'; updateSyncChip();
  const falhas = [];
  const faltaNoBanco = [];
  const colunasPuladas = new Set();
  /* tabela/coluna que ainda não existe no banco não pode derrubar o resto da sincronização */
  const ehEstruturaFaltando = err => ['PGRST205', 'PGRST204', '42P01', '42703', '23514'].includes(err.code);

  for (const chave of COLECOES) {
    const m = MAP[chave];
    try {
      const atuais = db[chave] || [];
      const antes = new Map((nuvem[chave] || []).map(o => [o.id, JSON.stringify(m.toRow(o))]));
      const linhas = atuais.filter(o => antes.get(o.id) !== JSON.stringify(m.toRow(o)));
      const idsAgora = new Set(atuais.map(o => o.id));
      const apagar = [...antes.keys()].filter(id => !idsAgora.has(id));

      if (linhas.length) {
        const res = await upsertTolerante(m.tabela, linhas.map(m.toRow));
        (res.ignoradas || []).forEach(c => colunasPuladas.add(`${m.tabela}.${c}`));
        if (!res.ok) {
          const error = res.error;
          if (!ehEstruturaFaltando(error)) throw error;
          /* uma linha recusada não pode travar a coleção toda: reenvia uma a uma
             para que só a problemática fique de fora */
          let algumaFalhou = null;
          const ok = [];
          for (const o of linhas) {
            const r1 = await upsertTolerante(m.tabela, [m.toRow(o)]);
            if (!r1.ok) algumaFalhou = r1.error; else ok.push(o);
          }
          if (algumaFalhou) {
            /* marca como sincronizado só o que passou, para tentar o resto depois */
            const passou = new Set(ok.map(o => o.id));
            nuvem[chave] = (db[chave] || []).filter(o => passou.has(o.id) || antes.has(o.id))
              .map(o => JSON.parse(JSON.stringify(o)));
            throw algumaFalhou;
          }
        }
      }
      if (apagar.length) {
        const { error } = await sb.from(m.tabela).delete().in('id', apagar);
        if (error) throw error;
      }
      nuvem[chave] = JSON.parse(JSON.stringify(atuais));      // só marca como sincronizado o que deu certo
    } catch (e) {
      if (ehEstruturaFaltando(e)) faltaNoBanco.push(m.tabela);
      else falhas.push(`${m.tabela}: ${e.message || e}`);
    }
  }
  try {
    if (JSON.stringify(configToRow(db.config)) !== JSON.stringify(configToRow(nuvem.config || {}))) {
      const { error } = await sb.from('configuracoes').upsert(configToRow(db.config));
      if (error) throw error;
      nuvem.config = JSON.parse(JSON.stringify(db.config));
    }
  } catch (e) {
    if (ehEstruturaFaltando(e)) faltaNoBanco.push('configuracoes'); else falhas.push(`configuracoes: ${e.message || e}`);
  }

  guardarEspelho();
  if (faltaNoBanco.length || colunasPuladas.size) {
    syncEstado = 'erro';
    const oQueFalta = [...new Set([...faltaNoBanco, ...colunasPuladas])].join(', ');
    toast(`Falta criar no banco: <b>${esc(oQueFalta)}</b>.<br><small>Rode o schema.sql atualizado no Supabase. O resto já foi salvo na nuvem.</small>`, '🗄️');
  } else if (falhas.length) {
    syncEstado = 'erro';
    toast(`Não consegui salvar tudo na nuvem: ${esc(falhas[0])}<br><small>Os dados estão salvos neste aparelho.</small>`, '⚠️');
  } else {
    syncEstado = 'ok';
  }
  updateSyncChip();
}

/* baixa tudo do Supabase para dentro do `db` */
async function baixarDaNuvem() {
  const res = await Promise.all(COLECOES.map(k => sb.from(MAP[k].tabela).select('*')));
  /* tabela ainda não criada volta vazia em vez de derrubar a leitura inteira */
  const erro = res.find(r => r.error && !['PGRST205', '42P01'].includes(r.error.code));
  if (erro) throw new Error(erro.error.message);
  const baixado = {};
  COLECOES.forEach((k, i) => { baixado[k] = (res[i].data || []).map(MAP[k].fromRow); });
  const cfg = await sb.from('configuracoes').select('*').limit(1);
  if (cfg.error) throw new Error(cfg.error.message);
  baixado.config = cfg.data && cfg.data[0]
    ? Object.assign({}, CONFIG_PADRAO, configFromRow(cfg.data[0]))
    : Object.assign({}, CONFIG_PADRAO);
  return baixado;
}

/* IDs antigos eram curtos (não-UUID). Antes de subir, troca por UUID
   e conserta todas as referências entre as tabelas. */
function migrarIdsParaUUID() {
  const mapa = new Map();
  const novoId = velho => {
    if (!velho) return velho;
    if (ehUUID(velho)) return velho;
    if (!mapa.has(velho)) mapa.set(velho, uid());
    return mapa.get(velho);
  };
  COLECOES.forEach(k => (db[k] || []).forEach(o => { o.id = novoId(o.id); }));
  (db.agendamentos || []).forEach(a => {
    a.clienteId = novoId(a.clienteId); a.profissionalId = novoId(a.profissionalId);
    if (a.servicoId) a.servicoId = novoId(a.servicoId);   // campo legado, só some da leitura
  });
  (db.agendamentoServicos || []).forEach(x => { x.agendamentoId = novoId(x.agendamentoId); x.servicoId = novoId(x.servicoId); });
  (db.financeiro || []).forEach(f => { if (f.agendamentoId) f.agendamentoId = novoId(f.agendamentoId); });
  (db.msgLog || []).forEach(l => { l.clienteId = novoId(l.clienteId); });
  return mapa.size;
}

/* Decide quem manda na hora de entrar: nuvem cheia vence; nuvem vazia recebe o local. */
async function conectarNuvem() {
  if (!sb || sbStatus !== 'online') return;
  try {
    /* O que foi feito offline sobe ANTES de baixar. Invertendo a ordem, a nuvem
       — que não conhece essas linhas — sobrescreveria o trabalho do dia. */
    const pendentes = pendenciasOffline();
    if (pendentes) {
      nuvem = espelhoSalvo;
      await sincronizar();
      if (syncEstado === 'ok') {
        espelhoSalvo = null;
        toast(`${pendentes} alteração(ões) feita(s) sem internet foram para a nuvem.`, '☁️');
      }
    }
    const remoto = await baixarDaNuvem();
    const temNaNuvem = COLECOES.some(k => (remoto[k] || []).length);
    const temLocal = COLECOES.some(k => (db[k] || []).length);
    if (temNaNuvem) {
      /* espelho tirado ANTES da normalização: se ela migrar dado antigo (ex.: serviço
         único virando item da lista), esse item ainda não existe de verdade na nuvem —
         precisa continuar "diferente" pra sincronizar() mandar ele pra lá */
      const espelho = JSON.parse(JSON.stringify({ ...COLECOES.reduce((a, k) => (a[k] = remoto[k] || [], a), {}), config: remoto.config }));
      db = Object.assign(remoto, { _upd: Date.now() });
      normalizeDB();
      nuvem = espelho;
      Store.set(DB_KEY, JSON.stringify(db));
      agendarSync();
    } else if (temLocal) {
      const trocados = migrarIdsParaUUID();
      nuvem = { config: {} }; COLECOES.forEach(k => (nuvem[k] = []));
      await sincronizar();
      if (syncEstado === 'ok') toast(`Seus dados foram para a nuvem${trocados ? '' : ''} — agora abrem em qualquer aparelho.`, '☁️');
    } else {
      nuvem = { config: {} }; COLECOES.forEach(k => (nuvem[k] = []));
      await sincronizar();
    }
    guardarEspelho();
  } catch (e) {
    sbStatus = 'offline';
    toast(`Não consegui ler a nuvem: ${esc(e.message)}<br><small>Trabalhando só neste aparelho.</small>`, '📴');
  }
  atualizarBarraOffline();
  updateSyncChip();
  render();
}

/* ─────────── Métricas ─────────── */
/* barbearia de um homem só: sem sócio nem comissionado, a aba de comissões só polui a tela */
const equipeSimples = () => db.profissionais.filter(p => Number(p.comissao) > 0).length === 0;
/* Valor do atendimento: depois de concluído vale o preço congelado na conclusão,
   nunca o preço atual da tabela — senão reajustar um serviço reescreveria o passado. */
function valorDe(ag) {
  return ag && ag.valor !== undefined && ag.valor !== null ? Number(ag.valor) : somaBy(servicosDoAgendamento(ag.id), x => x.valor);
}
function comissaoDe(ag) {
  const pct = ag && ag.comissaoPct !== undefined && ag.comissaoPct !== null
    ? Number(ag.comissaoPct)
    : Number((getProf(ag.profissionalId) || {}).comissao) || 0;
  return valorDe(ag) * pct / 100;
}
/* despesa sem escopo definido conta como da barbearia (é o padrão e o caso comum) */
const ehPessoal = f => f.escopo === 'pessoal';
function metrics(mk) {
  mk = mk || curMonthKey();
  const fin = db.financeiro.filter(f => monthKey(f.data) === mk);
  const receita = somaBy(fin.filter(f => f.tipo === 'receita'), f => f.valor);
  const despesas = fin.filter(f => f.tipo === 'despesa');
  const despesa = somaBy(despesas, f => f.valor);                          // total que saiu do caixa
  const despesaBarbearia = somaBy(despesas.filter(f => !ehPessoal(f)), f => f.valor);
  const despesaPessoal = somaBy(despesas.filter(ehPessoal), f => f.valor);
  const conclMes = db.agendamentos.filter(a => a.status === 'concluido' && monthKey(a.data) === mk);
  const ticket = conclMes.length ? somaBy(conclMes, a => valorDe(a)) / conclMes.length : 0;
  const hoje = db.agendamentos.filter(a => a.data === todayISO() && a.status !== 'cancelado');
  const comissoes = somaBy(conclMes, comissaoDe);
  const meta = db.metas.find(m => m.mes === mk);
  /* lucro = resultado do NEGÓCIO (não desconta o que é do bolso dele);
     sobraFinal = o que realmente sobra depois de pagar as contas pessoais */
  const lucro = receita - despesaBarbearia - comissoes;
  return {
    mk, receita, despesa, despesaBarbearia, despesaPessoal,
    lucro, sobraFinal: lucro - despesaPessoal,
    conclMes, ticket, hoje, comissoes,
    meta: meta ? meta.valor : 0, metaPct: meta && meta.valor ? pct(receita, meta.valor) : null
  };
}
function ultimaVisita(clienteId) {
  const l = db.agendamentos.filter(a => a.clienteId === clienteId && a.status === 'concluido')
    .map(a => a.data).sort();
  return l.length ? l[l.length - 1] : null;
}
function clientesInativos() {
  const lim = isoOf(addDays(new Date(), -(Number(db.config.inativoDias) || 45)));
  return db.clientes.map(c => ({ c, ult: ultimaVisita(c.id) }))
    .filter(x => !x.ult || x.ult < lim)
    .sort((a, b) => String(a.ult || '').localeCompare(String(b.ult || '')));
}
function comissoesPorProf(mk) {
  mk = mk || curMonthKey();
  return db.profissionais.map(p => {
    const ags = db.agendamentos.filter(a => a.profissionalId === p.id && a.status === 'concluido' && monthKey(a.data) === mk);
    const fat = somaBy(ags, a => valorDe(a));
    return { p, atend: ags.length, fat, comissao: fat * (Number(p.comissao) || 0) / 100 };
  });
}

}

      <div class="s">${hojeList.length ? `Primeiro às ${hojeList[0].hora} · ${esc(nomeCli(hojeList[0].clienteId))} com ${esc(nomeProf(hojeList[0].profissionalId))}` : 'Agenda livre. Que tal chamar os clientes inativos?'}</div>

    ${stat(ICO.ticket, 'Ticket médio', money(m.ticket), 'por atendimento concluído', 'valor')}
    ${stat(ICO.clock, 'Atendimentos hoje', String(m.hoje.length), `${naoConf.length} a confirmar`, '', naoConf.length ? 'neg' : '')}
    ${equipeSimples()
      ? stat(ICO.hand, 'Sobra do mês', money(m.lucro), 'receitas − despesas', 'valor', m.lucro < 0 ? 'neg' : 'pos')
      : stat(ICO.hand, 'Comissões a pagar', money(m.comissoes), 'acumulado do mês', 'valor', 'neg')}
  </div>

  ${m.meta ? `
  <div class="goal">
    <div class="gh">
      <span class="gt">Meta de ${fmtMonth(m.mk)}</span>
      <span class="gv"><span class="valor-oculto">${money(m.receita)} de ${money(m.meta)}</span> · faltam <b class="valor-oculto" style="color:var(--text)">${money(Math.max(0, m.meta - m.receita))}</b></span>
    </div>
    <div class="gtrack"><div class="gfill" style="width:${Math.min(100, m.metaPct)}%"></div></div>

    <button class="mini" onclick="irParaMetas()">Definir meta</button></div></div>`}

  <div class="p-row2">

      ${prox.length ? prox.map(a => `

          <div class="lbar" style="background:${corProf(a.profissionalId)}"></div>

  <div class="p-row2">
    <div class="p-block">
      <span class="pb-label">Lembrar hoje <span class="tag neutro">${naoConf.length}</span></span>
      ${naoConf.length ? naoConf.map(a => {
        const c = getCli(a.clienteId) || {};
        const msg = `Olá ${firstName(c.nome)}! Aqui é da Barbearia Dom Tavares. Confirmando seu horário hoje às ${a.hora} com ${nomeProf(a.profissionalId)}. Podemos confirmar?`;

          <div class="lbar" style="background:${corProf(a.profissionalId)}"></div>
          <div class="lbody">

    <div class="p-block">
      <span class="pb-label">Recuperar clientes <span class="tag neutro">${inativos.length}</span></span>
      ${inativos.length ? inativos.slice(0, 6).map(x => {
        const msg = `Olá ${firstName(x.c.nome)}! Faz um tempo que você não aparece na Dom Tavares. Bora marcar um horário? ✂️`;
        return `<div class="li">
          <div class="ava">${esc(initials(x.c.nome))}</div>
          <div class="lbody">
            <div class="lt">${esc(x.c.nome)}</div>
            <div class="lm">${x.ult ? 'Última visita ' + fmtDateLong(x.ult) : 'Nunca atendido'}</div>
          </div>
          ${waBtn(x.c.tel, msg, 'Chamar')}

  </div>

  <div class="p-block" style="margin-top:16px">
    <span class="pb-label">Aniversariantes de ${MES_LONGO[new Date().getMonth()]}</span>
    ${nivers.length ? nivers.map(c => {
      const dia = Number(c.nasc.slice(8, 10));
      const msg = `Parabéns, ${firstName(c.nome)}! 🎉 A Dom Tavares te deseja tudo de bom — passa aqui pra comemorar com um corte.`;
      return `<div class="li">
        <div class="ava">${esc(initials(c.nome))}</div>
        <div class="lbody">
          <div class="lt">${esc(c.nome)} <span class="tag brass">dia ${dia}</span></div>
          <div class="lm">${c.pontos || 0} ponto(s) de fidelidade</div>
        </div>
        ${waBtn(c.tel, msg, 'Parabenizar')}

function card(num, lbl, hint, ico, small) {
